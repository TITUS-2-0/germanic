text:
- body:
  - front:
    - titlePage:
      - docTitle:
        - titlePart[lg=lat-Latn]:
          - p:
            - ISIDORI HISPALENSIS EPISCOPI DE FIDE CATHOLICA EX VETERI ET NOVO TESTAMENTO
              CONTRA IUDAEOS AD FLORENTINAM SOROREM
        - titlePart[lg=und-Latn-x-general]:
          - p:
            - 'DIE ALTHOCHDEUTSCHE ÜBERSETZUNG: DER ALTHOCHDEUTSCHE ISIDOR'
  - chapter[n=1]:
    - pb[n=0000v,facs=#W0000v]
    - pb[type=manuscript,n=E1,facs=#E1]
    - head:
      - I.
      - QUOMODO CHRISTUS A DEO PATRE GENITUS EST.
    - p:
      - s[n=1]:
        - foreign[lg=lat-Latn]: Iudei nefaria incredulitate christum dei filium abnegantes,
            impii, duri corde, prophetis ueteribus increduli nouis obstrusi, aduentum
            christi malunt ignorare quam nosse, negare quam credere. Quem enim uenturum
            accipiunt, uenisse iam nolunt. Quem resurrecturum legunt, resurrexisse
            non credunt.
      - s[n=2]:
        - foreign[lg=lat-Latn]: 'Sed ideo ista non intellegere se fingunt, quia sacrilegio
            suo hec impleta cognoscunt. Ad quorum refellendam perfidiam quaedam ex
            ueteri testamento adgregauimus testimonia, quibus christum genitum ab
            omnipotente patre cognoscant ipso testante: »Tecum principium in die uirtutis
            tuę, in splendoribus sanctorum, ex utero ante luciferum genui te«. Ex
            utero itaque, id est ex illa intima et inconprehensibili patris substantia
            siue ex illo diuino atque inmenso paterni pectoris archano, quo pater
            genitor de corde bono bonum eructat uerbum.'
      - s[n=3]:
        - foreign[lg=lat-Latn]: 'Sicut et alias ipse ait: »Eructauit cor meum uerbum
            bonum«. Atque alibi ipse pater sic dicit: »Filius meus es tu, ego hodie
            genui te«. Quod non est dictum dauid neque ulli sequentium regum. Nam
            et ibi additur: »Pete a me et dabo tibi gentes hereditatem tuam et possessionem
            tuam terminos terrę«. Quod neque dauid neque genti hebreorum concessum
            est nisi tantummodo christo, cuius nomen est per omnes gentes diffusum,
            cui reges obediunt et gentes seruiunt. Sicut et alibi de eo scribtum est:
            »Adorabunt eum omnes reges terrę, omnes gentes seruient ei«.'
      - s[n=4]:
        - foreign[lg=lat-Latn]: Item salomon, dum patris nomen mysteriumque
        - pb[type=manuscript,n=E2,facs=#E2]
        - foreign[lg=lat-Latn]: 'natiuitatis christi secundum deitatem uellet agnoscere,
            his uerbis intonat in prouerbiis dicens: »Quis ascendit in cęlum atque
            descendit? Quis conligauit aquas quasi in uestimento? Quis suscitauit
            omnes terminos terrę? quod nomen est illi? Aut quod nomen filii eius,
            si nostis?«'
      - s[n=5]:
        - seg:
          - foreign[lg=lat-Latn]: 'Hunc filium dei in danihelo rex ille impius aspiciens
              dixit: »Ecce ego uideo uiros quatuor solutos et ambulantes in medio
              ignis, et nihil corruptionis in eis est et species quarti similis filio
              dei«. Quem fideliter credimus nec ullatenus dubitamus dominum saluatorem
              esse. Sed obicitur quod in danihelo iste filius dei superius etiam angelus
              nominatur. Adsentio; nam et christus filius dei angelus dicitur. Sic
              enim ait propheta de ipso: »Ueniet ad templum sanctum suum dominator,
              quem uos quaeritis, et angelus testamenti, quem uos desideratis«.'
        - seg:
          - pb[type=manuscript,n=W00r,facs=#W00r]
          - zuiflomes stritant ... ... sun gotes Sus gauuisso quad der forasago sinemo
            den ir sohhet, des ir neotot.
      - s[n=6]:
        - seg:
          - foreign[lg=lat-Latn]: 'Christus enim in eo quod a patre genitus est, filius
              dei uocatur, in eo uero, quod sepe a patre missus ad adnuntiandum patribus
              legitur, angelus nominatur. De quo etiam ipse pater ad legislatorem
              ita protestatur dicens: »Ecce mitto angelum meum, qui praecedat et custodiat
              te in uia et introducat ad locum, quem paraui. Obserua eum et audi uocem
              eius nec contempnendum putes, qui non dimittet, cum peccaueritis, et
              est nomen eius in illo«.'
        - seg:
          - 'daz er fona fater ist gaboran, gotes sunu ist ganemnit ist galesan bifora
            za chundenne fona demo selbo fater bifora chundita, quad: enti dih za
            deru steti, dea ih garauuida. imo du inan suntot'
      - s[n=7]:
        - seg:
          - foreign[lg=lat-Latn]: Quis est ergo iste angelus, cui deus dat potestatem
              suam? Dedit et nomen. Quodsi dicitur aliqua alia est potestas angelica,
              hoc nefas est credere. »Quis enim in nubibus aequabitur domino, aut
              quis similis erit deo inter filios dei?« Qui enim non aequabitur natura,
              non potest aequari et nomine. Ipse est enim filius, qui semper a patre
              missus
          - pb[type=manuscript,n=W00v,facs=#W00v]
          - foreign[lg=lat-Latn]: 'uisibiliter apparebat hominibus. Ex ipsa ergo missione
              angelus recte nuncupatur. Esaias autem apertius filium a deo genitum
              confirmans ita adnuntiat: »Uox domini reddentis retributionem inimicis
              suis«. Ipsis uidelicet iudeis, qui non credunt. »Antequam parturiret,
              peperit, et antequam ueniret partus eius, peperit masculum«.'
        - seg:
          - Huuer ist danne dese aengil gauualtida truhtine gote untar allem gotes
            sunim der selbo gauuisso ist sunu, der simbles fona fater gasentit
          - pb[type=manuscript,n=W0r,facs=#W0r]
          - 'augta sih sid auar az aucsiuni manno. Fona deru selbun sentidu ist angil
            ... ganemnit. Isaias auh offonor den selbun sunu fona fater gaboranan
            gafestinota, duo er quad: »Truhtines stimna geldenti uuidarloon sinem
            fiantum«, bauhnenti dea selbun iudeoliuti, dea ni galaubant. Sus chuad
            auh der forasago: »Aer * danne ... gabar, enti aer denne iru biquami ...
            gabar manchunt«.'
      - s[n=8]:
        - seg:
          - foreign[lg=lat-Latn]: 'Quasi aperte diceret: Antequam christum uirgo parturiret
              in carne, genuit filium in diuinitate pater, et antequam tempus uirginis
              parturiendi ueniret, genuit eum sine tempore pater. Unde inferius ait:
              »Quis audiuit umquam tale aut quis uidit huic simile«? Re uera, quia
              nihil tale in hominibus accidit aut quippiam simile. Et post hec subiunxit:
              »Numquid qui alios parere facio, ipse non pariam? dicit dominus, et
              qui generationem ceteris tribuo, sterilis ero? dicit dominus«.'
          - pb[type=manuscript,n=E3,facs=#E3]
          - foreign[lg=lat-Latn]: 'Quibus omnibus testimoniis cogendus est infidelis,
              ut eligat sibi de duobus: aut christum filium dei credere aut mendaces
              putare prophetas, qui ista cecinerunt.'
        - seg:
          - 'So selbo der forasago offono quati: Aer danne diu magad christan gabar
            in fleische, gabar sunu in sineru gotnissu fater, enti aer danne dera
            magadi ziit biquami za gaberanne, gabar inan fater ano einigero ziteo
            bigin. Umbi diz quad der forasago dar after: »Huuer ist, der eo ... gahorti,
            odo huuer gasah eo desiu ... galihhes eo neouuiht mit mannum ... ... diu
            eouuiht kalihhes. enti dar after quad: »Inu ga ih andre gaborane katuoe,
            selbo ni gabere? quad truhtin. Enti ih andrem gibu za beranne, sculi ih
            uuesan unberandi«? Mit alleru deseru urchundi ist za ... der ni galaubit,
            daz imo zueio cheose: odo christan gotes sunu za galaubenne odo lucche
            ... forasagun, dea diz bifora chunditun.'
  - chapter[n=2]:
    - pb[n=00v,facs=#W00v]
    - pb[n=3,facs=#E3]
    - pb[n=0r,facs=#W0r]
    - head:
      - II.
      - QUIA CHRISTUS ANTE SAECULA INEFFABILITER GENITUS A PATRE EST.
    - head:
      - II.
      - UMBI DAZ QUIDIT HEAR HUUEO CHRISTUS AER FRUMISCAFTI UNARSAGLIHHO UUARD KABORAN
        FONA FATER.
    - p:
      - s[n=1]:
        - seg:
          - foreign[lg=lat-Latn]: 'Querunt multi, quando sit dei filius genitus, dum
              sit sua nativitate eternus, sicut scriptum est de eo: »Egressus eius
              a principio, a diebus eternitatis«. Et'
          - pb[type=manuscript,n=W0v,facs=#W0v]
          - foreign[lg=lat-Latn]: 'iterum: »Ante solem permanet nomen eius et ante
              lunam sedes eius«.'
        - seg:
          - 'Manage sint sohhenti, in huuelihheru ziti gotes sunu kaboran uurti, enti
            er ist eouuesanti so selb so umbi inan gascriban ist: »Sin uzganc'
      - s[n=2]:
        - seg:
          - foreign[lg=lat-Latn]: 'Sed et pater eundem ante luciferum, id est ante
              omnia tempora genuisse testatur, quod et ipse filius dei, uerbum, uirtus
              et sapientia, de sua natiuitate confirmat dicens: »Necdum erant abyssi,
              et ego iam concepta eram. Necdum fontes aquarum eruperant. Necdum montes
              graui mole constiterant, ante colles ego parturiebar. Adhuc terram'
          - pb[type=manuscript,n=P1r,facs=#P1r]
          - foreign[lg=lat-Latn]: non fecerat et flumina et cardines orbis terre.
              Quando praeparabat cęlos, aderam; quando certa lege et gyro uallabat
              abyssos, quando appendebat fundamenta terrę, cum eo eram cuncta componens«.
        - seg:
          - pb[type=manuscript,n=P1r,facs=#P1r]
          - »noh umbihringa mittingardes ęrdha. Dhuo ir himilo garauui frumida, dhar
            uuas ih; dhanne ir mit ęrcna euua abgrundiu uuazssar umbihringida, dhuo
            ir ęrdha stedila uuac, mit imu uuas ih dhanne al dhiz frummendi«.
      - s[n=3]:
        - seg:
          - foreign[lg=lat-Latn]: Tali igitur auctoritate ante omnia sęcula filius
              a patre genitus esse declaratur, quando a patre per illum cuncta creata
              esse noscuntur. Illud denuo queritur, quomodo idem sit genitus, dum
              sacrę natiuitatis eius archana nec apostolus dicit nec propheta conperit
              nec angelus sciuit
          - pb[type=manuscript,n=P1v,facs=#P1v]
          - foreign[lg=lat-Latn]: 'nec creatura cognouit Esaia * testante, qui dicit:
              »Generationem eius quis enarrauit«? Idcirco si eius natiuitas a propheta
              non potuit enarrari, quis confitebitur nosse, quomodo potuit a patre
              filius generari?'
        - seg:
          - Mit so mihhiles hęrduomes urchundin ist nu so offenliihho armarit, dhazs
            christ gotes sunu ęr allem uueraldim fona fater uuard chiboran. Dhanne
            ist nu chichundit, dhazs fona dhemu almahtigin fater dhurah inan ist al
            uuordan, dhazs chiscaffanes ist. Dhazs suohhant auur nu ithniuuues, huueo
            dher selbo sii chiboran, nu so ist in dheru sineru heilegun chiburdi so
            daucgal fater chiruni. Dhazs ni saget apostolus
          - pb[type=manuscript,n=P1v,facs=#P1v]
          - 'noh forasago ni bifant noh angil gotes ni uuista noh einic chiscaft ni
            archennida. Isaias so festinoda, dhar ir quhad: »christes chiburt huuer
            sia chirahhoda«? Bidhiu nu, ibu dher gotes forasago christes chiburt ni
            mahta arrahhon, huuer sih dhes biheizssit sia zi archennenne, huueo dher
            sunu mahti fona fater chiboran uuerdhan?'
      - s[n=4]:
        - seg:
          - foreign[lg=lat-Latn]: 'Hinc est et illud in libro iob: »sapientiam dei
              patris unde inuenies? latet enim ab oculis hominum et a uolucribus caeli
              absconsa est«, id est etiam ipsis angelis incognita. Item ibi: »Radix
              sapientię cui reuelata est«,'
          - pb[type=manuscript,n=P2r,facs=#P2r]
          - foreign[lg=lat-Latn]: origo scilicet filii dei. Ideoque quod etiam super
              angelorum intellegentiam atque scientiam est, quis hominum potest narrare?
        - seg:
          - 'Umbi dhazs selba quhad auh in iobes boohhum: »Spahida dhes gotliihhin
            fater huuanan findis? dhiu chiholan ist fona manno augom, ioh fona allem
            himilfleugendem ist siu chiborgan«. Siu ist chiuuisso selbem angilum unchundiu.
            So dhar auh ist chiscriban: »Dhiu uurza dhera spaida huuemu siu uuard
            antdhechidiu«?'
          - pb[type=manuscript,n=P2r,facs=#P2r]
          - Dhiu chiuuisso ist bighin gotes sunes. Bidhiu huuanda dhazs ziuuaare ist
            ubarhepfendi angilo firstandan ioh iro chiuuizs, huuer manno mac izs dhanne
            chirahhon?
      - s[n=5]:
        - seg:
          - foreign[lg=lat-Latn]: Scire autem manifestum est solum patrem, quomodo
              genuerit filium et filius quomodo genitus sit a patre. Siquidem et gignendi
              filii queritur ratio, eo quod filius non nisi ex duobus nascatur. Habeat,
              inquam, sibi huiusmodi
          - pb[type=manuscript,n=E4]
          - foreign[lg=lat-Latn]: generis ortum condicio caduca mortalium. Christus
              enim ex patre ita emicuit ut splendor e lumine, ut uerbum ab ore, ut
              sapientia ex corde.
        - seg:
          - Zi uuizssanne ist nu uns chiuuisso, dhazs fater einemu ist dhurahchunt,
            huueo ir sunu chibar, endi suniu, huueo ir chiboran uuard fona fater.
            So sama auh nu dhesses chiboranin sunes suohhant redha, bidhiu huuanda
            sunu nist, nibu fona zuuem chiboran uuerdhe. Endi hebit zi dhemu selbin
            sidiu chiburdi bighin dhiu zifarande chiscaft dhero dodhliihhono. Christus
            auur sus quham fona fater ziuuaare so selp so dhiu berahtnissi fona sunnun,
            so uuort fona munde, so uuiisduom fona herzin.
  - chapter[n=3]:
    - pb[n=2v,facs=#P2v]
    - pb[n=3v,facs=#p3v]
    - p:
      - s[n=1]:
        - seg:
          - foreign[lg=lat-Latn]: 'Post declaratum christi diuinę natiuitatis mysterium
              deinde quia idem deus et dominus est exemplis sanctarum scribturarum
              adhibitis demonstremus. Si christus deus non est, cui dicitur in psalmis:
              »Sedis tua, deus, in saeculum saeculi, uirga ęquitatis uirga regni tui.
              Dilexisti iustitiam et odisti iniquitatem. propterea unxit te deus,
              deus tuus, oleo lętitie pre consortibus tuis«?'
        - seg:
          - 'Aefter dhiu dhazs almahtiga gotes chiruni dhera gotliihhun christes chiburdi
            chimarit uuard, hear saar after nu mit gareuuem bilidum dhes heilegin
            chiscribes eu izs archundemes, dhazs ir selbo christ ist chiuuisso got
            ioh druhtin. Ibu christus auur got ni uuari, dhemu in psalmom chiquhedan
            uuard: »Dhn sedhal, got, ist fona euuin in euuin, rehtnissa garda ist
            garde dhines riihhes. Dhu minnodos reht endi hazssedos unreht; bidhiu
            auur chisalboda dhih got dhn got mit freuuuidha olee fora dhinem chihlozssom«.
            *'
      - s[n=2]:
        - seg:
          - foreign[lg=lat-Latn]:
          - pb[type=manuscript,n=P3r]
          - foreign[lg=lat-Latn]: 'Quis est igitur iste deus unctus a deo? respondeant
              nobis. Ecce deus unctus a deo dicitur, et utique christus ipsa unctione
              monstratur, cum deus unctus insinuatur. Dum enim audis deum unctum,
              intellege christum. christus enim a chrismate, id est ab unctione uocatur.
              Hunc christum sub persona cyri per isaiam pater deum et dominum ita
              esse testatur dicens: »Hęc dicit dominus christo meo cyro, cuius adprehendi
              dextram, ut subiciam ante faciem eius gentes et dorsa regum uertam et
              aperiam ante eum ianuas, et portę non claudentur. Ego ante te ibo et
              gloriosos terrę humiliabo.'
          - pb[type=manuscript,n=P3v]
          - foreign[lg=lat-Latn]: Portas aereas conteram et uectes ferreos confringam
              et dabo tibi thesauros absconditos et archana secretorum, ut scias,
              quia ego dominus, qui uoco nomen tuum, deus israhel«.
        - seg:
          - pb[type=manuscript,n=P3r]
          - Huuer ist dhanne dhese chisalbodo got fona gote? antuurdeen nu uns dhea
            unchilaubendun. * See hear nu ist fona gode chiquhedan got chisalbot,
            endi chiuuisso ist christus in dheru selbun salbidhu chimeinit, dhar chiquhedan
            uuard got chisalbot. Dhar dhu chihoris umbi dhen chisalbodon got meinan,
            ziuuare firnim dhanne, dhazs dhar ist christ chizeihnit, so auh fona dhes
            chrismen salbe ist chiuuisso christ chinemnit. Umbi
          - pb[type=manuscript,n=WXXXr,facs=#WXXXr]
          - 'dhesan selbun christ chundida almahtic fater dhurah isaian, dhoh ir in
            cyres nemin quhadi, dhazs ir ist got ioh druhtin: »Dhiz quhad druhtin
            minemu christe cyre, dhes zesuun ih chifenc, dhazs ih fora sinemu anthluttę
            hneige imu dheodun, endi ih uuendu imu chuningo hrucca, endi ih antluuhhu
            duri fora imu, endi dor ni uuerdant bilohhan. Ih faru dhir fora endi chidhuuingu
            dhir'
          - pb[type=manuscript,n=P3v]
          - aerdhriihhes hruomege. Erino portun ih firchnussu, iisnine grindila firbrihhu
            endi dhiu chiborgonun hort dhir ghibu, endi ih uuillu, dhazs dhu firstandes
            heilac chiruni. Huuanda ih bim druhtin, dher dhih nemniu, israelo got«.
      - s[n=3]:
        - seg:
          - foreign[lg=lat-Latn]: In persona enim cyri christus est prophetatus, ubi
              ei subiugatę sunt gentes in fide et regna; pręterea, quia nullus in
              regno israhel cyrus est dictus. Quodsi de cyro persarum rege quis hoc
              crediderit prophetatum, absurdum et profanum esse cognoscat, ut homo
              impius
          - pb[type=manuscript,n=P4r,facs=#P4r]
          - foreign[lg=lat-Latn]: 'et idolatrię deditus christus et deus et dominus
              nuncupetur. Unde et in translatione LXX non habet »christo meo cyro«,
              sed habet: »Hęc dicit dominus christo meo domino«. * Quod in persona
              specialiter christi domini nostri accipitur.'
        - seg:
          - In dhemu nemin cyres ist christ chiuuisso chiforabodot, fora dhemu sindun
            dheodun ioh riihhi chihneigidiu in ghilaubin. In andra uuiis ni uuardh
            eo einic in israhelo riihhe cyrus chinemnit. Ibu dhanne einic chilaubit,
            dhazs dhiz fona cyre persero chuninge sii chiforabodot, bichnaa sih dher,
            dhazs izs uuidharzuomi endi heidhanliih ist eomanne zi chilaubanne, dhazs
            dher aerloso man endi dher heidheno abgudim
          - pb[type=manuscript,n=P4r,facs=#P4r]
          - 'gheldendo christ, got endi druhtin uurdi chinemnit. Umbi dhiz nist auh
            so chiscriban in dhero sibunzo tradungum: »Minemu christe cyre«, oh sie
            scribun: »Dhiz quhad druhtin minemu christe druhtine«. Endi ioh dhazs
            ist nu unzuuiflo so leohtsamo zi firstandanne, dhazs dhiz ist chiquhedan
            in unseres druhtines nemin.'
      - s[n=4]:
        - seg:
          - foreign[lg=lat-Latn]: 'Si christus deus non est, dicant nobis, quem sit
              affatus deus in genesi, cum diceret: »Faciamus hominem ad imaginem et
              similitudinem nostram«. Sic enim subiungitur: »Et creauit deus hominem,
              ad imaginem et similitudinem dei creauit illum«. Quęrant ergo, quis
              deus creauit'
          - pb[type=manuscript,n=P4v,facs=#P4v]
          - foreign[lg=lat-Latn]: aut ad cuius dei imaginem condidit hominem, quem
              creauit.
        - seg:
          - 'Ibu christ got nist, sagheen nu dhea unchilaubun uns, zi huuemu got uuari
            sprehhendi in genesi, dhar ir quhad: »Duoemes mannan uns anachiliihhan
            endi in unseru chiliihnissu«. So dhar auh after ist chiquhedan: »Endi
            got chiscuof mannan, anachiliihhan endi chiliihhan gote chifrumida dhen«.
            Suohhen dhea nu auur, huuelih got chiscuofi odho in huuelihhes gotnissu
            anachiliihhan mannan'
          - pb[type=manuscript,n=P4v,facs=#P4v]
          - chifrumidi, dhen ir chiscuof.
      - s[n=5]:
        - seg:
          - foreign[lg=lat-Latn]: 'Quodsi respondeant »ad angelorum«: Num angelus
              ęqualem cum deo habet imaginem? Dum multum distet imago creaturę ab
              eo, qui creauit? Aut numquid angelus cum deo potuit facere hominem?
              quod ita existimare magnę dementię est. Cui ergo dicitur aut ad cuius
              imaginem conditus homo creditur,'
          - pb[type=manuscript,n=WXXXv,facs=#WXXXv]
          - foreign[lg=lat-Latn]: nisi ad eius, cuius una imago cum deo est et unicum
              nomen diuinitatis est?
        - seg:
          - 'Ibu sie antuurdant endi quhedant »in angilo«: Inu ni angil nist anaebanchiliih
            gote? Dhanne so dhrato mihhil undarscheit ist undar dhera chiscafti chiliihnissu
            endi dhes izs al chiscuof. Odho mahti angil so sama so got mannan chifrumman?
            Dhazs so zi chilaubanne mihhil uuootnissa ist. Huuemu ist dhiz nu zi quhedanne
            odho zi huues chiliihnissu uuardh man chiscaffan, nibu zi dhes, dher anaebanliih
            ist gote endi chinamno ist mit godu?'
      - s[n=6]:
        - seg:
          - foreign[lg=lat-Latn]: 'Item si christus dominus non est: Quis dominus
              pluit ignem in sodomis a domino?'
          - pb[type=manuscript,n=P5r,facs=#P5r]
          - foreign[lg=lat-Latn]: 'Sic enim ait in genesi: »Et pluit dominus super
              sodomam et gomurram sulphur et ignem a domino«. In qua sententia nemo
              dubitet secundam esse personam. Nam quis est ille dominus nisi procul
              dubio filius a patre? Qui semper ab eodem patre missus descendere solitus
              est et ascendere. Quo testimonio et deitas et distinctio personarum
              patris filiique luce clarius demonstratur.'
        - seg:
          - 'Endi auh ibu christus druhtin nist, huuelih druhtin regonoda fyur in
            sodoma fona druhtine? So chiuuisso chiscriban ist in genesi:'
          - pb[type=manuscript,n=P5r,facs=#P5r]
      - s[n=7]:
        - seg:
          - foreign[lg=lat-Latn]: 'Item si christus dominus non est, de quo dicit
              dauid in psalmo: »Dixit dominus domino meo: sede a dextris * meis«?
              Qui dum idem christus secundum carnem'
          - pb[type=manuscript,n=P5v,facs=#P5v]
          - foreign[lg=lat-Latn]: 'sit filius dauid. * In spiritu tamen dominus eius
              et deus est. Si christus dominus non est, de quo ait dauid in libris
              regum: »Dixit uir, cui constitutum est, de christo dei iacob, egregius
              psalta israhel: spiritus domini locutus est per me et sermo eius per
              linguam meam«?'
        - seg:
          - 'Inu ibu christus druhtin nist, umbi huuenan dauid in psalmom quhad: »Quhad
            druhtin druhtine minemu: sitzi azs zesuun halp mn«? Dhoh christus in dhes
            fleisches liihhamin'
          - pb[type=manuscript,n=P5v,facs=#P5v]
          - 'sii dauides sunu. * Oh ir ist chiuuisso in dhemu heilegin gheiste got
            ioh druhtin. Nibu christ druhtin sii, umbi huuenan quhad dauid in chuningo
            boohhum: »Sus quhad dher gomo, dhemu izs firgheban uuard, adhalsangheri
            israhelo, umbi christan iacobes got: Druhtines gheist ist sprehhendi dhurah
            mih endi sn uuort dhurah mine zungun«?'
      - pb[n=XXXI1r,facs=#WXXXI1r]
      - pb[n=XXXI2r,facs=#WXXXI2r]
      - s[n=8]:
        - seg:
          - foreign[lg=lat-Latn]: 'Item si christus dominus non est, quis est ille
              dominus exercituum, qui a domino exercituum mittitur? Ipso dicente in
              zacharia: »Hęc dicit dominus deus exercituum: Post gloriam misit me
              ad gentes, quę expoliauerunt uos. Qui enim tetigerit uos, tangit'
          - pb[type=manuscript,n=P6r,facs=#P6r]
          - foreign[lg=lat-Latn]: pupillam oculi eius; quia ecce leuabo manum meam
              super eos, et erunt preda his, qui seruiebant sibi, et cognoscetis,
              quia dominus exercituum misit me«.
        - seg:
          - 'Ibu nu christ druhtin nist, huuer ist dher uuerodheoda druhtin, dher
            fona uuerodheoda druhtine uuard chisendit? So ir selbo quhad dhurah zachariam:
            »Sus quhad druhtin uuerodheoda got: sendida mih after guotliihhin zi dheodom,
            dhem euuuih biraubodon. Dher euuuih hrinit, hrinit sines augin sehun.
            See bidhiu ih'
          - pb[type=manuscript,n=P6r,facs=#P6r]
          - hepfu mina hant
          - pb[type=manuscript,n=WXXXIr]
          - ubar sie, endi sie uuerdant zi scaahche dhem im aer dheonodon, endi er
            sculut bichennen, dhazs uuerodheoda druhtin mih sendida«.
      - s[n=9]:
        - seg:
          - foreign[lg=lat-Latn]: 'Age nunc cuius sit hec uox nisi saluatoris, qui
              omnipotens deus a patre omnipotente missum se esse testatur? Missus
              est autem ad gentes post gloriam deitatis, quam habuit apud patrem,
              quando exinaniuit se ipsum et formam serui accipiens effectus est oboediens
              usque ad mortem. Quique etiam in sequentibus loquitur dicens: »Lauda
              et letare, filia sion, quia ecce ego uenio et habitabo'
          - pb[type=manuscript,n=P6v,facs=#P6v]
          - foreign[lg=lat-Latn]: in medio tui, dicit dominus. Et adplicabuntur gentes
              multę ad dominum in die illa et erunt mihi in populum, et habitabo in
              medio tui, et scies quia dominus exercituum misit me ad te«.
        - seg:
          - 'Uuala nu auh huues mac dhesiu stimna uuesan nibu dhes nerrendin druhtines?
            Ir almahtic got sih chundida uuesan chisendidan fona dhemu almahtigin
            fater. So chisendit uuard chiuuisso zi dheodum after dheru sineru gotnissa
            guotliihhin, dhea ir samant hapta mit fater. Dhuo ir sih selban aridalida
            endi scalches farauua infenc, uuordan uuardh chihoric untazs zi dode.
            Dher selbo auh hear after folghendo quhad: »Lobo endi freuuui dhih, siones
            dohter, bidhiu huuanda see ih quhimu'
          - pb[type=manuscript,n=P6v,facs=#P6v]
          - endi in dhir mitteru ardon, quhad druhtin. Endi in dhemu daghe uuerdhant
            manego dheodun chisamnoda zi druhtine endi uuerdhant mine liudi, endi
            ih ardon in dhir mitteru, endi dhu uueist dhazs uuerodheoda druhtin sendida
            mih zi dhir«.
      - s[n=10]:
        - seg:
          - foreign[lg=lat-Latn]: 'Quis est igitur iste dominus a domino exercituum
              missus nisi idem dominus iesus christus? Superest de spiritu sancto,
              de cuius deitate sic ait iob, et quia spiritus dei est: »Spiritus domini
              fecit me et spiraculum omnipotentis uiuificauit me. Ecce et me sicut
              et te fecit deus«. De quo enim dixerat: »Spiritus domini fecit me«,
              Deo rursus adiecit:'
          - pb[type=manuscript,n=P7r,facs=#P7r]
          - foreign[lg=lat-Latn]: '»Ecce et me sicut et te fecit deus«: Ut eundem
              spiritum ostenderet esse deum.'
        - seg:
          - 'Huuelih ist auur nu dhese druhtin fona uuerodheoda druhtine chisendit,
            nibu auur dher selbo druhtin nerrendeo christ? Ubar dhazs ist auh hear
            bifora fona dhemu heilegin gheiste, fona dhes gotnissu ioh dhazs ir gotes
            gheist ist, sus quhad iob: »Druhtines gheist chideda mih endi adum dhes
            almahtighin chiquihhida mih. See endi mih deda got so selp so dhih«. Umbi
            dhen selbun ir aer chiuuisso quhad: »druhtines gheist chiuuorahta mih«.
            Dhazs heftida auur zi gote, dhar ir after dhiu quhad: »See'
          - pb[type=manuscript,n=P7r,facs=#P7r]
          - endi mih chideda got so selp so dhih«. Dhazs ir chichundida dhazs dher
            selbo gheist ist got.
  - chapter[n=4]:
    - pb[n=7r,facs=#P7r]
    - pb[n=XXXI1v,facs=#WXXXI1v]
    - pb[n=XXXI2v,facs=#WXXXI2v]
    - pb[n=XXXI1r,facs=#WXXXI1r]
    - pb[n=XXXI2r,facs=#WXXXI2r]
    - p:
      - s[n=1]:
        - seg:
          - foreign[lg=lat-Latn]: 'Pateat ueteris testamenti apicibus patrem et filium
              et spiritum sanctum esse deum. Sed hinc isti filium et spiritum sanctum
              non putant esse deum eo, quod in monte sina uocem dei intonantis audierint:
              »Audi, israel, dominus deus tuus deus unus est«.'
          - pb[type=manuscript,n=WXXXIv]
          - foreign[lg=lat-Latn]: Ignorantes in trinitate unum esse deum patrem et
              filium et spiritum sanctum. Nec tres deos, sed in tribus personis unum
              nomen
          - pb[type=manuscript,n=P7v,facs=#P7v]
          - foreign[lg=lat-Latn]: indiuiduę maiestatis.
        - seg:
          - 'Araugit ist in dhes aldin uuizssodes boohhum dhazs fater endi sunu endi
            heilac gheist got sii. Oh dhes sindun unchilaubun iudeoliudi dhazs sunu
            endi heilac gheist got sii, bidhiu huuanda sie chihordon gotes stimna
            hluda in sinaberge quhedhenda: »Chihori dhu, israhel, druhtin got dhin
            ist eino got«. * Unbiuuizssende sindun, huueo in dheru dhrinissu sii ein
            got fater endi sunu endi heilac gheist. Nalles sie dhrie goda, oh ist
            in dhesem dhrim heidem ein namo dhes unchideiliden meghines.'
      - s[n=2]:
        - seg:
          - foreign[lg=lat-Latn]: 'Queramus ergo in scribturis ueteris testamenti
              eandem trinitatem. In libro quippe primo regum ita scribtum est: »Dixit
              dauid filius isai, dixit uir, cui constitutum est, de christo dei iacob,
              egregius psalta israel: Spiritus domini locutus est per me et sermo
              eius per linguam meam«. Quis autem esset, adiecit: »Deus israel mihi
              locutus est, dominator fortis israel hominum iustus«.'
        - seg:
          - pb[type=manuscript,n=P7v,facs=#P7v]
          - 'Suohhemes nu auur in dhemu aldin heileghin chiscribe dhesa selbun dhrinissa.
            In dhemu eristin deile chuningo boohho sus ist chiuuisso chiscriban: »Quhad
            dauid isais sunu, quhad gomman, dhemu izs chibodan uuard, umbi christan
            iacobes gotes, dher erchno sangheri israhelo: Gotes gheist ist sprehhendi
            dhurah mih, endi sn uuort ferit dhurah mina zungun«. Endi saar dhar after
            offono araughida, huuer dher gheist sii, dhuo ir quhad: »Israhelo * got
            uuas mir zuo sprehhendi, dher rehtuuisigo manno uualdendeo strango israhelo«.'
      - s[n=3]:
        - seg:
          - foreign[lg=lat-Latn]: 'Dicendo enim »christum dei iacob« et filium et
              patrem ostendit. Item dicendo »Spiritus domini loquutus est per me«
              sanctum spiritum euidenter aperuit. Idem quoque in psalmis:'
          - pb[type=manuscript,n=P8r,facs=#P8r]
          - foreign[lg=lat-Latn]: »Uerbo«, inquit, »domini celi firmati sunt et spiritu
              oris eius omnis uirtus eorum«. In persona enim domini patrem accipimus,
              in uerbo filium credimus, in spiritu oris eius spiritum sanctum intellegimus.
              Quo testimonio et trinitatis numerus et communio cooperationis ostenditur.
        - seg:
          - Dhar ir quhad »christ iacobes gotes«, chiuuisso meinida ir dhar sunu endi
            fater. Dhar ir auh quhad »Gotes gheist ist sprehhendi dhurah mih«, dhar
            meinida leohtsamo zi archennenne dhen heilegan gheist. Auur auh umbi dhazs
            selba
          - pb[type=manuscript,n=P8r,facs=#P8r]
          - 'quhad dauid in psalmom: »Druhtines uuordu sindun himila chifestinode
            endi sines mundes gheistu standit al iro meghin«. In dhemu druhtines nemin
            archennemes chiuuisso fater, in dhemu uuorde chilaubemes sunu. In sines
            mundes gheiste instandemes chiuuisso heilegan gheist. In dheseru urchundin
            ist ziuuare araughit dhera dhrinissa zala endi chimeinidh iro einuuerches.'
      - s[n=4]:
        - seg:
          - foreign[lg=lat-Latn]: 'Sic in consequentibus idem propheta ait: »Mittit
              uerbum suum et liquefaciet ea, flat spiritus eius et fluent aque«. Ecce
              tria: pater, qui mittit, et uerbum, quod mittitur, et spiritus eius,
              qui flat. Nam et cum dicitur in genesi:'
          - pb[type=manuscript,n=P8v,facs=#P8v]
          - foreign[lg=lat-Latn]: '»In principio fecit deus celum et terram, et spiritus
              dei ferebatur super aquas«. Ibi in dei uocabulo pater intellegitur.
              In principio filius agnoscitur, qui dicit: »In capite libri scriptum
              est de me, ut faciam uoluntatem tuam«. Qui dixit deus et fecit deus.
              In eo uero, qui superferebatur aquis, spiritus sanctus significatur.'
        - seg:
          - 'So hear after dher selbo forasago quhad: »Ir sendit sn uuort endi chiuueihhit
            dhea, adhmuot sn gheist endi rinnant uuazssar«. See hear meinit nu dhri:
            fater ist, dher sendida, endi uuort ist dhazs chisendida, endi sn gheist
            ist, dher adhmot. Endi auh in genesi quhidhit:'
          - pb[type=manuscript,n=P8v,facs=#P8v]
          - '»In dhemu eristin chideda got himil endi aerdha, endi gotes gheist suueiboda
            oba uuazsserum«. Dhar ist auh in dhemu gotes nemin fater zi firstandanne;
            in dhemu eristin ist sunu zi archennanne, huuanda ir selbo quhad: »In
            haubide dhes libelles azs erist ist chiscriban umbi mih, dhazs ih dhinan
            uuillun duoe«. Got ist dher quhad, endi got dher deta. In dhiu auh dhanne,
            dhazs ir oba dhem uuazsserum suueiboda, dhen heilegun gheist dhar bauhnida.'
      - s[n=5]:
        - seg:
          - foreign[lg=lat-Latn]: 'Nam et cum ibi dicit deus: »Faciamus hominem ad
              imaginem et similitudinem nostram«: Per pluralitatem personarum patens
              significatio trinitatis est. Ubi tamen ut unitatem'
          - pb[type=manuscript,n=P9r,facs=#P9r]
          - foreign[lg=lat-Latn]: 'deitatis ostenderet, confestim admonet dicens:
              »Fecit deus hominem ad imaginem suam«. Et cum dicit idem deus »Ecce
              adam factus est quasi unus ex nobis«: Ipsa pluralitas personarum trinitatis
              demonstrat mysterium.'
        - seg:
          - 'Inu so auh chiuuisso dhar quhad got »Duoemes mannan anachiliihhan endi
            uns chiliihhan«: Dhurah dhero heideo maneghin ist dhar chioffonot dhera
            dhrinissa bauhnunc. Endi dhoh dhiu huuedheru nu, dhazs ir dhea'
          - pb[type=manuscript,n=P9r,facs=#P9r]
          - 'einnissa gotes araughida, hear saar after quhad: »Got chiuuorahta mannan
            imu anachiliihhan«. Endi auh so dhar after got quhad »See adam ist dhiu
            chiliihho uuordan so einhuuelih unser«: Dhiu selba maneghiu chinomideo
            araughit dhazs meghiniga chiruni dhera dhrinissa.'
      - s[n=6]:
        - seg:
          - foreign[lg=lat-Latn]: 'Cuius trinitatis sacramentum et aggeus propheta
              ita aperuit ex persona domini dicens: »Spiritus meus erit in medio uestri«.
              Ecce deus, qui loquitur, ecce spiritus eius * post hec de tertia persona,
              id est de filio, ita subiecit: »Quia ecce ego commouebo celum et terram.
              * et ueniet desideratus cunctis gentibus«.'
        - seg:
          - 'Dhera selbun dhrinissa heilac chiruni aggeus dher forasago sus araughida
            in druhtines nemin quhedhendi: »Mn gheist scal uuesan undar eu mittem«.
            Seegi got dhar sprah, seegi sn gheist ist auh after dhiu saar chimeinit.
            Umbi dhen dhrittun heit, dher fona suni ist, sus quhad dher selbo forasago:
            »Huuanda see ih chihruoru himil endi ęrdha. endi quhimit dher uuilligo
            allem dheodom«.'
      - s[n=7]:
        - seg:
          - foreign[lg=lat-Latn]: In esaia quoque sub propria cuiusque persona
          - pb[type=manuscript,n=P9v,facs=#P9v]
          - foreign[lg=lat-Latn]: 'distinctio trinitatis dicente eodem filio ita ostenditur:
              »Ego primus et ego nouissimus. Manus quoque mea fundauit terram et dextera
              mea mensa est cęlos. Nam a principio in abscondito locutus sum, ex tempore
              antequam fieret, ibi eram«. et consequenter adiecit: »et nunc dominus
              deus misit me et spiritus eius«. Ecce duę persone dominus et spiritus
              eius, qui mittunt, et tertia persona eiusdem domini, qui mittitur.'
        - seg:
          - So sama so auh araughit ist in isaies buohhum eochihuueliihhes
          - pb[type=manuscript,n=P9v,facs=#P9v]
          - 'dhero heideo sundric undarscheit, selbemu dhemu gotes sune quhedhendemu:
            »Ih eristo endi ih aftristo. mino hendi chifrumidon auh ęrdha endi mn
            zesuua uuas mezssendi himila. ioh fona eristin uuas ih chiholono sprehhendi
            fona ziidi, endi aer huuil uurdi, ih uuas dhar«. Dhar after saar auh quhad:
            »Endi nu sendida mih druhtin got endi sn gheist«. See hear zuuene dhero
            heido, got endi sn gheist, dhea sendidon, endi dher dhritto heit ist selbes
            druhtines christes dhes chisendidin.'
      - s[n=8]:
        - seg:
          - foreign[lg=lat-Latn]: 'Item alibi per eundem prophetam trinitatis sic
              demonstratur significantia: »Ecce«, * inquit, »puer * meus, suscipiam
              eum; dilectus meus, complacuit sibi in illo anima mea; dedi spiritum
              meum super eum«. Pater filium dilectum puerum uocat,'
          - pb[type=manuscript,n=P10r,facs=#P10r]
          - foreign[lg=lat-Latn]: 'super quem dedit spiritum sanctum. De quo dominus
              iesus christus propria uoce testatur: »Spiritus domini super me«.'
        - seg:
          - 'So auh in andreru stedi dhurah dhen selbun heilegun forasagun uuard dhera
            dhrinissa bauhnunc sus araughit: »Quhad got, see mn chnecht, ih inan infahu.
            chiminni mir, chiliihheda iru in imu mineru seulu. Ih gab ubar inan minan
            gheist«. Fater meinida dhar sinan sun, dhuo ir chiminnan chneht nemnida,
            ubar'
          - pb[type=manuscript,n=P10r,facs=#P10r]
          - 'dhen ir sinan gheist gab. Umbi dhen druhtin nerrendo christ sineru selbes
            stimnu urchundida, dhuo ir quhad: »Druhtines gheist ist ubar mir«.'
      - s[n=9]:
        - seg:
          - foreign[lg=lat-Latn]: 'Alio quoque in loco idem isaias totam trinitatem
              in digitorum numero comprehendens sic predicat dicens: »Quis mensus
              est pugillo aquas et celos palmo quis ponderauit? Quis appendit tribus
              digitis molem terre«? In tribus quippe digitis propheta trinam diuinę
              omnipotentię ęqualitatem * sub quadam mysterii lance librauit et parilitate
              uirtutis cooperationem potentię et unitatem substantie, * quę una eademque
              in trinitate est, in tribus digitis declarauit.'
        - seg:
          - 'Endi auh ir selbo isaias in andreru stedi alle dhea dhrinissa in fingro
            zalu bifenc, dhuo ir sus prędicando quhad: »Huuer uuas mezssendi in einemu
            hantgriffa uuazssar? Endi huuer uuac himila sineru folmu? Huuer uuac dhrim
            fingrum allan aerdhuuasun«? In dhrim fingrum chiuuisso dher heilego forasago
            dhea dhrifaldun ebanchiliihnissa dhera almahtigun gotliihhin mit sumes
            chirunes uuagu uuac. Endi auh mit dhes meghines chiliihnissu chraft dhes
            ebanuuerches endi einnissa dhera almahtigun spuodi, dhiu ein ioh samalih
            in dheru dhrinissu ist, in dhrim fingrum dhurahchundida.'
      - s[n=10]:
        - seg:
          - foreign[lg=lat-Latn]: Cuius trinitatis
          - pb[type=manuscript,n=P10v,facs=#P10v]
          - foreign[lg=lat-Latn]: 'mysterium alias se cognouisse testatur idem propheta
              dicendo: »Uidi dominum sedentem super solium excelsum. Seraphin stabant
              super illud, sex alę uni et sex alę alteri. Duabus uelabant faciem eius
              et duabus uelabant pedes eius et duabus uolabant«. Quem ut trinum in
              personis ostenderet et unum in diuinitate monstraret, sequenter ait:
              »Et clamabant alter ad alterum et dicebant: sanctus sanctus sanctus
              dominus deus exercituum. plena est omnis terra gloria eius«.'
        - seg:
          - Dher selbo forasago auh in andreru
          - pb[type=manuscript,n=P10v,facs=#P10v]
          - 'stedi chundida, dhazs ir dhera dhrinissa chiruni bichnadi, dhuo ir sus
            quhad: »Ih chisah druhtin sitzendan oba dhrato hohemu hohsetle, endi seraphin
            dhea angila stuondun dhemu oba. sehs fethdhahha uuarun eines, sehse andres.
            mit zuuem dhehhidon sn antlutti endi mit zuuem dhecchidon sine fuozssi
            endi mit zuuem flugun«. Dhazs dher forasago auh dhen selbun druhtin dhrifaldan
            in sinem heidim araughida endi einan in sineru gotnissu chichundida, dhar
            after quhad fona dhem angilum: »Endi hreofun ein zi andremu quhedhande:
            heilac heilac heilac druhtin uuerodheoda got. folliu ist al ęrdha dhinera
            guotliihhin«.'
      - s[n=11]:
        - seg:
          - foreign[lg=lat-Latn]: Ecce trinam sanctificationem sub una confessione
              celestis persultat exercitus. unam gloriam trinitatis Seraphin trina
              repetitione proclamant.
          - pb[type=manuscript,n=P11r,facs=#P11r]
          - foreign[lg=lat-Latn]: 'Nam quid ter sanctus indicat, nisi eiusdem trinę
              omnipotentię gloria demonstrata est? In deitate trium personarum significatio,
              non autem sicut tres persone ita et tres dii credendi sunt, sed in eis
              personis una diuinitas praedicanda est. Secundum moysi sententiam dicentis:
              »Audi, israel, dominus deus tuus deus unus est«. * Et iterum: »Ego sum
              deus et preter me non est alius«.'
        - seg:
          - See hear nu dhea dhrifaldun heilacnissa undar eineru biiihti dhazs himilisca
            folc so mendit. Endi dhoh eina guotliihhin dhera dhrinissa syrafin mit
            dhemu dhrifaldin
          - pb[type=manuscript,n=P11r,facs=#P11r]
          - 'quhide meinidon. Inu huuazs andres zeihnit dhar dhea dhri sanctus chiquhedan,
            nibu dhera selbun almahtigun dhrinissa guotliihhin ist araughit? Endi
            dhoh dhiu huuedheru in dhemu bauhnunge dhero dhrio heido gotes ni sindun
            zi chilaubanne dhazs sii dhrii goda sn, so sama so dhea dhrii heida sindun;
            oh in dhem dhrim heidim scal man ziuuaare eina gotnissa beodan. After
            moyses quhidim, dhar ir quhad: »Chihori dhu, israhel, druhtin got dhn
            ist eino got«. * Endi auur ist auh chiscriban: »Ih bim eino got endi ano
            mih nist ander«.'
  - chapter[n=5]:
    - pb[n=11r,facs=#P11r]
    - head:
      - V.
      - QUIA CHRISTUS FILIUS DEI DEUS HOMO FACTUS EST
    - head:
      - V.
      - HEAR QUHIDIT, HUUEO GOT UUARD MAN CHIUUORDAN CHRIST GOTES SUNU
    - p:
      - s[n=1]:
        - seg:
          - foreign[lg=lat-Latn]: Hucusque misterium celestis natiuitatis in christo
              et significantiam diuine trinitatis ostendimus. Dehinc scribturę
          - pb[type=manuscript,n=P11v]
          - foreign[lg=lat-Latn]: 'auctoritate eundem filium dei natum in carne monstremus.
              Manifestantes primum quia idem filius dei propter nostram salutem incarnatus
              et homo factus est. sic enim de eo praedicat esaias: »Paruolus«, inquit,
              »natus est nobis, filius datus est nobis, et factus est principatus
              eius super humerum eius, et uocabitur nomen eius admirabilis, consiliarius,
              deus fortis, pater futuri saeculi, princeps pacis. multiplicabitur imperium
              eius et pacis non erit finis«.'
        - seg:
          - Untazs hear nu aughidom uuir dhazs gheistliihhe chiruni dhera himiliscun
            chiburdi in christe endi dhera gotliihhun dhrinissa bauhnunga. Hinan frammert
          - pb[type=manuscript,n=P11v]
          - 'nu chichundemes mit hęrduome dhes heilegin chiscribes, dhazs ir selbo
            gotes sunu uuard in liihhe chiboran. Araughemes saar azs erist, huueo
            ir selbo gotes sunu dhurah unsera heilidha in fleisches liihhe man uuardh
            uuordan. So isaias umbi inan predigondo quhad: »Chindh uuirdit uns chiboran,
            sunu uuirdit uns chigheban, endi uuirdit sn hęrduom oba sinem sculdrom,'
          - pb[type=manuscript,n=WXXXIIr,facs=#WXXXIIr]
          - endi uuirdit sn namo chinemnit uundarliih, chirado, got strengi, fater
            dhera zuohaldun uueraldi, frido herosto. chimanacfaldit uuirdhit sn chibot,
            endi sinera sipbea ni uuirdit endi«.
      - s[n=2]:
        - seg:
          - foreign[lg=lat-Latn]: Paruolus enim christus, quia homo et natus nobis,
              non sibi. Quod enim homo factus est, nobis profecit, et ideo nobis natus
              est. filius autem datus est nobis, cuius nisi dei filius?
          - pb[type=manuscript,n=P12r,facs=#P12r]
          - foreign[lg=lat-Latn]: Principatus eius super humerum eius, siue quia crucem
              propriis humeris ipse portauit, siue quia titulum regni super humeros
              et caput eius pilatus scribsit.
        - seg:
          - Meinida dher forasago chiuuisso in dheru christes lyuzilun, huuanda ir
            uns uuard chiboran, nalles imu selbemu. Huuanda chiuuisso, dhazs ir man
            uuardh uuordan, unsih hilpit, endi bidhiu uuard ir uns chiboran. Sunu
            auur uuard uns chigheban, huues nibu gotes sunu? Sn hęrduom
          - pb[type=manuscript,n=P12r,facs=#P12r]
          - oba sinem sculdrom, ioh bidhiu huuanda ir in sn selbes sculdrom sn cruci
            druoc, ioh bidhiu huuanda dhen titulo sines riihhes oba sinem sculdrom
            endi sinemu haubide pilatus screiph.
      - s[n=3]:
        - seg:
          - foreign[lg=lat-Latn]: 'Erubescant itaque impii et agnoscant uocari christum
              filium dei siue natum et per adsumptionem corporis paruolum factum.
              De quo dauid ait: »Minuisti eum paulo minus a deo«. »Quia dum in forma
              dei esset, non rapinam arbitratus est esse se ęqualem deo. Sed semetipsum
              exinaniuit formam serui accipiens«. Ad quem dum pater in psalmis de
              illa ęterna natiuitate diceret: »Ex utero ante luciferum genui te«,
              rursus futuram eius in carne natiuitatem ostendens subiecit dicens:
              »Et quasi de uulua'
          - pb[type=manuscript,n=P12v,facs=#P12v]
          - foreign[lg=lat-Latn]: orietur tibi ros aduliscentię tuę«.
        - seg:
          - 'Oh schameen sih nu dhea aerlosun endi bichnaan sih zi nemnanne christ
            gotes sunu ioh chiboranan chilauben endi dhurah dhes liihhamin infancnissa
            lyuzilan uuordanan. Umbi inan quhad dauid: »Dhu chiminnerodes inan liuzelu
            minnerun dhanne got«. »Huuanda innan dhiu ir uuas in gotes faruuu, ni
            uuas imu dhuo einighan fal ardeilendi, dhazs ir gote uuas ebanchiliih.
            * Oh ir sih selbun aridalida, dhuo ir scalches chiliihnissa infenc«. Zi
            dhemu dhuo fater in psalmom umbi dhea sine euuigun chiburt quhad: »Fona
            hreue aer lucifere ih dhih chibar«. Dhuo saar dhar after araughida dhea
            zuohaldun sine chiburt in fleische, dhuo ir quhad: »Endi so sama so fona
            dhemu berandin hreue so arspringit dher dau dhinera iugundhi«.'
      - s[n=4]:
        - seg:
          - foreign[lg=lat-Latn]: 'Hanc incorporationem filii dei et spiritus sanctus
              in psalmis ita praenuntiauit dicens: »Ad sion autem dicitur uir, et
              uir natus est in ea et ipse fundauit eam excelsus«. Ecce qui nascitur
              in sion et qui in ipsa ciuitate factus est humillimus, ipse est qui
              fundauit eam excelsus. et quia idem est dominus sequitur: »Dominus numerauit
              scribens populos, iste natus est ibi«. Quis'
          - pb[type=manuscript,n=WXXXIIv,facs=#WXXXIIv]
          - foreign[lg=lat-Latn]: iste uir? scilicet excelsus et dominus. Uir, quia
              homo factus est, excelsus, quia eum supra se cęli et angeli suscipiunt.
              Dominus, quia cuncte celi terręque creaturę illi deseruiunt.
        - seg:
          - pb[type=manuscript,n=P12v,facs=#P12v]
          - 'Dhesa infleiscnissa auh dhes gotes sunes heilac gheist in psalmom * sus
            chundida, dhar ir quhad: »Zi sion quhad man, endi man uuirdit in ira chiboran,
            endi dher selbo chiuuorahta sia, ir hohisto«. See dher in sion uuard chiboran
            endi dher in dheru selbun burc uuard uuordan allero odhmuodigosto, dher
            selbo ist dher hohista, dher sia chiuuorahta. Endi auh huueo dher selbo
            druhtin ist, dhar ist after chiscriban: »Druhtin saghida dhazs chiscrip
            dhero folcho, dhese ist dhar chiboran«. Huuer ist dhanne dhese man, dher
            dhar scoldii chiboran uuerdan? chiuuisso ist izs dher hohisto endi druhtin.
            Man, bidhiu huuanda got uuard man chiuuordan. Hohisto, bidhiu huuanda
            inan himila endi anghila ubar sih infahant. Druhtin ist auh, bidhiu huuanda
            imu elliu himilo endi aerdha chiscafti sindun dheonondiu.'
      - s[n=5]:
        - seg:
          - foreign[lg=lat-Latn]: Uerum quotiens inimici christi omnem hanc prophetiam
          - pb[type=manuscript,n=P13r,facs=#P13r]
          - foreign[lg=lat-Latn]: natiuitatis eius audiunt, conclusi dum non habeant
              quod proponant, argumentantur dicentes necdum uenisse christum, de quo
              hec omnia ore prophetarum presaga * cecinerunt. Quęramus ergo tempus
              natiuitatis christi, utrum iam aduenerit an uenturus adhuc exspectetur.
              In danihelo igitur tempus aduentus eius certissime ostenditur et anni
              numerantur et manifesta signa eius pronuntiantur, et post aduentum eius
              et post mortem futura iudeorum excidia ibi certissime manifestantur.
        - seg:
          - Uuaar ist, dhazs so ofto so dhea christes fiant dhesiu heilegun
          - pb[type=manuscript,n=P13r,facs=#P13r]
          - foraspel chihorant umbi christes chiburt, so bifangolode sindun simbles,
            dhazs sie ni eigun eouuihd, huuazs sie dhar uuidhar setzan. Oh sie dhanne
            zellando quhedant dhazs noh christ ni quhami, fona dhemu dhiz al in forasagono
            mundum dhea aldun aer langhe bifora sungun. Suohhemes auur uuir nu ziidh
            dhera christes chiburdi, huuedhar ir iu quhami odho uuir noh sculim sn
            quhemandes biidan. In dhemu heilegin daniheles chiscribe ist umbi dhea
            christes chumft ęrnustliihho araughit endi iaar arzelidiu, ioh offono
            sindun siniu zeihhan dhes bifora chichundidiu, ioh dhar ist auh offanliihhost
            chisaghet huueo dhero iudeo quhalm after christes chiburdi ioh after sineru
            martyru quheman scoldi. Dhar ist izs chiuuisso so zi ernusti araughit,
      - s[n=6]:
        - seg:
          - foreign[lg=lat-Latn]: 'sic enim ait ad eum angelus: »Daniel, aduerte sermonem
              et intellege uisionem. LXX ebdomades adbreuiatę sunt super populum tuum
              et super urbem sanctam tuam, ut consummetur praeuaricatio et finem accipiat
              peccatum et deleatur iniquitas et adducatur iustitia sempiterna et impleatur
              uisio et prophetię et unguatur sanctus sanctorum«. Quę scilicet LXX
              ebdomadę, si a tempore danielis numerentur, procul dubio sanctus sanctorum
              dominus iesus christus olim uenisse cognoscitur.'
        - seg:
          - 'so dher angil gotes zi dhemu heilegin forasagin quhad: »Danihel, nim
            gaumun dhesses uuortes endi fyrstant dhiz chisiuni. Sibunzo uuehhono'
          - pb[type=manuscript,n=P13v,facs=#P13v]
          - sindun chibreuido oba dhinem liudim endi oba dheru dhineru heilegun burc,
            dhazs chiendot uuerdhe dhiu aboha ubarhlaupnissi, endi dhazs sundono uuerdhe
            endi, endi unrehd uuerdhe ardilet endi euuic rehd biquhime endi chisiuni
            ioh forasagono spel uuerdhen arfullit endi dhero heilegeno heilego uuerdhe
            chisalbot«. Chiuuisso nu, ibu dhea sibunzo uuehhono fona daniheles zide
            uuerdhant chizelido, buuzssan einigan zuuiuun ist dhanne archennit, dhazs
            dher allero heilegono heilego druhtin nerrendeo christ iu ist langhe quhoman.
      - s[n=7]:
        - seg:
          - foreign[lg=lat-Latn]: 'Ebdomada namque in sacris eloquiis septem annis
              terminatur. Dicente domino ad moysen: »Numerabis tibi VII ebdomadas
              annorum, id est septies septem, que simul faciunt annos XL et VIIII«.
              A tempore itaque danihelis prophete usque ad presens tempus plus quam
              CXL ebdomade'
          - pb[type=manuscript,n=P14r,facs=#P14r]
          - foreign[lg=lat-Latn]: adnumerantur. Ideoque iam aduenit christus, quem
              adnuntiabat sermo propheticus.
        - seg:
          - 'Dhea uuehhun auur in heilegim quhidim arfullant sibun iaar. So ir selbo
            druhtin quhad zi moysi: »Zeli dhir sibun iaaro uuehhon. Dhazs meinit sibun
            stundom sibuniu, in dhem sindun zisamande chizelide eines min dhanne fimfzuc
            iaaro«. Fona daniheles ziide auur dhes forasagin untazs dhiu selbun christes
            chumfti ziidh mera'
          - pb[type=manuscript,n=P14r,facs=#P14r]
          - sindun dhanne zehanzo endi feorzuc uuehhono chizelido, endi bidhiu iu
            chiuuisso quham christ, dhen dhes forasagin uuort bifora chundida.
      - s[n=8]:
        - seg:
          - foreign[lg=lat-Latn]: 'Post LXX enim ebdomadas et natus et passus ostenditur
              christus et ciuitatem hierusalem in exterminatione fuisse et sacrificium
              unctionemque cessasse. Sic enim subiecit idem propheta: »Et occidetur
              christus, et ciuitatem et sacrificium dissipabit populus cum duce uenturo,
              et finis eius uastitas et post finem belli statuta desolatio«. Post
              passionem igitur christi uenit titus et debellauit iudeos et destruxit
              urbem et templum. Et cessauerunt libamina et sacrificia,'
          - pb[type=manuscript,n=P14v,facs=#P14v]
          - foreign[lg=lat-Latn]: que ultra illuc celebrare non potuerunt. Ut impleretur
              quod fuerat ante a propheta predictum.
        - seg:
          - 'After dhem sibunzo uuehhom ist hear offono araughit ziuuare christan
            iu chiboranan ioh chimartorodan, endi dhazs dhiu burc hierusalem aruuostit
            uuardh endi ghelstar ioh salbunga bilunnan uurdun. So dhar after auh chiuuisso
            quhidit dher selbo forasago: »Endi arslagan uuirdit christ, endi dhea
            burc ioh ghelstar fyrodhant liudi mit dhemu zuohaldin herizohin. Endi
            dhes endi uuirdhit odhin. Endi after dhes chifehtes ende uuirdhit dhar
            chisetzit idalnissa«. Dhiz uuard al so chidaan ziuuare, dhuo titus after
            dheru christes passione quham endi nam sigu in dhem iudeoliudim endi zistrudida
            dhea burc ioh'
          - pb[type=manuscript,n=P14v,facs=#P14v]
          - dhazs gotes tempil. Endi dhuo bilunnun dhiu blostar iro ghelstro, dhiu
            sie eomaer furi dhazs in iro samnunghe dhar haldan ni mahtun. Dhazs arfullit
            uurdi so ęr bifora uuardh chichundit dhurah dhen forasagun.
      - s[n=9]:
        - seg:
          - foreign[lg=lat-Latn]: 'Sed duritia cordis iudaici quia ipsi christum interemerunt,
              inde eum adhuc uenisse non credunt. Probauimus dominum nostrum iesum
              christum secundum carnem iam natum fuisse. Sed adicit incredulus: cur
              in carne uenit? Audi ergo causam. Deus cum hominem fecisset summa beatitudine
              praeditum et diuine imaginis decore honoratum, posuit eum in paradiso,
              ut esset deo subiectus, ceteris'
          - pb[type=manuscript,n=P15r,facs=#P15r]
          - foreign[lg=lat-Latn]: creaturis praelatus.
        - seg:
          - 'Oh huuanda sie mit dhes iudeischin muotes hartnissu christan arsluogun,
            bidhiu ni uuellent sie inan noh quhomenan chilauban. Chiuuisso chioffanodom
            uuir nu hear dhazs unser druhtin nerrendeo christ after dheru fleiscliihhun
            chiburdi iu uuardh chiboran. Oh dher unchilaubo fraghet noh endi quhidit:
            bihuuiu uuard christ in liihhi chiboran? Chihori nu sahha bihuuiu. Got
            so ir erist mannan chifrumida mit dhem hohistom salidhom odagan endi mit
            scuonin dhera gotliihhun chiliihnissa chieredan, dhuo setzida inan in
            sn paradisi, dhazs ir chihoric uuari gote endi furiro'
          - pb[type=manuscript,n=P15r,facs=#P15r]
          - uuari andrem gotes chiscaftim.
      - s[n=10]:
        - seg:
          - foreign[lg=lat-Latn]: 'Ille autem rebellis effectus contempta diuinitate
              interdictum uiolauit praeceptum. Quem proiectum ob superbiam deus non
              occidit, sed exulem paradiso fecit exspectans, ut per penitentiam reparari
              possit ad ueniam. Et cum ille non reuocaretur ad uiam uirtutis: Dedit
              legem per moysen, ut uel per ipsam reuerteretur ad amorem dei et operationem
              iustitię. Sed cum nec hanc quidem contumax et incredulus custodiret:
              Uenit tandem filius dei et corpus humanum adsumpsit, ut dum uideretur
              crederetur. * Omissisque mundus dęmonum simulacris'
          - pb[type=manuscript,n=P15v,facs=#P15v]
          - foreign[lg=lat-Latn]: reconciliaretur gratię conditoris.
        - seg:
          - 'Oh ir uuardh dhanne uuidharbruhtic, mit unuuerdnissu gotes chiunhreinida
            dhazs undarquhedene chibot. Inan dhuo dhanan uzs dhurah geilin aruuorpanan
            ni arsluoc got, oh uurehhan chifrumida uzs fona paradises bliidhnissu;
            beit noh dhuo dher aluualdendeo dhazs ir sih auur dhurah hreuun mahti
            chigarauuan zi chinisti. Endi so ir auur dhuo ni uuas huuerfandi zi dhes
            ęrrin meghines uueghe: Gab dhuo got moysi euua, dhazs ir dhoh in dheru
            chihuurfi zi gotes minniu endi zi rehtnissa uuerchum. Oh so ir dhuo ubarmuodic
            endi unchilaubendi noh dhea selbun euua ni uuereda: Dhuo azs iungist bidhiu
            quham gotes sunu endi antfenc mannes liihhamun, dhazs dhanne sie inan
            selbun chisahin, dhoh so chilaubidin. Endi dhazs mittingart firleizssi
            diubilo drugidha endi auur'
          - pb[type=manuscript,n=P15v,facs=#P15v]
          - aruuegodi zi sines scheffidhes huldin.
      - s[n=11]:
        - seg:
          - foreign[lg=lat-Latn]: 'Hec est causa natiuitatis christi, quem iudęi etsi
              patiantur natum scandalizantur tamen crucifixum et mortuum. Non intellegentes
              quia sicut propter redemptionem mundi illum dicit nasci ita et pati
              oportuit. Cuius passionem et mortem in suo loco scripturarum testimoniis
              adprobabimus. Nunc uero sequamur debitum ordinem, et cuius demonstrata
              est post gloriam deitatis humana natiuitas, demonstretur et genus et
              patria:'
        - seg:
          - Dhiz ist dhiu sahha christes chiburdi, dhen iudeoliudi, dhoh sie inan
            chiboranan chilauben, lastront inan dhoh dhiu huuedheru in cruci chislaganan
            endi dodan. Ni sindun firstandande dhazs so selp so ir dhurah uueraldi
            aloosnin uuardh chiboran chisaghet, so sama auh uuard chiquhedan dhazs
            ir bi mittingardes nara chirista chimartirot uuerdhan. Dhes martyrunga
            endi dodh uuir findemes mit urchundin dhes heilegin chiscribes, dhanne
            uuir in andreidim dhurahfaremes dhazs hear aer dhiu zi sagenne ist. Nu
            auur folghemes dhera bigunnenun redha. Endi dhes selben christes, dhes
            uuir iu sinera manniscnissa chiburt after dhera gotnissa guotliihhin chichundidom,
            chichundemes auh nu dhes ędhili endi odhil.
  - chapter[n=6]:
    - pb[n=15v,facs=#p15v]
    - head:
      - VI.
      - INCIPIENTES PRIMUM DE NOMINE EIUS LOQUI
    - head:
      - VI.
      - BIGUNSTON AUH ERIST UMBI SINAN NAMUN SPREHHAN
    - p:
      - s[n=1]:
        - seg:
          - foreign[lg=lat-Latn]:
          - pb[type=manuscript,n=P16r]
          - foreign[lg=lat-Latn]: Prima enim appellatio nominis iesu inuenitur in
              figura domini nostri iesu christi antea praedicata. Nam auses quidam,
              qui naue filius nominabatur, a moyse iesus cognominabatur. Hic enim
              post obitum moysi dux effectus principatum obtenuit et terram promissę
              hereditatis distribuit. Mutatio nominis quid significabat? Nisi quia
              defuncto moyse, id est defuncta lege et legali praecepto cessante, dux
              nobis dominus iesus christus erat futurus? Qui nos per iordanis fluenta,
              id est per baptismi gratiam sanctificatos et omnibus uitiorum gentibus
              expulsis uel
          - pb[type=manuscript,n=P16v]
          - foreign[lg=lat-Latn]: angelorum malorum hostibus effugatis perduceret
              ad terram repromissionis melle et lacte edentem, id est uitę aeterne
              * possessionem, qua nihil dulcius.
        - seg:
          - pb[type=manuscript,n=P16r]
          - Azs erist uuardh iesuses namo fundan in bauhnungum unseres druhtines iesus
            christus bifora chimeinit. Huuanda bidhiu uuardh chiuuisso auses dher
            naues sunu fona moysise in binamin iesus chinemnit. Dher selbo infenc
            haerduom dhes israhelischin folches, dhuo ir dhes leididh uuardh after
            moysises ablide endi dhea lantscaffi dhes im chiheizssenin arbes chideilida.
            Uuexsal dhes nemin huuazs bauhnida? Nibu dhazs after moysise dodemu endi
            dheru euu zifareneru ioh dhem aldom gotes chibodum bilibenem uns zuouuert
            leididh uuardh unser druhtin iesus christus, dher unsih dhurah iordanes
            runsa, dhazs ist dhurah dhea gheba dhera heilegun daufin chiheilegode,
            allem sundono chunnum ardribenem ioh allem herrum ubilero angilo
          - pb[type=manuscript,n=P16v]
          - arflaugidem, unsih dhurahleidit in dhea chiheizssenun lantscaf, dhar honec
            endi miluh springant, dhazs ist in dheo uualaæhti dhes euuighin libes,
            huuanda dhemu neouuihd nist suuozssera.
      - s[n=2]:
        - seg:
          - foreign[lg=lat-Latn]: 'Ideo enim ille huius sacramenti imaginem suscepit,
              ut iesus nominaretur ad significandum illum uerum iesum. De quo in psalmis
              scribtum est: ** »Uenite, laudemus dominum, iubilemus petre iesu nostro«.
              Ubi ostenditur dominum esse iesum. De quo et alibi in psalmis: »Placet
              sibi dominus in populo suo et exaltabit mansuetos in iesu«. Hec enim
              in hebręo * sic habentur.'
        - seg:
          - 'Bidhiu antfenc chiuuisso dher naues sunu dhes heileghin chirunes chiliihnissa,
            dhazs ir iesus uuardh chinemnit in bauhnungum dhes chiuuarin iesuses.
            Umbi dhen in psalmum chiscriban ist: »Quhemet * endi lobemes druhtin,
            in hruofte singhemes gote unseremu iesuse«. Hear ist araughit dhazs iesus
            ist druhtin, umbi dhen auh in andreru stedi in psalmum quhidhit: »Liihhet
            imu druhtine in sinem liudim, endi arheuit * dhea mituuarun in iesuse«.
            Dhiz ist chiuuisso in dhemu hebræischin chiscribe sus chiquhedan.'
  - chapter[n=7]:
    - pb[n=16v,facs=#P16v]
    - p:
      - s[n=1]:
        - seg:
          - foreign[lg=lat-Latn]: 'Genesis ostentit dicente abraham ad puerum suum:
              »Pone manum sub femore meo et iura per deum cęli«. Quo uerbo christum
              * deum cęli de genere suo testabatur in carne esse uenturum. Per femur
              enim genus intellegitur. Significabatur autem de semine abrahe futurum
              in carne deum celi. De quo semine per esaiam facta fuerat ei a domino
              repromissio: »In semine«, inquit, »tuo benedicentur omnes gentes«, id
              est in christo. De quo psalmista ait: »Et benedicentur in eo omnes tribus
              terre, omnes gentes magnificabunt eum«.'
        - seg:
          - 'Genesis saghet huueo abrahames chibot uuas zi sinemu chnehte: »Duo dhina
            hant undar mn dheoh endi suueri bi himilischin gote«. In dhemu uuorde
            chundida ir bifora umbi christan himilischun druhtin, dhazs ir in sines
            edhiles fleische quhoman scolda uuerdan. In dheohe ist chiuuisso zi firstandanne
            framchumft. Bauhnida dhuo fona abrahames samin zuouuerdan in fleische
            himiliscun got. In sinemu samin uuardh imu fona druhtine chiheizssan dhurah
            esaian quhedhandan: »In dhinemu samin uuerdhant chiuuihido allo dheodun«,
            * dhazs ist in christe. Fona imu quhad dher psalmscof: »Endi in imu uuerdhant
            chiuuihit alliu ærdhchunni, allo dheodun lobont inan«.'
      - s[n=2]:
        - seg:
          - foreign[lg=lat-Latn]:
          - pb[type=manuscript,n=P17v,facs=#P17v]
          - foreign[lg=lat-Latn]: 'De hoc semine et per eundem esaiam uox domini loquitur:
              »Educam«, inquid, »de iacob semen et de iuda possedentem montes meos«.
              De quo alibi idem propheta: »Nisi dominus reliquisset nobis semen«.'
        - seg:
          - pb[type=manuscript,n=P17v,facs=#P17v]
          - 'Endi umbi dhen samun dhurah dhen selbun esaian quhad druhtines stimna:
            »Ih bibringu fona iacobes samin endi fona iuda dhen mina berga chisitzit«.
            Umbi dhen auh in andreru stedi dher selbo forasago quhad: »Nibu druhtin
            uns firleazssi samun«.'
  - chapter[n=8]:
    - pb[n=17v,facs=#P17v]
    - head:
      - VIII.
      - ET QUIA DE TRIBU IUDA SECUNDUM CARNEM CHRISTUS EXPECTANDUS ESSET,
    - head:
      - VIII.
      - ENDI BIHUUIU MAN IN IUDASES CHUNNES FLEISCHE CHRISTES BIDENDI UUAS,
    - p:
      - s[n=1]:
        - seg:
          - foreign[lg=lat-Latn]: 'Iacob patriarcha significat dicens: »Non deficiet
              princeps ex iuda nec dux de faemoribus eius, donec ueniat qui mittendus
              est, et ipse erit expectatio gentium«. Certum est enim usque ad ortum
              christi non defuisse principes iudeorum populi ex genere iuda nec duces
              de fęmoribus * eius usque ad herodem'
          - pb[type=manuscript,n=P18r]
          - foreign[lg=lat-Latn]: alienigenam regem. Qui per ambitionem regni inrepserat
              potestatem.
        - seg:
          - 'Iacob dher hoho fater bauhnendo quhad: »Ni zirinne herrin fona iudæ noh
            herizohin fona sinem dheohum: Innan dhiu dher quhimit, dher chisendit
            uuirdhit, endi dher selbo ist dhes dheodun bidant«. Uuaar ist chiuuisso
            untazs dhea chumft christes chiburdi, dhazs ni bilibun ano herrun iudæoliudi
            fona iudases chunne noh ano leididh fona sinem dheohum untazs herodan'
          - pb[type=manuscript,n=P18r]
          - dhen elidheodigun chuninc. Dher in ghirin dhes riihhes dhurahsnuoh dhes
            chiuualdi.
      - s[n=2]:
        - seg:
          - foreign[lg=lat-Latn]: Statim enim ut hoc factum est et defecit dux ex
              semine iudę, aduenit ille, qui mittendus erat, quem gentes et populi
              expectabant. Iudei autem peruicacia inpudice frontis dicunt nondum esse
              hoc tempus expletum mentientes nescio quem regem ex genere iudę in extremis
              orientis partibus regnum tenere.
        - seg:
          - Saar so dhuo so uuard chidaan, endi bileiph dhuo leididhduom fona iudases
            samin endi quham dher chisendit scolda uuerdhan, dhes dheodun endi liudi
            bidande uuarun. Dhea iudea auur dhurah iro grimmin mit dhemu unscama habendin
            andine quhedhant leogando dhazs noh ni sii dhazs ziidh arfullit, ni uueizs
            ih einigan chuninc fona iudases edhile noh in uzssonondem endum oostarriihhes
            uualdendan.
      - s[n=3]:
        - seg:
          - foreign[lg=lat-Latn]: Nec adtendunt mente cecati simulationis sue mendacia
              detegi. Quia iam sicut nullum templum nullum altare nullum sacrificium
              ita nullus rex * nullus sacerdos remansit iudęis. Neque enim mendax
          - pb[type=manuscript,n=P18v,facs=#P18v]
          - foreign[lg=lat-Latn]: 'esse potest osee propheta, qui dicit: »Sedebunt
              filii israel sine rege sine principe sine sacrificio sine altari sine
              sacerdotio sine manifestationibus«. Quę omnia quis non uideat nunc in
              ipsis esse completa?'
        - seg:
          - Ni nemant gaumun muotes blinde dhero iro chiliihsamono lugino antdhecchidero.
            Huuanda so selp so im noh ein tempel ni bileiph noh einich altari noh
            einich offerunc ghelstar, so sama ni bileiph im einich chuninc noh einich
            sacerdos iudęoliudim. Noh einich lughin ni mac uuesan osee propheta, dher
            quhad
          - pb[type=manuscript,n=P18v,facs=#P18v]
          - 'heilegu gheistu: »Sitzent israheles suni ano chuninc ano herrun ano offerunc
            ghelstar ano altari ano bisscofheit ano araucnissa«. Huuer ist dher dhiz
            al ni chisehe in im selbem nu uuesan arfullit?'
  - chapter[n=9]:
    - pb[n=18v,facs=#P18v]
    - head:
      - IX.
      - QUIA CHRISTUS DE STIRPE DAUID NATUS EST
    - head:
      - IX.
      - HEAR SAGHET HUUEO CHRISTUS FONA DAUID FRAMCHUMFTI CHIBORAN UUARDH
    - p:
      - s[n=1]:
        - seg:
          - foreign[lg=lat-Latn]: 'Ecce ex qua tribu nasciturus esset christus docemur.
              Ex dauid autem stirpe secundum carnem futurus esse per spiritum sanctum
              ita praenuntiatus est in psalmis: »Iurauit dominus dauid in ueritate
              et non frustrabitur eum: De fructu uentris tui ponam super sedem meam«.
              »Semel iuraui in sancto meo, si dauid mentiar: semen eius in eternum
              manebit. Et thronus eius'
          - pb[type=manuscript,n=P19r]
          - foreign[lg=lat-Latn]: sicut sol in conspectu meo et sicut luna perfecta
              in eternum et testis in celo fidelis«.
        - seg:
          - 'See chunnemes nu fona huueliihhemu ædhile christ chiboran uuerdhan scoldi,
            fona dauides framchumfti after fleisches mezsse quhoman uuerdhan dhurah
            heilegun gheist, so ir chiforabodot uuardh in psalmom: »Druhtin suuor
            dauite in uuaarnissu endi ni huolida imu: Dhinera uuomba uuaxsmin setzu
            ih ubar mn hohsetli«. »Eines suuor ih in minemu heileghin: ni liugu ih
            dauid, sn samo ardot in æuuin. Endi sn hohsetli ist solih so sunna azs
            minera'
          - pb[type=manuscript,n=P19r]
          - antuuerdin endi in æuuin so sama so foluuassan mano, endi dher ist chitriuuui
            urchundo in himile«.
      - s[n=2]:
        - seg:
          - foreign[lg=lat-Latn]: 'Item in libro paralipomenon: »Et factum est uerbum
              domini ad nathan dicens: Uade et dic seruo meo dauid: Hec dicit dominus,
              adnuntio tibi quod ędificaturus sit domum tibi dominus. Cumque impleueris
              dies tuos, ut uadas ad patres tuos, suscitabo semen tuum post te, quod
              erit de filiis tuis, et stabiliam regnum eius. ipse edificauit mihi
              domum, et firmabo solium eius usque in ęternum. Ego ero ei in patrem
              et ipse erit mihi in filium, et misericordiam meam non auferam ab eo,
              sicut abstuli ab eo, qui ante te fuit.'
          - pb[type=manuscript,n=P19v,facs=#P19v]
          - foreign[lg=lat-Latn]: Et statuam eum in domo mea et in regno meo usque
              in sempiternum, et thronus eius erit firmissimus in perpetuum«.
        - seg:
          - 'So auh in andreru stedi ist chiscriban in paralipomenon: »Endi uuardh
            uuordan druhtines uuort zi nathane quhedendi: Ganc endi saghe minemu scalche
            dauide: Sus quhad druhtin: Ih saghem dhir dhazs druhtin dhir ist huus
            zimbrendi. So huuanne so dhu dhina daga arfullis, dhazs dhu faris zi dhinem
            fordhrom, ih aruuehhu dhinen samun after dhir, dher uuesan scal fona dhinem
            sunim, endi chistiftu imu sn riihhi. dher selbo zimbrit mir huus, endi
            ih chifestinon dhes sedhal untazs in ęuun. Ih scal imu uuesan in fater
            stedi endi ir scal mir uuesan in sunes, endi mina miltnissa ni nimu ih
            ab imu, so ih fona dhemu nam, dher ær fora dhir uuas. Endi ih inan chistiftu
            in minemu'
          - pb[type=manuscript,n=P19v,facs=#P19v]
          - dome endi in minemu riihhe untazs in eouuesanden euun. Endi sn hohsetli
            scal uuesan festista untazs in euun«.
      - s[n=3]:
        - seg:
          - foreign[lg=lat-Latn]: 'Hęc omnia quisquis in salomone putat fuisse inpleta,
              multum errare uidetur. Nam qualiter in salomone intellegendum est quod
              dictum est: »Postquam dormieris cum patribus tuis, suscitabo semen tuum
              post te, quod erit de filiis tuis, et stabiliam regnum illius«? Numquid
              de illo salomone creditur prophetatum? minime. Ille enim patre suo uiuente
              coepit regnare. Nam hic dicitur quia »cum repleti fuerint dies tui et
              dormieris cum patribus tuis, suscitabo semen tuum«. Ex quo intellegitur
              alius esse promissus,'
          - pb[type=manuscript,n=P20r,facs=#P20r]
          - foreign[lg=lat-Latn]: quia non ante mortem dauid sed post mortem eius
              pronuntiatus fuerat suscitandus.
        - seg:
          - 'Dhiz susliihhe so huuer so uuanit dhazs izs in salomone uuari al arfullit,
            filu aboho firstandit. Inu huueo ist in salomone zi firstandanne dhazs
            sus chiquhedan uuardh: »After dhiu so dhu slafis mit dhinem faterum, ih
            aruuehhu dhinan samun after dhir, dher uuesan scal fona dhinem sunim,
            endi ih chistiftu dhemu sn riihhi«? Neo nist zi chilaubanne dhazs fona
            dhemu salomone sii dhiz chiforabodot. Dher chiuuisso bi sinemu fatere
            lebendemu bigunsta riihhison. Inu hear quhidit: »Huuanda so dhine daga
            arfullide uuerdhant endi dhu slafis mit dhinem faterum, ih aruuehhu dhinan
            samun«. Fona dhesiu ist zi firstandanne dhazs dhar ander uuard chiheizssan'
          - pb[type=manuscript,n=P20r,facs=#P20r]
          - Huuanda ni uuardh ir ęr dauides dode nibu after sinemu dode chiforabodot
            zi aruuehhanne.
      - s[n=4]:
      - s[n=5]:
      - s[n=6]:
        - seg:
          - foreign[lg=lat-Latn]: 'De quo per hieremiam ipse dominus dicit: »Ecce
              dies ueniunt, dicit dominus, et suscitabo dauid germen iustum et regnauit
              rex * et sapiens erit et faciet iudicium et iustitiam super terram.
              In diebus eius saluabitur iuda et israel habitauit confidenter, et hoc
              est nomen, quod uocabunt eum: dominus iustus noster« iste est.'
        - seg:
          - 'Umbi dhen dhurah hieremiam druhtin selbo quhad: »See daga quhemant, quhad
            druhtin, endi ih * aruuechu dauide rehtuuisigan chimun, endi ir chuninc
            scal dhanne riihhison endi uuisi uuirdit endi frummit urdeili endi rehttunga
            oba ærdhu. In dhes dagum scal iuda uuerdhan chihaldan endi israhel auh
            ardot baltliihho. Endi ist sn namo, so sie inan nemnant: dhese ist unser
            druhtin dher rehtuuisigo«.'
      - s[n=7]:
        - seg:
          - foreign[lg=lat-Latn]: 'Qui per nathan ex semine dauid promittitur, qui
              etiam et per isaiam prophetam ita pronuntiatur: »Egredietur«, inquit,
              »uirga de radice iesse et flos de radice eius ascendit«. Fuit enim de
              patria bethleem de domo dauid. Hęc uirga de radice iesse uirgo est maria
              de dauid radice'
          - pb[type=manuscript,n=P20v,facs=#P20v]
          - foreign[lg=lat-Latn]: 'exorta, quę genuit florem dominum saluatorem. De
              quo etiam sequitur: »Et requiescit super eum spiritus domini, spiritus
              sapientię et intellectus, spiritus consilii et fortitudinis, spiritus
              scientię et pietatis et repleuit eum spiritus timoris domini«.'
        - seg:
          - 'Dher dhurah nathanan uuardh chiheizssan fona dauides samin, ioh auh dher
            selbo uuardh dhurah esaian dhen forasagun chiforabodot; ir quhad: »Arliudit
            uph gardea fona iesses uurzom endi blomo arstigit fona dheru sineru uurzun«.
            Dhiz quhad ir, bidhiu huuanda ir uuas chiuuisso fona betlemes lantscaffi
            fona dauides chunne. Dhesiu gardea fona dheru iesses uurzun dhazs ist
            dhiu unmeina magad maria'
          - pb[type=manuscript,n=P20v,facs=#P20v]
          - 'fona dauides uurzun framquhoman, dhiu chibar blomun, dhen haldendan druhtin.
            Fona dhemu selbin folghet hear auh after: »Endi chirestit oba imu gheist
            druhtines, gheist uuiisduomes endi firstandendi chidhanc, gheist chirades
            endi meghines, gheist chiuuizsses endi armhęrzin, endi arfullit inan gheist
            gotes forahtun«.'
      - s[n=8]:
        - seg:
          - foreign[lg=lat-Latn]: Ideo autem tanta dona spiritus super eum praedicantur,
              quia in eum non ad mensuram spiritus inhabitat sanctus sicut in nobis,
              sed tota inest plenitudo diuinitatis et gratiarum. Iste est qui »non
              secundum uisionem oculorum et auditum aurium iudicat, sed est iustitia
              cingulum lumborum eius et fides cinctorium renum eius«. In cuius ęcclesia
              »habitat
          - pb[type=manuscript,n=P21r,facs=#P21r]
          - foreign[lg=lat-Latn]: lupus cum agno«, ille utique, qui solebat ab ea
              rapere praedam. Dum ad eam conuertitur, cum innocentibus commoratur.
        - seg:
          - Bidhiu auur sindun oba dhemu so manacsamo gheba dhes gheistes chiforabodot,
            huuanda in imu ni ardot dher heilego gheist zi mezsse so in uns. Oh in
            imu ist elliu folnissa gotes ghebono ioh gheistes. Dhese ist dher »ni
            ardeilit after augono chisiune endi orono chihlose, oh rehttunga ist bruohha
            sinero lumblo endi triuuua sindun sinero lendino gurdil«. In dhes chiriihhun
            »ardot uuolf mit lambu«, ioh dher chiuuon uuas fona dheru
          - pb[type=manuscript,n=P21r,facs=#P21r]
          - chiriihhun nama ardhinsan. Innan dhiu ir chiuuoruan ist, mit dhem unbalauuigom
            ist sn samuuist.
      - s[n=9]:
        - seg:
          - foreign[lg=lat-Latn]: In cuius ouile »pardus cum hedo accubat«, permixti
              scilicet subdoli cum peccatoribus. Ibi etiam »uitulus« de circumcisione,
              »leo« de saeculi * potestate, »oues« de populari ordine »simul morantur«.
              Quia in fide communis est conditio omnium. »Puer autem paruulus minans
              eos« ille est utique, qui se humiliauit pro nobis ut paruulus. »Bos
              autem et leo ibi comedent paleas«, quia principes cum subiectis plebibus
              communem habent doctrinam.
        - seg:
          - 'In dhes æuuiste »sitzit pardus mit gheizssinu«, bauhnit dhea nidhigun
            chimenghide mit sundigem. Dhar auh »chalp« fona dheru iudæischun euu,
            »leo« fona uueraltchiuualdidu, »scaap« fona smalero manno mezsse »samant
            uuonent« mit dhem sturirom in dheru christes chiriihhun, huuanda dhar
            ist in rehteru chilaubin allero uuesan chimeini. »Liuzil chind dribit
            auur dhiu alliu«: dher ist dhazs chiuuisso, dher sih dhurah unsih chiodmuodida
            so selp so chind. »Oxsso auh endi leo dhar ezssant samant spriu«, huuanda
            dhea herostun mit dheru smelerun dheodu eigun dhar chimeine lerunga.'
      - s[n=10]:
        - seg:
          - foreign[lg=lat-Latn]: »Delectatur quoque infans ab ubere
          - pb[type=manuscript,n=P21v,facs=#P21v]
          - foreign[lg=lat-Latn]: 'super foramine aspidis«: Dum gentes, quę solebant
              uenena praedicare aliquando, conuersi etiam paruoli christi fidem delectantur
              audire. »Cauerna enim reguli« corda sunt infidelium, in quibus ille
              serpens tortuosus requiescebat, quem »ablactatus« conpraehensum * exinde
              captiuum traxit, ut »in monte sancto eius«, quod est ecclesia, »non
              noceret«.'
        - seg:
          - »Dazs chind uuas gerondi fona muoter brustum ubar dhes
          - pb[type=manuscript,n=P21v,facs=#P21v]
          - aspides hol«. Bauhnit, innan dhiu dheodun chiuuon uuarun iuhuuanne eitar
            predigon, dhea auur chihuuoruane in miltnisso chindo, lustida sie christinheidi
            chilaupnissa chihoran. »Dhera nadrun hol« bauhnida chiuuisso dhero unchilaubono
            muotuuillun, in dhem dhiu chrumba nadra inne restida, dhea chisaughida
            gotes uuordes, chifangana ardhans sia christ dhanan uuzs alilenda, dhazs
            siu »in dhemu christes berghe«, dhazs ist dhera christinheidi chiriihha,
            »ni deridi«.
      - s[n=11]:
        - seg:
          - foreign[lg=lat-Latn]: 'Adhuc idem esaias de christo quia ex semine dauid
              natus est secundum carnem sic in consequentibus dicit: »In die illa
              radix iesse, qui stat in signum populorum, ipsum gentes depraecabuntur
              * et erit sepulchrum eius gloriosum«.'
          - pb[type=manuscript,n=P22r,facs=#P22r]
          - foreign[lg=lat-Latn]: In signum populorum stat radix iesse, quando christus
              signaculum crucis exprimit in frontibus eorum. Ipsum gentes depraecabuntur,
              * quod iam obtutu cernitur fuisse completum. Sepulchrum autem eius in
              tantum est gloriosum, ut accepto quod redempti pro morte eius gloriam
              ei exhibemus, etiam locus ipse coruscans miraculis glorie suę causa
              ad se omnem contrahat mundum.
        - seg:
          - 'Hear auh noh frammert saghet dher selbo forasago esaias fona christe,
            huueo ir fona dauides samin uuardh chiboran after fleisches mezsse, so
            sama so hear after quhidhit: »In dhemu daghe standit dhiu iesses uurza
            in zeihne dhero liudeo, dhen selbun sindun dheodun bitdande, endi sn grab
            scal sn guotliih«. In liudeo zeihne standit dhiu'
          - pb[type=manuscript,n=P22r,facs=#P22r]
          - iesses uurza, dhanne christ dhes crucis zeihhan chidhuhit in iro andinum.
            dhen selbun sindun dheodun bitdande, dhazs iu azs antuuerdin chisehet
            arfullit uuordan. Sn grab ist auur so drado ęruuirdhic, dhazs uuir, dhea
            christ chihaloda, dhera alosnin uuidhar sinemu dodhe bi sculdim dheru
            stedi ærliihho ęra beremes. Ioh auh dhiu selba stat chischeinit uundarliihhem
            zeihnum dhes sines æruuirdhighin chiuualdes sahha ioh zi imu chidhinsit
            allan mittingart.
      - s[n=12]:
        - seg:
          - foreign[lg=lat-Latn]: 'Hic locus in hebreo habet »et erit requies eius
              gloriosa«. Utique quia moriens caro eius non uidit corruptionem secundum
              psalmi sententiam: »Nec dabis sanctum tuum uidere corruptionem«.'
        - seg:
          - 'Dheasa stat auh meinit in dhemu ębræischin chiscribe »Endi sn restin
            scal uuesan ærliihhu«. So chiuuisso ist dhazs imu arsterbandemu sn fleisc
            ni chisah enigan unuuillun. So after dhes psalmscoffes quhide ist chiquhedan:
            »Ni ghibis dhinemu heileghin zi chisehanne unuuillun«.'
