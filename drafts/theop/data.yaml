text:
- body:
  - chapter[n=1]:
    - pb[type=manuscript,n=143r]
    - lg:
      - l[n=1]:
        - IK BYN GHENANT THEOPHOLUS.
      - l[n=2]: 'Mine claghe kundeghe ik alsus:'
    - lg:
      - l[n=3]: Ik was ghenant eyn cloker man,
      - l[n=4]: Der papheit konde ik my wol vorstan
    - lg:
      - l[n=5]: 'Vnde ok an vroliken saken:'
      - l[n=6]: Ik konde wol recht maken
    - lg:
      - l[n=7]: Vnde recht konde ik vor keren
      - l[n=8]: Vnde vnrecht wol meren.
    - lg:
      - l[n=9]: Ik was woldich vnde rike.
      - l[n=10]: My was neyman ghelike
    - lg:
      - l[n=11]: An reden vnde ok an synnen.
      - l[n=12]: De(s) hadde ik alle en bynnen
    - lg:
      - l[n=13]: Noch [= Nach?] eren, so ik hope.
      - l[n=14]: Ghekoren wart ik to eynem biscope.
    - lg:
      - l[n=15]: Ik scolde eyn here sin ghewesen,
      - l[n=16]: Do vordrot my synghen vnde lesen.
    - lg:
      - l[n=17]: Gans [= Tans?] haue ik eyn ander ghekoren.
      - l[n=18]: 'O wi, dat ik ju wart gheboren:'
    - lg:
      - l[n=19]: Myn prouende wart my ghenomen,
      - l[n=20]: De plach my to houe komen
    - lg:
      - l[n=21]: An wine vnde an vete [= wete],
      - l[n=22]: Des mot ik eyn arm man heten.
    - lg:
      - l[n=23]: Ik wil od alle waghen
      - l[n=24]:
        - Vnde wil dem [= don] dar solke claghe,
    - pb[type=manuscript,n=143v]
    - lg:
      - l[n=25]: Dat swar is to draghen.
      - l[n=26]: Doch wil ik od waghen,
    - lg:
      - l[n=27]: 'Vnde wart my alto swar:'
      - l[n=28]: Ik mot my gheuen in der duuel schar;
    - lg:
      - l[n=29]: Eft ienich duuel were
    - lg:
      - l[n=30]: By my hir up erden,
      - l[n=31]: Syn eghen wolde ik werden.
    - lg:
      - l[n=32]: Ik wolde ome beden ere
      - l[n=33]: Nu vnde jummer mere,
    - lg:
      - l[n=34]: Groter, wan ik Gode dede,
      - l[n=35]: Dat he my hulpe darmede,
    - lg:
      - l[n=36]: Dat ik worde eyn so rike man,
      - l[n=37]: Dat ik mochte wederstan
    - lg:
      - l[n=38]: Dem biscope vnde den heren
      - l[n=39]: Vnde alle den, de myne wedersaten weren.
    - lg:
      - l[n=40]: De don my so grote anlaghe,
      - l[n=41]: Dat ik dat Gode van himmel claghe.
    - lg:
      - l[n=42]: Ik beyde dy, Satanas,
      - l[n=43]: Bi dem Gode, dede hefft ghescapen lof vnde gras,
    - lg:
      - l[n=44]: De alle dingk ghescapen hefft,
      - l[n=45]: Dem himmel vnde erde tobode stad!
    - pb[type=manuscript,n=144r]
    - lg:
      - l[n=46]:
        - Ik beswere di bi dem valle,
        - '{Ik beswere dy bi dem valle,}'
      - l[n=47]: Den de duuel deden alle,
    - lg:
      - l[n=48]: Du vnde dine ghenoten,
      - l[n=49]: Do gy van dem himmel worden gestoten.
    - lg:
      - l[n=50]: Ik beswere dy by den jungesten dage,
      - l[n=51]: Wan God deyt so grote clage
    - lg:
      - l[n=52]: Ouer alle syne vndersaten,
      - l[n=53]: Dat du komest vil drade
    - lg:
      - l[n=54]: Vnde antwordes hir my
      - l[n=55]: Alle, des ik vrage dy.
    - lg:
      - l[n=56]: '(S)ATINAS SPRAK: Theophile, wat menestu hir mede?'
      - l[n=57]: Dat is io der papen sede,
    - lg:
      - l[n=58]: Dat du my so sere besweret hest
      - l[n=59]: Bi dem Gode, dede heft gescapen lof vnde gras,
    - lg:
      - l[n=60]: De alle ding ghescapen hat,
      - l[n=61]: Beyde grot vnde stat.
    - lg:
      - l[n=62]: Alsus plege gy papen,
      - l[n=63]: Gy bedregen vns, so de lude de apen.
    - lg:
      - l[n=64]: Gy binden vns up in eyt,
      - l[n=65]: Dat sy vns lef edder leyt,
    - lg:
      - l[n=66]: Dat wy moten to ju komen.
      - l[n=67]: Du heft my lange reyse benomen.
    - lg:
      - l[n=68]: 'Ik was hen to Judea:'
      - l[n=69]:
        - Myne ghesellen schochte ek aldar.
    - pb[type=manuscript,n=144v]
    - lg:
      - l[n=70]: De koning is dar ghestoruen,
      - l[n=71]: De zele hedde ek wol irworuen.
    - lg:
      - l[n=72]: Dar hedde ek gerne bleuen,
      - l[n=73]: Du heft my daraf ghedreuen.
    - lg:
      - l[n=74]: Tohant do ek dynen syn vornam,
      - l[n=75]: Vil drade dat ek to dy quam.
    - lg:
      - l[n=76]: 'Nu sage: wat wultu my,'
      - l[n=77]: Nu ek byn ghekomen to dy?
    - lg:
      - l[n=78]: 'THEOPHILE SPRAK: Satanas, hastu suluer vnde golt?'
      - l[n=79]: Ik wil dy geuen den duresten solt,
    - lg:
      - l[n=80]: 'Den ek ju ghewan:'
      - l[n=81]: Wente ek byn eyn ebele [= edele] man.
    - lg:
      - l[n=82]: Ik wil dy vorkopen
      - l[n=83]: My(n) zele; in der dopen
    - lg:
      - l[n=84]: Myt Godes blode war se reynicheit
      - l[n=85]: 'Vnde na Godes bilde voreynicheit:'
    - lg:
      - l[n=86]: De wil ek dy geuen in dyne hant,
      - l[n=87]: Ik enhan neyn durer pant,
    - lg:
      - l[n=88]: Wultu dat also vnfangen,
      - l[n=89]: So wil ik den winkop angangen.
    - lg:
      - l[n=90]: '(SA)TANAS SPRAK: Neyn, de rede doget nicht,'
      - l[n=91]:
        - Duncket dy, suluer vnde golt wesen nicht?
    - pb[type=manuscript,n=145r]
    - lg:
      - l[n=92]: Dat is vul dicke ghescheyn,
      - l[n=93]: Des wil wy vns vorseyn,
    - lg:
      - l[n=94]: Dat wy den luden vnse gud geuen,
      - l[n=95]: Dat se oren wollust mede dreuen
    - lg:
      - l[n=96]: Twintich edder wol drittich jar,
      - l[n=97]: Do begunden se dencken dar,
    - lg:
      - l[n=98]: An den wech to komen,
      - l[n=99]: Dat se vns worden ghenomen.
    - lg:
      - l[n=100]: Is dek nu vnse gud lef,
      - l[n=101]: So lat vns scriuen eynen bref
    - lg:
      - l[n=102]: Vnde eynne [=  eyne] hantfeste,
      - l[n=103]: Also plegen io de besten.
    - lg:
      - l[n=104]: 'De scal alsus wesen:'
      - l[n=105]: Alle, de dussen bref lesen,
    - lg:
      - l[n=106]: Horen edder seyn,
      - l[n=107]: De scullen des bekennen vnde gen,
    - lg:
      - l[n=108]: Dat Theophilus des duuel sy.
      - l[n=109]: Dyn jngesegel henge ok darby,
    - lg:
      - l[n=110]: De bref mot vullenkomen syn.
      - l[n=111]: Henge ok daran dyn vingerlin,
    - lg:
      - l[n=112]: Dat du dregest an dyner hant,
      - l[n=113]: So antworde my den bref vnde pant.
    - lg:
      - l[n=114]: Du scalt herliken leuen;
      - l[n=115]:
        - Ek wil dy gudes en noch gheuen.
    - pb[type=manuscript,n=145v]
    - lg:
      - l[n=116]: '(T)HEOPHILE SPRAK: Wat scolde dy de bref myn?'
      - l[n=117]: Myne wort schullen war syn,
    - lg:
      - l[n=118]: Ek wil dy nicht vorleghen.
      - l[n=119]: Wolde ik dy bedregen,
    - lg:
      - l[n=120]: So en hete ek neyn pape.
      - l[n=121]: 'SATANAS SPRAK: Neyn, du eyn [= en] kanst dar nicht mede schapen.'
    - lg:
      - l[n=122]: Wuldu vns werden vnderdan,
      - l[n=123]: Dyn hantfeste wil ik han
    - lg:
      - l[n=124]: Vnde de breue dyn,
      - l[n=125]: Dat du willest wesen myn.
    - lg:
      - l[n=126]: So lat my eynen bref scriuen,
      - l[n=127]: Dat du willest by my bliuen.
    - lg:
      - l[n=128]: Dar scrif in, dat lif vnde de zele dyn
      - l[n=129]: Sculle des duuel(s) syn,
    - lg:
      - l[n=130]: Vnde nummer dyner trost sculle mer werden,
      - l[n=131]: Beyde an himmel vnde an erden;
    - lg:
      - l[n=132]: We ok vor dy beyde,
      - l[n=133]: De vns vnrechte dede.
    - lg:
      - l[n=134]: Behaget dy sus de sake,
      - l[n=135]: So wil ik den winkop maken.
    - pb[type=manuscript,n=146r]
    - lg:
      - l[n=136]:
        - '(T)HEOPHILE SPRAK: Wat eyn io don mot,'
      - l[n=137]: Dat is dicke mate gud.
    - lg:
      - l[n=138]: Ek byn darvmme to di komen,
      - l[n=139]: So en deil ik han vornomen,
    - lg:
      - l[n=140]: 'Ik wil dyn denstman werden:'
      - l[n=141]: Wat du my bust vp erden,
    - lg:
      - l[n=142]: Dat do ik nu vnde jummer mere.
      - l[n=143]: 'SATANAS SPRAK: Do also eyn here.'
    - lg:
      - l[n=144]: '(T)HEOPHILE SPRAK: Du w(u)lt my darto driuen,'
      - l[n=145]: Dat ek eynen bref late scriuen
    - lg:
      - l[n=146]: Vnde eyn(e) hantfeste -
      - l[n=147]: Also du sprekest also [= Also don, sprekestu,] de beste -
    - lg:
      - l[n=148]: De my an myne zele geyt,
      - l[n=149]: Dar to byn ek al bereyt.
    - lg:
      - l[n=150]: 'THEOPHILE SPRAK: So loue my openbar'
      - l[n=151]: By der helleschen schar,
    - lg:
      - l[n=152]: Dat du my gudes so vele willest geuen,
      - l[n=153]: Dat ik moge herliken leuen,
    - lg:
      - l[n=154]: Vnde maken my to eynem heren,
      - l[n=155]: So dat me my beyde ere.
    - lg:
      - l[n=156]: 'SATANAS SPRAK: Twiuel nicht en har,'
      - l[n=157]: 'Wente ik sage dy vorwar:'
    - lg:
      - l[n=158]: Wes du begheret eyne,
      - l[n=159]: Des scaltu hebben twene.
    - pb[type=manuscript,n=146v]
    - lg:
      - l[n=160]:
        - Ik wil dat waghen wol,
      - l[n=161]: Dat me dy vrochten sol.
    - lg:
      - l[n=162]: '(T)HEOPHILE SPRAK: Ik wil id alle (waghen).'
      - l[n=163]: Ik mot doch alle daghe
    - lg:
      - l[n=164]: Ewichliken syn vorloren,
      - l[n=165]: Ik were beter vngheboren.
    - lg:
      - l[n=166]: Nu reke my eyn blakhorne,
    - lg:
      - l[n=167]: Vederen vnde parmynt.
      - l[n=168]: 'SATANAS SPRAK: Id is my bereit also (eyn) wint.'
    - lg:
      - l[n=169]: 'THEOPHILE SPRAK: Ik wil scriuen eyn karat [= tractat],'
      - l[n=170]: Dat myn zele nummer werdde [= werde] rat.
    - lg:
      - l[n=171]: 'SATANAS SPRAK: Er du scriuen begunnest,'
      - l[n=172]: So do, dat du meynscop wynnest
    - lg:
      - l[n=173]: My(n) vnde alle myner ghesellen,
      - l[n=174]: De dar woldich syn in der helle.
    - lg:
      - l[n=175]: Godes schaltu vorseken [= vorsaken] gar
      - l[n=176]: Vnde syner moder, de one gebar.
    - lg:
      - l[n=177]: Se is so kreftich vnde gud,
      - l[n=178]: Dat ik or nicht nomen mot.
    - lg:
      - l[n=179]: Du scalt vorsaken aller dingk,
      - l[n=180]: De myt Gode an dem hymmel synt.
    - lg:
      - l[n=181]: Du scal vorsaken hute
      - l[n=182]: Aller guden lute,
    - pb[type=manuscript,n=147r]
    - lg:
      - l[n=183]:
        - De hir up erden syn,
      - l[n=184]: Sunnen, man, der sterne schin.
    - lg:
      - l[n=185]:
        - Vorsake ok aller dyngk,
        - '{De myt Gode an dem hemel synt}'
      - l[n=186]: Vnde [=  Deme] in der kerken sincht,
    - lg:
      - l[n=187]: 'Spreken, dencken vnde lesen:'
      - l[n=188]: Alle dyn dancke scal to my wesen.
    - lg:
      - l[n=189]: Du scholt neyn cruce vor dy legen,
      - l[n=190]: Also gude lude plegen.
    - lg:
      - l[n=191]: Dyn tunge scal stille lighen,
      - l[n=192]: An Godes denste sik nicht wegen.
    - lg:
      - l[n=193]: Vorbut ok dynen oren,
      - l[n=194]: Dat se Godes denst nicht horen.
    - lg:
      - l[n=195]: Kerken gan scaltu vormyden,
      - l[n=196]: Neyne almissen scaltu snyden,
    - lg:
      - l[n=197]: 'Du engeuest se dorch myne ere:'
      - l[n=198]: Ik dy des nicht vorkere.
    - lg:
      - l[n=199]: Wultu dat aneganghen,
      - l[n=200]: So wil ik dy to denste enfangen.
    - lg:
      - l[n=201]: '(T)HEOPHILE SPRAK: Du heft my sware rede vor gesaghet,'
      - l[n=202]: Alseme io den mistroteren [= mistrosteten] pleget [= plaget?].
    - lg:
      - l[n=203]: Id is mi nu misse ghevallen,
      - l[n=204]:
        - Doch wil ik vorsaken alle
    - pb[type=manuscript,n=147v]
    - lg:
      - l[n=205]: An himmel vnde an erden,
      - l[n=206]: Vp dat ik rike moge werden.
    - lg:
      - l[n=207]: Doch wil ik sunder leyden
      - l[n=208]: 'Eyne darut bescheyden:'
    - lg:
      - l[n=209]: 'De is gheheten Maria:'
      - l[n=210]: Der wil ik nicht afstan.
    - lg:
      - l[n=211]: De mach myne zele wol vlien,
      - l[n=212]: Der wil ik nicht vortigen.
    - lg:
      - l[n=213]: '(S)ATANAS SPRAK: O wy, dat sote wort,'
      - l[n=214]: Dat hebbe ik van dy vnsachte hort!
    - lg:
      - l[n=215]: Swich du io des wordes me,
      - l[n=216]: Ed bernet my vnde deit my we.
    - lg:
      - l[n=217]: Wultu my werden vnderdan,
      - l[n=218]: Godes moder scaltu afstan.
    - lg:
      - l[n=219]: Se is so gud vnde reyne,
      - l[n=220]: Beheldestu se alleyne,
    - lg:
      - l[n=221]: 'We enmochten dy nicht scaden:'
      - l[n=222]: Se brochte dy wol to gnade(n).
    - lg:
      - l[n=223]: 'THEOPHILE SPRAK: So mot ek or vorsaken,'
      - l[n=224]: Vp dat du my willest rike maken.
    - lg:
      - l[n=225]: Id is my ok twar alleyn [= all eyn?]!
      - l[n=226]: Dyn wille scal an my scheyn.
    - pb[type=manuscript,n=148r]
    - lg:
      - l[n=227]:
        - 'SATANAS SPRAK: Du sprek(est) also eyn here.'
      - l[n=228]: Ik ensculdeghe dy nu nicht mere.
    - lg:
      - l[n=229]: Nu scaltu don wat ik dy hete.
    - lg:
      - l[n=230]: 'THEOPHILE SPRAK: Dar to so byn ik gar bereit,'
      - l[n=231]: Dat sage ik dy up myn truwicheit.
    - lg:
      - l[n=232]: 'SATANAS SPRAK: Dat ga to scaden edder to lucke,'
      - l[n=233]: So tret dre vote achter rucke,
    - lg:
      - l[n=234]: 'Sperk [= Sprek]: Ek vorsake Godes gar,'
      - l[n=235]: Vnde siner moder, de on gebar.
    - lg:
      - l[n=236]: (THEOPHILE SPRAK:) Ik haue eyne(n) bref gescreuen
      - l[n=237]: Ouer myn lif, zele vnde leuen.
    - lg:
      - l[n=238]: Solk grimmelik bref wart ye [= ne],
      - l[n=239]: My gruwet, wen ik on seyn [= sey].
    - lg:
      - l[n=240]: 'Dusse bref dudet wol:'
      - l[n=241]: Lif vnde zele des duuels wesen sol.
    - lg:
      - l[n=242]: 'SATANAS SPRAK: Do her den bref, leue vrunt.'
      - l[n=243]: Ik vore on in de hellegrunt,
    - lg:
      - l[n=244]: Vnde antwor(de) on mynem meyster Lucifere,
      - l[n=245]: De is myn ouerste here.
    - lg:
      - l[n=246]: HE NAM DEN BREF TO HANT,
      - l[n=247]: 'DO SPRAK HE: Ik haue eyn gud pant'
    - lg:
      - l[n=248]: Vnde wil one voren enwech,
      - l[n=249]: Beide ouer bruge vnde ouer stech,
    - lg:
      - l[n=250]: Dat he on holde an den dach,
      - l[n=251]:
        - Dat he vns nutte werden mach.
    - pb[type=manuscript,n=148v]
    - lg:
      - l[n=252]: '(S)ATANAS SPRAK: Ik bringe dy'
      - l[n=253]: Schone cleder, des loue my,
    - lg:
      - l[n=254]: Suluer clar vnde golt;
      - l[n=255]: Schone cleder du dragen scholt,
    - lg:
      - l[n=256]: Samit vnde baldekin
      - l[n=257]: Scal myt suluer dorslagen syn.
    - lg:
      - l[n=258]: Dit is eyn stucke suluer fyn;
      - l[n=259]: Dat hebbe to des [= der] koste dyn.
    - lg:
      - l[n=260]: De besten spise scaltu eten,
      - l[n=261]: Dines leydes scaltu vorgheten.
    - lg:
      - l[n=262]: Dit synt edele stene;
      - l[n=263]: De gyf den vrowen reyde [= reyne],
    - lg:
      - l[n=264]: Dat se dyner winnen kunne [= kunde],
      - l[n=265]: Vnde kesen dy to vrunde.
    - lg:
      - l[n=266]: (D)O SPRAK THEOPHILUS
      - l[n=267]: 'ROMICHLIKEN ALSUS:'
    - lg:
      - l[n=268]: Nu wil ik gar in vraude varen,
      - l[n=269]: Myn lif wil ik bewaren.
    - lg:
      - l[n=270]: Ik wil myk vraude wynnen,
      - l[n=271]: De sorge mot van hinnen.
    - lg:
      - l[n=272]: 'Ik sage dat vorwar:'
      - l[n=273]: Ik han ghesorget mennich jar.
    - pb[type=manuscript,n=149r]
    - lg:
      - l[n=274]:
        - He mote nu myner walden,
      - l[n=275]: An vroden wil ik alden;
    - lg:
      - l[n=276]: Alle, deit [= dat?] id lif vordeyt,
    - lg:
      - l[n=277]: Des mot de zele vurgelden.
      - l[n=278]: De duuel wil myner welden,
    - lg:
      - l[n=279]: Nu late de zele sorgen
      - l[n=280]: Den auent vnde den morgen.
    - lg:
      - l[n=281]: Wy riden in dem lande
      - l[n=282]: Ghecledet myt schonem wande,
    - lg:
      - l[n=283]: De zele steit to pande.
      - l[n=284]: 'Dat is eyn iamerlik elende:'
    - lg:
      - l[n=285]: Dat lif wil in vrauden leuen,
      - l[n=286]: Des mot de zele beuen.
    - lg:
      - l[n=287]: Neynen rad kan ik or gheuen,
      - l[n=288]: De zele mot ewichliken even [= euen]
    - lg:
      - l[n=289]: '{Vnde} in der hellegrunt sweuen.'
    - lg:
      - l[n=290]: '(S)ATANAS SPRAK: Alsus scaltu jummer bliuen:'
      - l[n=291]: Du macht alle dyn lust driuen,
    - lg:
      - l[n=292]: Du macht noch lange leuen,
      - l[n=293]: Ik wil di gudes ennoch gheuen.
    - lg:
      - l[n=294]: DO SPRAK THEOPHILUS
      - l[n=295]: 'JAMERLIKEN ALSUS:'
    - lg:
      - l[n=296]: Me spreket, dat de zele si cleyne -
      - l[n=297]: Des mot ek scrien vnde weynen -
    - lg:
      - l[n=298]: Vnde dat se si van clener nature,
      - l[n=299]:
        - Des is my de vroude dure.
    - pb[type=manuscript,n=149v]
    - lg:
      - l[n=300]: Ik wil id euenture truren [= ruren?],
      - l[n=301]: Vnde wil se om wol duren.
    - lg:
      - l[n=302]: De wile dat ik byn by dy,
      - l[n=303]: Wil ik wol gheholden my,
    - lg:
      - l[n=304]: De wile dat ek leue.
      - l[n=305]: Wente ik sterue, so mot de zele beuen,
    - lg:
      - l[n=306]: O wy, in der leyden stunde,
      - l[n=307]: Wente se senket se in de afgrunde,
    - lg:
      - l[n=308]: Dar se nummer mach ut rouuen [= rauuen?],
      - l[n=309]: Noch Godes antlate beschauwen.
  - chapter[n=2]:
    - head:
      - (D)USSE NABESCREUEN PREDEGHE
      - HORDE THEOPHILUS.
    - head[lg=lat-Latn]:
      - 'TEMA PREDICATORIS: VIDIT JHESUS HOMINEM'
      - SEDENTEM IN THEOLONIE [= THELONIO].
    - lg:
      - l[n=310]: God vorlene vns alle syne synne,
      - l[n=311]: Vnde geuen vns syne gotliken mynne,
    - lg:
      - l[n=312]: Vrede vnde syne gnade to reden,
      - l[n=313]: Dat ed anname(n) mote wesen.
    - lg:
      - l[n=314]: Ik han eyn wort to latine gelesen,
      - l[n=315]: Dat weit vil mennich gud cristen,
    - lg:
      - l[n=316]: Dat bescriuet vns de ewangelisten.
      - l[n=317]: Dat wil ik na beduden
    - lg:
      - l[n=318]: Vor allen cristenluden.
    - pb[type=manuscript,n=150r]
    - lg:
      - l[n=319]:
        - Ere wy de rede begynnen,
      - l[n=320]: So grote wi erst de koninghinne
    - lg:
      - l[n=321]: Myt eynem "Pater noster" vorwar,
      - l[n=322]: Vnde myt eynem "Aue Maria" clar,
    - lg:
      - l[n=323]: Dat se my vorlyge to redenne eyn clene,
      - l[n=324]: Dat wy getrostet werdden [= werden] algemeyne,
    - lg:
      - l[n=325]: Vnde God, Godes sone,
      - l[n=326]: Ghelouet werde an synem trone.
    - lg:
      - l[n=327]: DAT SCHACH TO HANT DAR NA,
      - l[n=328]: EYN ISLIK SPREKE EYN "AUE MARIA".
    - lg:
      - l[n=329]: '(S)unte Matheus sprak also:'
      - l[n=330]: 'Dat steit bescreuen in ewangelio:'
    - lg:
      - l[n=331]: Vidit Jhesus hominem sedentem in theolonie [= thelonio].
      - l[n=332]: Dat sprak Jhesus vnse here
    - lg:
      - l[n=333]: Vnde sach sitten eynen tolnere
      - l[n=334]: An sinem tollen openbar -
    - lg:
      - l[n=335]: Dat was ome alto swar -
      - l[n=336]: 'He sprak: Volge my du!'
    - lg:
      - l[n=337]: Alsus, salghe minsche, su!
      - l[n=338]: He volgede ome to hant,
    - lg:
      - l[n=339]: Vnde [= Ihesus?] sande on in alle lant.
      - l[n=340]: Erst was he eyn tolnere,
    - lg:
      - l[n=341]: Nu is he eyn apostel vnde eyn predeghere.
      - l[n=342]:
        - He was eyn sunder openbar,
    - pb[type=manuscript,n=150v]
    - lg:
      - l[n=343]: Nu gheit he in Cristus scar.
      - l[n=344]: Erst was om rech(te) vnde vnrechte like,
    - lg:
      - l[n=345]: Nu leret he den wech to dem himmelrike.
      - l[n=346]: Eya, wes sundighestu dik [= dicke]?
    - lg:
      - l[n=347]: Nu heftu di to sunden vorplicht.
      - l[n=348]: Kere weder vnde twiuel nicht.
    - lg:
      - l[n=349]: We willen di lefliken entfan,
      - l[n=350]: So du nu hebbest (wedder) vns ghedan.
    - lg:
      - l[n=351]: Mark an Marien Magdalenen,
      - l[n=352]: Wo se to gnaden queme.
    - lg:
      - l[n=353]: Se was to mennigen stunden
      - l[n=354]: Myt seuen duuelen bebunden.
    - lg:
      - l[n=355]: Tohant do se gnade san,
      - l[n=356]: Godes torne se gans vorwan.
    - lg:
      - l[n=357]: Loue, sunder, an koning Dauid,
      - l[n=358]: De lach an sunden menche tijd;
    - lg:
      - l[n=359]: Do he gnade begerende was,
      - l[n=360]: God halp om, dat he genas.
    - lg:
      - l[n=361]: Wy lesen an sunte Peters boke,
      - l[n=362]: Wo ho Godes drie vorsoke.
    - lg:
      - l[n=363]: He swor by duren worden,
      - l[n=364]: 'So gy in dusser passien mogen horen:'
    - pb[type=manuscript,n=151r]
    - lg:
      - l[n=365]:
        - Summe dat werde hilghe licht,
      - l[n=366]: Ik bekenne Godes namen nicht.
    - lg:
      - l[n=367]: An der suluen stunde
      - l[n=368]: He bewenede syne sunde.
    - lg:
      - l[n=369]: Ome wart so vele gaade [= gnade] bereit,
      - l[n=370]: Dat he is eyn vorste der apostelheit.
    - lg:
      - l[n=371]: Merke, sunder, Godes mildicheit,
      - l[n=372]: Wo grot dat se is vnde breit.
    - lg:
      - l[n=373]: Twiuel nicht also eyn har.
      - l[n=374]: Got nympt diner alle tijd war,
    - lg:
      - l[n=375]: Wor du in der werlde varest,
      - l[n=376]: Vp dat du van sunden latest.
    - lg:
      - l[n=377]: O wy, du twiuelere,
      - l[n=378]: Du bist doch gans vnmere.
    - lg:
      - l[n=379]: Wan du twiuelst an Jhesum Crist,
      - l[n=380]: So bistu argher, wen de duuel ist.
    - lg:
      - l[n=381]: Du bist myt senden oghen blint,
      - l[n=382]: Dat du nicht louest an Marien kint,
    - lg:
      - l[n=383]: De di heft bitterliken erlost,
      - l[n=384]: De is din leuent vnde dyn trost.
    - lg:
      - l[n=385]: Du bist ghescreuen an sine vote
      - l[n=386]: Mit eynem griffel vnsote.
    - pb[type=manuscript,n=151v]
    - lg:
      - l[n=387]:
        - Du bist ok alle tijd an sinen henden,
      - l[n=388]: He hef dy gelost van des duuels benden.
    - lg:
      - l[n=389]: Du bist ghescreuen an syn herte,
      - l[n=390]: He leit dorch dy grote smerte
    - lg:
      - l[n=391]: Vtwendich vnde inwendich vnde nicht stille.
      - l[n=392]: Sunder, dat leit he dorch dinen willen!
    - lg:
      - l[n=393]: Eftu nu gnade to ome sokest,
      - l[n=394]: Vnde syn bod rokest,
    - lg:
      - l[n=395]: He enwel diner nicht vortigen.
      - l[n=396]: Des bidde wy alle Marien,
    - lg:
      - l[n=397]: Dat se alle werden vntbunden
      - l[n=398]: Van oren groten houetsunden,
      - l[n=399]: De an sinem denste werden vunden.
    - lg:
      - l[n=400]: Alle, de nu Godes wort
      - l[n=401]: Myt innicheit hebben gehort,
    - lg:
      - l[n=402]: 'De scullen aflates so vele hauen:'
      - l[n=403]: Eft se hedden gewesen to dem hilgen graue
    - lg:
      - l[n=404]: Ouer meres, syt bericht,
      - l[n=405]: Ome [= On] enworde so vele aflates nicht.
    - lg:
      - l[n=406]: Hirvmme, leuen salighen lude,
      - l[n=407]: Nu dancket Gode hude
    - pb[type=manuscript,n=152r]
    - lg:
      - l[n=408]:
        - Vnde [= Vmme] alle synen gnaden,
      - l[n=409]: De he hir heft ghedan.
    - lg:
      - l[n=410]: Gif [= Gy] salighe man vnde vif [= wif],
      - l[n=411]: Iwe zele vnde jwe lif
    - lg:
      - l[n=412]: Bevele ek hute vnsem heren
      - l[n=413]: Vnde Marien nu vnde jummer mere.
    - lg:
      - l[n=414]: (D)O SPRAK THEOPHILUS
      - l[n=415]: 'JAMERLIKEN ALSUS:'
    - lg:
      - l[n=416]: O we, ik vil kloker man;
      - l[n=417]: Myne oghen latet my bister gan,
    - lg:
      - l[n=418]: Dat ik bin sus sere ghedouet,
    - lg:
      - l[n=419]: 'Dat ik bin so dum:'
      - l[n=420]: Des is my myn munt worden stum.
    - lg:
      - l[n=421]: Ik bin also eyn gok.
      - l[n=422]: Myne oren synt my worden dof,
    - lg:
      - l[n=423]: Des wil ik my lange doren,
      - l[n=424]: Dat ik nicht kan Godes wort horen.
    - lg:
      - l[n=425]: 'Ik han vorsellet eynen kop:'
      - l[n=426]: Ik han dat lange leuent
    - lg:
      - l[n=427]: Gar vmme eyn kort gegheuen;
      - l[n=428]: Des mot ik sin vorloren
    - lg:
      - l[n=429]: Vnde de zele io tovoren,
      - l[n=430]: Id were beter, dat ik nicht were boren.
    - pb[type=manuscript,n=152v]
    - lg:
      - l[n=431]:
        - O wy, wat scal ik vil armen,
      - l[n=432]: We wil sik ouer my vorbarmen?
    - lg:
      - l[n=433]: To weme mach ik wiken?
      - l[n=434]: Ik han God van himelrike
    - lg:
      - l[n=435]: Vnde alle sine hilgen vorsworen.
      - l[n=436]: Ik were beter vngheboren!
    - lg:
      - l[n=437]: 'Ik han my to spade bedacht:'
      - l[n=438]: Ik mot sorgen dach vnde nacht.
    - lg:
      - l[n=439]: Ik wil doch wederkeren
      - l[n=440]: To eyner vrowen heren,
    - lg:
      - l[n=441]: De is gheheten Maria.
    - lg:
      - l[n=442]: To der scal my gnade werden
      - l[n=443]: 'Vp dusser jamerliken erden:'
    - lg:
      - l[n=444]: To der scal my werden gnaden,
      - l[n=445]: To or wil ek iu spaden [= my spoden?].
    - lg:
      - l[n=446]: Dat scal vorweruen de maget gut,
      - l[n=447]: Se is aller gnade eyn ouervlot.
    - lg:
      - l[n=448]: '(T)HEOPHILE SPRAK: Ik grote dy, Maria, du edele vad,'
      - l[n=449]: Du bist aller sunde(r) eyn tovorlat.
    - lg:
      - l[n=450]: Du bist aller salden eyn scrin,
      - l[n=451]: Vt dek, edele keyseryn,
    - pb[type=manuscript,n=153r]
    - lg:
      - l[n=452]:
        - Nu vnde jummer gnade vlot.
      - l[n=453]: God gaf sik in dynen schot
    - lg:
      - l[n=454]: Vnde kos dy to eyner trutinnen,
      - l[n=455]: Dat du scoldest gnade winnen.
    - lg:
      - l[n=456]: Den armen sundern to vromen,
      - l[n=457]: De vte dem wege sint ghekomen.
    - lg:
      - l[n=458]: Du bist eyn edele leydesterne
      - l[n=459]: Buten dem wege verne.
    - lg:
      - l[n=460]: 'Help my weder in den wech:'
      - l[n=461]: Wente du bist beide bruge vnde stech.
    - lg:
      - l[n=462]: Alle de to dy komen,
      - l[n=463]: De werden dem duuel ghenomen.
    - lg:
      - l[n=464]: '(T)HEOPHOLE SPRAK: Vro were [= Vrowe], ik han sere misse ghedan,'
      - l[n=465]: Ik dor myn oghen nicht upslan
    - lg:
      - l[n=466]: To dem almechtigen Gode,
      - l[n=467]: Du enwillest syn myn bode
    - lg:
      - l[n=468]: Vnde eyn hulperinne.
      - l[n=469]: Help my, dat ik gnade wynne
    - lg:
      - l[n=470]: Myt dinem saligen bede,
      - l[n=471]: Dar is my hulpen mede.
    - lg:
      - l[n=472]: Vrowe, sprek din salige wort,
      - l[n=473]: Dat is vor alle dingk gehort.
    - pb[type=manuscript,n=153v]
    - lg:
      - l[n=474]:
        - Wente dyn kint Jhesus Crist
      - l[n=475]: Wil dy twiden, wes du biddende bist.
    - lg:
      - l[n=476]: "(M)ARIA SPRAK: Theophile, dyn venne['= 'wenen]"
      - l[n=477]: Kan dy gar luttich renne [= renen].
    - lg:
      - l[n=478]: Du heft ghelegen dre daghe
      - l[n=479]: An wenende vnde an groter clage.
    - lg:
      - l[n=480]: Ek han des nicht vornomen,
      - l[n=481]: Dat dy iemant sy to hulpe komen.
    - lg:
      - l[n=482]: We scal vnde we mach dyn hulper syn?
      - l[n=483]: 'THEOPHILE SPRAK: Dat scaltu, vil leue keyserin.'
    - lg:
      - l[n=484]: 'MARIA SPRAK: Wes scol ek siner [= diner] plegen?'
      - l[n=485]: Jo hastu myner vorteghen,
    - lg:
      - l[n=486]: Myner vnde mynes kindes
      - l[n=487]: Vnde alles himelschen ghesindes
    - lg:
      - l[n=488]: An himel vnde an erden.
      - l[n=489]: Dyn hulp kan ek nicht werden.
    - lg:
      - l[n=490]: Wolde iemant dy to hulpe komen,
      - l[n=491]: Ik wolde dy gherne darto vromen.
    - lg:
      - l[n=492]: '(T)HEOPHILE SPRAK: Ach du edele rose van Jericho,'
      - l[n=493]: Wo trostestu my armen also!
    - lg:
      - l[n=494]: Du bist io der gna(den) vul.
      - l[n=495]: 'De engele schone to di sprak: -'
    - pb[type=manuscript,n=154r]
    - lg:
      - l[n=496]:
        - 'Goteliken dat ghescach: -'
      - l[n=497]: Aue gracia plena etc.
    - lg:
      - l[n=498]: Woldestu dorch my alleyne
      - l[n=499]: Vorleysen dynen namen reyne,
    - lg:
      - l[n=500]: Des wolde ek schemen vor dy.
      - l[n=501]: Nu bidde dyn leue kint vor my;
    - lg:
      - l[n=502]: Dat ek vel boses han ghedan,
      - l[n=503]: Des geyt my grote twe [=rwe?] an.
    - lg:
      - l[n=504]: Ik wil gerne don noch dynem willen.
      - l[n=505]: 'MARIA SPRAK: Nu liche stille,'
    - lg:
      - l[n=506]: Ik wil gan to mynem kinde.
      - l[n=507]: Kan ik dy gnade vinden,
    - lg:
      - l[n=508]: Ik wil dyn trvwe bode syn.
      - l[n=509]: 'THEOPHILE SPRAK: Dat do, vil edele keyserin.'
    - lg:
      - l[n=510]: 'MARIA SPRAK: Ek bidde dy, leue kint myn,'
      - l[n=511]: Dat du willest twiden my.
    - lg:
      - l[n=512]: Dar is ghekomen eyn vil arme,
      - l[n=513]: Lat dyne gnade (sin) vorbarmen.
    - lg:
      - l[n=514]: De heft dre daghe leghen,
      - l[n=515]: Dat he nu heft entswegen,
    - lg:
      - l[n=516]: Nicht wen wenen vnde gillen.
      - l[n=517]: Gunne my, dat ik one mote stillen
    - pb[type=manuscript,n=154v]
    - lg:
      - l[n=518]:
        - Vnde lat my delghen syne trene.
      - l[n=519]: Wente ek bin de reyne,
    - lg:
      - l[n=520]: 'Dar de sunder an kre [= scre?]:'
      - l[n=521]: Salue regina misericordie.
    - lg:
      - l[n=522]: Ik hete eyn moder, also ek weit,
      - l[n=523]: Aller barmherticheit
    - lg:
      - l[n=524]: Vul trostes vnde vul gnade,
      - l[n=525]: Des sunders heil, des duuels scade.
    - lg:
      - l[n=526]: Ek bin gheheten morgenrot.
      - l[n=527]: 'Des bidde ek dy dorch dinen dot:'
    - lg:
      - l[n=528]: Ik hete eyn scrin der salden,
      - l[n=529]: Lat my nu syner walden.
    - lg:
      - l[n=530]: Des bidde ek dy, kint vnde here,
      - l[n=531]: Dorch dines sulues ere.
    - lg:
      - l[n=532]: '(M)ARIA SPRAK: Vil leue kint, wes swichtu?'
      - l[n=533]: Antworde diner moder nu.
    - lg:
      - l[n=534]: Dencke, leue kint, do wi vns beide
      - l[n=535]: Van dem ertrike scheiden,
    - lg:
      - l[n=536]: Dat du my do geuest de walt,
      - l[n=537]: He were junk edder alt,
    - lg:
      - l[n=538]: Dat ik mochte vor one dinghen,
      - l[n=539]: Vnde one to gnaden bringen.
    - pb[type=manuscript,n=155r]
    - lg:
      - l[n=540]:
        - Wultu my de gnade benemen,
      - l[n=541]: Dat is my gar vnbequem(e).
    - lg:
      - l[n=542]: Du heft my lef, vnde ek ok dy.
      - l[n=543]: Ik bidde, dat den sunder latest my,
    - lg:
      - l[n=544]: Vnde latest vorgan dyn vngemote.
      - l[n=545]: Ik wil seyn, wu ik vor one bote
    - lg:
      - l[n=546]: Siner groten sunde swere.
      - l[n=547]: 'JHESUS SPRAK: Moder, wes biddestu so sere'
    - lg:
      - l[n=548]: Vor dat stinkende as,
      - l[n=549]: Dar nu reynicheit inne was?
    - lg:
      - l[n=550]: He heft vorsaken diner,
      - l[n=551]: Also heft he ok myner.
    - lg:
      - l[n=552]: Hedde he dyner nicht vorteghen,
      - l[n=553]: Ome hedde dat sin vorgheuen,
    - lg:
      - l[n=554]: Dat he hedde gnade wunnen.
      - l[n=555]: My deden we myne wunden,
    - lg:
      - l[n=556]: Do he myner also vorsok,
      - l[n=557]: Vnde [= Vmme] de vrucht, de he my gedruch.
    - lg:
      - l[n=558]: 'MARIA SPRAK: Sin scrien vor mynen oghen'
      - l[n=559]: Des enkan ek nicht lenger dogen.
    - lg:
      - l[n=560]: 'JHESUS SPRAK: Syn vles stincket vor mynem antlat(e),'
      - l[n=561]: Dat is gar vter mate.
    - pb[type=manuscript,n=155v]
    - lg:
      - l[n=562]:
        - Darvmme sage ik di, moter myn,
      - l[n=563]: Ik wil al vnghebeiden syn.
    - lg:
      - l[n=564]: 'MARIA SPRAK: Vil leue kint,'
      - l[n=565]: Do so soyke ek, wur dine vote synt;
    - lg:
      - l[n=566]: Sint du my nicht twiden w(i)lt,
      - l[n=567]: Dat ek werde eyn vredescilt
    - lg:
      - l[n=568]: Des armen, de dar liget
      - l[n=569]: Vnde grote ruwe pleghet,
    - lg:
      - l[n=570]: Nu mane ik di aller bitterheit,
      - l[n=571]: De ik ju dorch dinen willen leit;
    - lg:
      - l[n=572]: Dencke, kint, dat myn hant
      - l[n=573]: Myt kranken doken dy bewant,
    - lg:
      - l[n=574]: Do du an der krubben legest
      - l[n=575]: Vnde grotes armodes plegest.
    - lg:
      - l[n=576]: Su kind, dut/dat sint de brusten,
      - l[n=577]: De du to dinen lusten
    - lg:
      - l[n=578]: Dicke heft ghesoghen
      - l[n=579]: Vnde lefliken to dem mde [= munde] togen.
    - lg:
      - l[n=580]: Dencke, kint, an mynen willen,
      - l[n=581]: Dat ek di ernerde myt der splllen [= spillen].
    - lg:
      - l[n=582]: Dat was an den stunden,
      - l[n=583]: Dat wi des nicht beteren konden.
    - pb[type=manuscript,n=156r]
    - lg:
      - l[n=584]:
        - Dencke, sone, dat ik vloch mannighen wech,
      - l[n=585]: Beyde ouer bruge vnde ouer stech.
    - lg:
      - l[n=586]: Ik toch vnde vloch hir vnde dar,
      - l[n=587]: In Egiptenlant vnde anders war.
    - lg:
      - l[n=588]: Denk, wat ik leyt an der stunt,
      - l[n=589]: Do dyn herte wart gewunt
    - lg:
      - l[n=590]: Van dem blinden iodenspere grot,
      - l[n=591]: Dat dat blot dorch sine [= dine] siden vlot.
    - lg:
      - l[n=592]: Leue kint, dorch alle de bitterlicheit,
      - l[n=593]: De ek ju dorch dinen willen leit,
    - lg:
      - l[n=594]: Efte ek di do wat gudes dede,
      - l[n=595]: So twide my dusser bede,
    - lg:
      - l[n=596]: Vnde lat my dussen sunder bewaren,
      - l[n=597]: Vnde lat one an mynen hulden varen.
    - lg:
      - l[n=598]: 'JHESUS SPRAK: Maria, leue moder myn,'
      - l[n=599]: Stant vp vnde lat dyn biddent syn.
    - lg:
      - l[n=600]: Ik geue one an dine hant.
      - l[n=601]: Kanstu ome scicken syn pant
    - lg:
      - l[n=602]: Vnde synen suluen bref,
      - l[n=603]: Den he dem duuel scref,
    - pb[type=manuscript,n=156v]
    - lg:
      - l[n=604]:
        - Den he hef ghescreuen,
      - l[n=605]: So late ek one an dynen hulden (leuen),
    - lg:
      - l[n=606]: '(M)ARIA SPRAK: Theophole,'
      - l[n=607]: Du heft dre dage vnde mere
    - lg:
      - l[n=608]: An groten ruwen ghewesen,
      - l[n=609]: Darvmme scaltu wol genesen.
    - lg:
      - l[n=610]: Ik han dy gnade ghewunnen,
      - l[n=611]: Du bist van allen sunden vntbunden.
    - lg:
      - l[n=612]: Du bist ghegeuen an myne hant,
      - l[n=613]: Ik wil dyne sele vnde dyn pant,
    - lg:
      - l[n=614]: Losen myt mynen henden
      - l[n=615]: Van des duuels benden.
    - lg:
      - l[n=616]: '(T)HEOPHILE SPRAK: Ach vrowe, wo wart my de bref,'
      - l[n=617]: De dar is in der helle dep,
    - lg:
      - l[n=618]: Vnde de inghesegel darmede?
      - l[n=619]: So loue ek wol der rede,
    - lg:
      - l[n=620]: Eya entorne dy nicht,
      - l[n=621]: Ik spreke, so id my ghe want is.
    - lg:
      - l[n=622]: Ik sage, so id my is gewand.
      - l[n=623]: Wente id is myn hogeste pand.
    - lg:
      - l[n=624]: 'MARIA SPRAK: Ik bidde di, Satanas,'
      - l[n=625]: Du vnreyne saghe vnde twas,
    - pb[type=manuscript,n=157r]
    - lg:
      - l[n=626]:
        - Dat du komest hir vore
      - l[n=627]: Neden ut der helle dore.
    - lg:
      - l[n=628]: Theophole sint sine sunde vorgeuen,
      - l[n=629]: De scal ewichliken myt my leuen.
    - lg:
      - l[n=630]: 'He is my bevolen to bewaren:'
      - l[n=631]: Du scalt van ome varen
    - lg:
      - l[n=632]: Vnde halen my den bref.
      - l[n=633]: Darvmme ik di to my rep.
    - lg:
      - l[n=634]: '(S)ATANAS SPRAK: Vrowe, des syd bericht:'
      - l[n=635]: Van sinem breue enweyt ik nicht.
    - lg:
      - l[n=636]: He heft syk {my} myk
      - l[n=637]: Also sulues vorplicht
    - lg:
      - l[n=638]: Myt synes sulues breue,
      - l[n=639]: Ome enwerde leyde oder leue,
    - lg:
      - l[n=640]: Neymant vor one beyde,
      - l[n=641]: De vns anders vnrechte deyde.
    - lg:
      - l[n=642]: 'MARIA SPRAK: Ik beyde dy, Satanas,'
      - l[n=643]: Du vnreyne tzaghe [= saghe] vnde twas,
    - lg:
      - l[n=644]: Dat du Theophile loslatest
    - lg:
      - l[n=645]: Solker lofte, he dy hefft gelouet,
      - l[n=646]: Wente he do was vordomet [= vordouet].
    - lg:
      - l[n=647]: Nu is he wedder synnich geworden,
      - l[n=648]: Vnde steit an dem himelschen orden.
    - pb[type=manuscript,n=157v]
    - lg:
      - l[n=649]:
        - 'SATANAS SPRAK: Vrowe, des syt bericht:'
      - l[n=650]: Van synem breue enweit ik nicht.
    - lg:
      - l[n=651]: Ik han sint so vele wunders ghedreuen,
      - l[n=652]: Ik en weit des nicht, wur sin bref is (ghebleuen),
    - lg:
      - l[n=653]: Wur he is vnde wur ik one leyt,
      - l[n=654]: Wente ik dar nicht af enweit.
    - lg:
      - l[n=655]: '(M)aria (SPRAK): vore hen snelle'
      - l[n=656]: In de afgrunt der helle,
    - lg:
      - l[n=657]: Vore de lenghe vp vnde nedder,
      - l[n=658]: Sok my den bref wedder.
    - lg:
      - l[n=659]: 'SATANAS SPRAK: Vrowe, ik sage ju ware:'
      - l[n=660]: Ik han alle de helle dorchvaren
    - lg:
      - l[n=661]: By mynen besten synnen -
      - l[n=662]: Des breues kan ik nicht vinden.
    - lg:
      - l[n=663]: Ik han one ghevraget sere
      - l[n=664]: Mynen heren Lucifere.
    - lg:
      - l[n=665]: De heft allo [= also] ghesaghet,
      - l[n=666]: Des si sint so mennich iar bedaget,
    - lg:
      - l[n=667]: Dat he des breues nicht ensach.
      - l[n=668]:
        - 'Vorwar ik dat spreken mach:'
    - pb[type=manuscript,n=158r]
    - lg:
      - l[n=669]: We enkunnen des breues nicht vinden.
      - l[n=670]: 'MARIA SPRAK: Ik wil di noch binden'
    - lg:
      - l[n=671]: Mit myner tucht vnde ghewalt,
      - l[n=672]: Dat du den bref wol vinden scalt.
    - lg:
      - l[n=673]: Ik beyde dy by mynem namen
      - l[n=674]: Vnde bi rechtem horsame,
    - lg:
      - l[n=675]: Dat du varest an dusser stunt
      - l[n=676]: In de helle grunt,
    - lg:
      - l[n=677]: Vnde bringhest my den bref,
      - l[n=678]: Den Theophile screff.
    - lg:
      - l[n=679]: He lit Lucifere vnder sinem jucke [= rucke];
      - l[n=680]: 'Sprek: Ik enbeyde om, dat he sik bucke,'
    - lg:
      - l[n=681]: Dat du den bref mogest vinden.
      - l[n=682]: 'SATANAS SPRAK: Vil edele telerinne,'
    - lg:
      - l[n=683]: Gif my en wenich vrist -
      - l[n=684]: Ik weit wol wur de bref is -
    - lg:
      - l[n=685]: Vnde lat van my dyn twingen.
      - l[n=686]: Ik wil one wedder bringhen.
    - lg:
      - l[n=687]: '(S)ATANAS SPRAK: Here Lucifere, gif my rad:'
      - l[n=688]: Vnse walt nu cleyne macht had,
    - pb[type=manuscript,n=158v]
    - lg:
      - l[n=689]:
        - Nu Goddes moder is ghekomen,
      - l[n=690]: Vnde hef vns Theophilum ghenomen,
    - lg:
      - l[n=691]: De den bref hadde ghescreuen,
      - l[n=692]: Den ik dy hadde ghegheuen,
    - lg:
      - l[n=693]: De vnder di lit begrauen,
      - l[n=694]: Den wil se weder hauen.
    - lg:
      - l[n=695]: Se is vrowe vnde wi sint knechte,
      - l[n=696]: We enmoghen nicht weder se vechten.
    - lg:
      - l[n=697]: So wi ere van or komen,
      - l[n=698]: Jo beter is vnse vromen.
    - lg:
      - l[n=699]: '(S)ATANAS SPRAK: Vrowe, ik kan juwer nicht leng sparen,'
      - l[n=700]: Nemet den bref bi juwen waren.
    - lg:
      - l[n=701]: Se syn legen edder papen,
      - l[n=702]: Se endoruen vns nicht mer affen.
    - lg:
      - l[n=703]: Sint vns dusse is ghenomen,
      - l[n=704]: So enderf vns nema(n)t tokomen.
    - lg:
      - l[n=705]: Kumpt vns gemant mere,
      - l[n=706]: Ik wil one vneren also sere,
    - lg:
      - l[n=707]: Dat ome scal werden eyn biiacht,
      - l[n=708]: Dat he sine nese wol huden mach.
    - lg:
      - l[n=709]: '(M)ARIA SPRAK: Nu scal [= sclap], Theophile,'
      - l[n=710]:
        - De heft [= Du hest] dre dage vnde mere
    - pb[type=manuscript,n=159r]
    - lg:
      - l[n=711]: An grotem twenge wesen.
      - l[n=712]: Du bist aller sorge genesen,
    - lg:
      - l[n=713]: Darvmme bistu wol genesen.
  - chapter[n=3]:
    - head:
      - '(SO SINGET THEOPHOLE:'
    - head[lg=lat-Latn]: ALMA MATER DEIPARA.)
    - lg:
      - l[n=714]: 'MARIA SPRAK: Theophile, ik wil di ricken'
      - l[n=715]: 'Vnde wil di nicht vorstricken:'
    - lg:
      - l[n=716]: Ik leyde den bref vp din herte;
      - l[n=717]: Vordelget sin alle dine smerte
    - lg:
      - l[n=718]: Mit sunderliken saken.
      - l[n=719]: Wen du nu werst vntwaken,
    - lg:
      - l[n=720]: So dancke minem kinde
      - l[n=721]: Vnde allem himmelschen gesinde,
    - lg:
      - l[n=722]: Dat di gnade is gegeuen.
      - l[n=723]: Werf vmme eyn ewich leuent.
    - lg:
      - l[n=724]: 'THEOPHILE SPRAK IN KORTER VRIST:'
      - l[n=725]: Ik loue an dinen sonen, den hilligen god [= Crist].
    - lg:
      - l[n=726]: Vnde wil one nummer mer untdugen [= untdingen];
      - l[n=727]: (Noch) de soyten juncfrowen maget Marien,
    - lg:
      - l[n=728]: De my gnade wunnen hat;
      - l[n=729]: Dat alle, grot vnde s(t)at,
    - lg:
      - l[n=730]: Konden spreken, dwingen vnde heten,
      - l[n=731]: So [= Se] konden se mit loue nummer mer boten,
    - lg:
      - l[n=732]: So [= Se] en konden se nummer wul louen,
      - l[n=733]:
        - Se sin alles loues enbouen.
    - pb[type=manuscript,n=159v]
    - lg:
      - l[n=734]: Louet se, vrowen vnde man,
      - l[n=735]: Alle vnse trost lid daran.
    - lg:
      - l[n=736]: Se is aller gnade {wul} (eyn vul schryn)
      - l[n=737]: Dat is an mi worden schyn.
    - lg:
      - l[n=738]: Ik hadde my vor redet solker mere
      - l[n=739]: Dat ik iummer mere
    - lg:
      - l[n=740]: Scholde des duuels sin gewesen.
      - l[n=741]: Se halp my, dat ik bin genesen.
    - lg:
      - l[n=742]: Ik wil ok alle tijd na orem loue ringen
      - l[n=743]: Mit lesen vnde mit singen,
    - lg:
      - l[n=744]: Vnde wil or nummer mer vortigen
      - l[n=745]: Der soyten iuncfrowen maget Marien.
    - lg:
      - l[n=746]: Et sic est finis.
    - lg:
      - l[n=747]: Ach wat was ik vro,
      - l[n=748]: Do ik sach finito libro.
