    - l[n=708]: was al daz werch befangin,
    - l[n=709]: unde dâ zû morter unde blî,
    - l[n=710]: wie mehte siu vester sîn.
    - l[n=711]: drî wâren der mûre,
    - l[n=712]: umbe waz solte si daz gût vertûrem
    - l[n=713]: 'daz golt sie ne hâlen:'
    - l[n=714]: sie thâten die turne mâlen,
    - l[n=715]: daz daz rôthe golt dar ab schein
    - l[n=716]: gemûseth oben an den stein.
    - l[n=717]: dan zwiscen gingen de bogen,
    - l[n=718]: si wâren al mit golde bezogen.
    - l[n=719]: die turne stunden vil nâch,
    - l[n=720]: wît was der hof dâ.
    - l[n=721]: vil grôz scade daz was,
    - l[n=722]: das si Alexander zebrach
    - l[n=723]: durch sîn ubermûtecheit.
    - l[n=724]: siu was einer mîle breit.
    - l[n=725]: er ne waiz in anders neheine scult,
    - l[n=726]: 'niewan si wâren einem chunige holt:'
    - l[n=727]: daz was Darios rex Persarum,
    - l[n=728]: deme sie undertân wâren.
    - l[n=729]: 'Nû vernement ouch ein ander:'
    - l[n=730]: zû zin sante Alexander
    - l[n=731]: unt sprach, ob si in ze chunige wolten entfân
    - l[n=732]: unde ime wesen undertân
    - l[n=733]: unde die burch gâben in sîne gewalt.
    - l[n=734]: dâ saz inne vil manec helt,
    - l[n=735]: die alle wider zim santen,
    - l[n=736]: wande si sîn niewiht bechanden.
    - l[n=737]: sie sprâchen, daz sie in niene forhten,
    - l[n=738]: noch si sîn ze niehte bedorften,
    - l[n=739]: wan sie trûgen ime willigen mût
    - l[n=740]: unde gâben ime gerne durch minne ir gût.
    - l[n=741]: unt alsô dise boten wider chômen,
    - l[n=742]: 'vernement, wie in Alexander vernâmi:'
    - l[n=743]: mit zorn er der nider saz;
    - l[n=744]: bî sînem hals er sich vermaz;
    - l[n=745]: er sprach, ez en solte sîn porlanch
    - l[n=746]: er wolte si hân âne ir allir danch.
    - l[n=747]: Dô nam er sîner fursten drî -
    - l[n=748]: ouch ne waiz ich, wie ir name sî -
    - l[n=749]: unt sante si dar widere in die stat
    - l[n=750]: 'unde hiez den altsten sagen daz:'
    - l[n=751]: war sie ir sin thâdin,
    - l[n=752]: daz si den chunich fersmâten,
    - l[n=753]: der Rôme mit sîner crapht
    - l[n=754]: unt al Chrîchen under sich hiete brâht.
    - l[n=755]: unt alsô die boten fur chômen
    - l[n=756]: unt die burgâre ir rede vernâmen,
    - l[n=757]: si thâden stolzen liuten gelîch
    - l[n=758]: unde hingen sie alle ûf ein zwîch.
    - l[n=759]: Nû beviench Alexander die burch mit here
    - l[n=760]: mit den scephen in dem mere.
    - l[n=761]: mit sturme er sie starche dwanc,
    - l[n=762]: er drûg in ubelen gedanc.
    - l[n=763]: si werten sich vone prîse wole.
    - l[n=764]: der werlte ne was nehein zal,
    - l[n=765]: der in der burch was
    - l[n=766]: zwainzech thûsent unde baz.
    - l[n=767]: alsô vil sclûgen si ime sînes hers,
    - l[n=768]: daz die unde des mers
    - l[n=769]: von dem plûte wurden rôt.
    - l[n=770]: der wint tet in vil nôt,
    - l[n=771]: daz sîner scephe ein hundert versunchen
    - l[n=772]: unt sîne helde all ertrunchen.
    - l[n=773]: dô Alexander daz gesach,
    - l[n=774]: daz ir alsô vil thôt lach,
    - l[n=775]: des sturmes hiez er abe stân,
    - l[n=776]: er thete die sceph wider in die habe gân.
    - l[n=777]: Alexander bedâhte sich
    - l[n=778]: des schaden ummâzlîch.
    - l[n=779]: er was ein listich man,
    - l[n=780]: grôze poum er gewan
    - l[n=781]: unde thede die zesamene spannen
    - l[n=782]: von chundigen zimbermannin
    - l[n=783]: unde hiez daz mit steinen vullen.
    - l[n=784]: 'daz was an sînem willen:'
    - l[n=785]: swane er sîn ebenhôch zem turne brâhte,
    - l[n=786]: daz er lange poume darabe rihti,
    - l[n=787]: die der zû den zinnen mahten gân.
    - l[n=788]: er wolte sie mit nîde bestân.
    - l[n=789]: Einluph tûsint santer sînes hers
    - l[n=790]: nâch den poumen uber mer
    - l[n=791]: unde hiez die poume vellen,
    - l[n=792]: er wolte perfrit stellen,
    - l[n=793]: ûf einen perc, heizet Libanus,
    - l[n=794]: dâ stêt ûf manch cêdrus.
    - l[n=795]: diz ist Libanus der in Arabien stêt,
    - l[n=796]: dâ der Jordan ûz gêt.
    - l[n=797]: diz ist noch der selbe walt,
    - l[n=798]: den der chunich Salemon galt
    - l[n=799]: wider einen chunich, der hiez Hiram.
    - l[n=800]: er gab ime halb Galileam,
    - l[n=801]: wande im die poume wol gevielen
    - l[n=802]: ze zimber unde ze chielen.
    - l[n=803]: si nerfûlent ouch niemer mê
    - l[n=804]: weder durh regen noch durch snê.
    - l[n=805]: Nû de Arabati alsô daz befunden,
    - l[n=806]: die Tyrin wole gûtes gunden,
    - l[n=807]: 'newiht langer si nenthwalten:'
    - l[n=808]: die den forst valten,
    - l[n=809]: si nâmen ein ungezogenlîch phant
    - l[n=810]: unt erslûgen ein tûsint.
    - l[n=811]: dô Alexander daz vernam,
    - l[n=812]: vier tûsent er nam
    - l[n=813]: des hers, daz er noch dô habete.
    - l[n=814]: ein herzoge hiez sich Gracto
    - l[n=815]: unde ein ander der was Perdix genant,
    - l[n=816]: den bevalch erz gesez in die hant
    - l[n=817]: unde fûr dô selbe ûz
    - l[n=818]: ze dem berge Libanus,
    - l[n=819]: unde bewarte sîne holden,
    - l[n=820]: die dâ zimberin solten,
    - l[n=821]: biz iz alliz gereite wart.
    - l[n=822]: dô nam er die widervart
    - l[n=823]: Nû was Alexander mit here
    - l[n=824]: nâch den poumen uber mere.
    - l[n=825]: des wurden die burgâre stolz unt balt.
    - l[n=826]: si ranten ûz mit gewalt.
    - l[n=827]: ubirmûtechliche si sich râchen,
    - l[n=828]: ein castel si im zebrâchen.
    - l[n=829]: eines morgens frû
    - l[n=830]: mit fiure gingen sime zû
    - l[n=831]: unde sclûgen unde fiengen
    - l[n=832]: alle die si drûffe begiengen.
    - l[n=833]: 'noch mag ich iu sagen mêre:'
    - l[n=834]: si besencten sich in den sê,
    - l[n=835]: daz man si in allem tage niene sach,
    - l[n=836]: ê man die gruntfeste zebrach.
    - l[n=837]: sie sancten sich in des sêwes grunt
    - l[n=838]: unt chômen after ûz wider gesunt.
    - l[n=839]: Unde alsô daz castel was endwart,
    - l[n=840]: dô hûb sich ein sturm hart
    - l[n=841]: von den herzogen zwein.
    - l[n=842]: dô beleib der burgêr nie nechein.
    - l[n=843]: a wie maneger des sturmes enchalt;
    - l[n=844]: ze zwain hundert wâren sie gezalt,
    - l[n=845]: die dâ thôt piliben,
    - l[n=846]: al dâ sis von den porten triben.
    - l[n=847]: dâ wart in gescadet vil sêre.
    - l[n=848]: dô alrêrist chom ir hêre.
    - l[n=849]: owê daz Tyre dô niht genas,
    - l[n=850]: alsô wol ir begagent was.
    - l[n=851]: Nû willich sagen allen, die des niene chunnen,
    - l[n=852]: wie Tyre wart gewunnen.
    - l[n=853]: Alexander chom mit grôzer chrefte
    - l[n=854]: unt tet sceph zesamen hephten
    - l[n=855]: imer zwai unt zwai neben;
    - l[n=856]: unt hîz den îsrîne pente geben,
    - l[n=857]: unt tet die mit hûten alsô uberziehen,
    - l[n=858]: daz die unden dar în niene giengen.
    - l[n=859]: perfrit dar ûff si sazten
    - l[n=860]: von den aller lengisten poumen, die sie habeten,
    - l[n=861]: unde triben si zû den zinnen.
    - l[n=862]: alsus wolten si die burch gewinnen.
    - l[n=863]: Der chunich hiez die mûre hauwen
    - l[n=864]: mit stêliner gezowe.
    - l[n=865]: dâ hûb sich ein sturm vil grôz.
    - l[n=866]: a wie man warf unde scôz
    - l[n=867]: von den ainen zen andern,
    - l[n=868]: daz alle die mahte wundern,
    - l[n=869]: die ie dechainen sturm gesâhen.
    - l[n=870]: von der werlte, diu dâ tôt lach,
    - l[n=871]: sô wart daz mere allez ein blût.
    - l[n=872]: des wôhs dem chunige wol sîn mût,
    - l[n=873]: er bestunt sie mit nîde.
    - l[n=874]: von den perfriden hiez er sie trîben.
    - l[n=875]: die wâren hôher danne die turni.
    - l[n=876]: daz tet er in ze zorne.
    - l[n=877]: dâ wurden die schônen turne mit den bogen
    - l[n=878]: in daz wazzer gezogen,
    - l[n=879]: unt brâchen dâ der besten mûre eine,
    - l[n=880]: die ie burch gewan deheine.
    - l[n=881]: Alsô si ze der ander chômen,
    - l[n=882]: zêderboumi sie der nâmen
    - l[n=883]: unde dar zû lange dannen.
    - l[n=884]: dô hiez er perfride spannen
    - l[n=885]: unde rihte die ûf mit listen
    - l[n=886]: unde sazte si ûf zû der feste.
    - l[n=887]: Alexander steich ûf daz obrist gewer
    - l[n=888]: unt gebôt den sturm uber al daz here
    - l[n=889]: unde liez dô mit der werlte
    - l[n=890]: den êristen sturm werden.
    - l[n=891]: mit hameren man die burchmûre zebrach.
    - l[n=892]: a waz dâ werlte tôt belach!
    - l[n=893]: Alexanders schilt was helfenbein,
    - l[n=894]: bezzer wart nie nechein.
    - l[n=895]: sîn helm was alsô gût,
    - l[n=896]: sô der nî nechein swert durch gewût.
    - l[n=897]: in der hende trûch er einen gêr
    - l[n=898]: von golde gedrâjet vil hêr.
    - l[n=899]: dô sach er den herzogen stân,
    - l[n=900]: dem al Tyre was undertân,
    - l[n=901]: kegen ime ûf der mûre.
    - l[n=902]: er lie sich es niuht fertûren,
    - l[n=903]: er scôz in mit tem gêre durch
    - l[n=904]: unde falt in tôt in die burch.
    - l[n=905]: Dô tet der chunich ainen sprunc,
    - l[n=906]: mit im manich helt junc
    - l[n=907]: fon den perfriden ûf die zinnen.
    - l[n=908]: alsus wolden sie die burch gewinnen.
    - l[n=909]: vier tûsint ir mit ime spranch,
    - l[n=910]: sie trûgen ubelen gedanc.
    - l[n=911]: mîn wân ne triege mich,
    - l[n=912]: dâ gespranch ir etelîch,
    - l[n=913]: daz er dâ zestunt
    - l[n=914]: niemer mêre wart gesunt,
    - l[n=915]: daz ir ein hunderet tôt lach
    - l[n=916]: ân andere ungemach.
    - l[n=917]: dâ brâchen sie die besten mûre zû der erde,
    - l[n=918]: diu der ie dehein solte werden.
    - l[n=919]: Dâ was daz velt vil wît,
    - l[n=920]: dâ hûb sich der bitteriste strît,
    - l[n=921]: dâ ich noch ie abe hôrte gesagen.
    - l[n=922]: dâ ne gesach man nechein zagen.
    - l[n=923]: dâ mahti man manegen degen scouwen
    - l[n=924]: al durch den helm verhouwen,
    - l[n=925]: unde manegen rîter junch
    - l[n=926]: al durch die halsperge verwunt,
    - l[n=927]: daz er der wunde niht genas,
    - l[n=928]: want daz swert scarf was.
    - l[n=929]: durch den scilt flôch der gêr
    - l[n=930]: unde machet manegen helt sêr.
    - l[n=931]: dâ hete jâmer ein alsô der ander
    - l[n=932]: âne der wunderlîche Alexander.
    - l[n=933]: er slûch des liutes die menige.
    - l[n=934]: gebeizet was sîn brunne
    - l[n=935]: in eines wurmes blûte.
    - l[n=936]: er stunt ime stolzes mûtes.
    - l[n=937]: hurnen was siu veste.
    - l[n=938]: ez chom vone grôzen listen.
    - l[n=939]: ez lâgen thûsint unt aver thûsint,
    - l[n=940]: ûf der erde mahte niemen gân,
    - l[n=941]: alsô vil lag ir dâ erslagen,
    - l[n=942]: daz iz iu unzellîch ist ze sagen.
    - l[n=943]: die chûnen von Tyre,
    - l[n=944]: des lebenes vil gîre,
    - l[n=945]: si fuhten alsô wildiu swîn,
    - l[n=946]: swes tôt nieht solte sîn.
    - l[n=947]: Die umbe die burch lâgen,
    - l[n=948]: sie ne dorften sich des siges niemer gerûmen.
    - l[n=949]: wande die burgêre brâchen si durch
    - l[n=950]: unt wichen aber wider in die burch.
    - l[n=951]: dâ verlôs er manegen dûren chneht,
    - l[n=952]: Alexander tet in grôz unreht.
    - l[n=953]: Harte zurnt sich Alexander dô.
    - l[n=954]: mit nîde giench er der porten zû.
    - l[n=955]: die dar ûf wâren,
    - l[n=956]: si tâten scaden mêre.
    - l[n=957]: ûf ter porte stunten drîe turni;
    - l[n=958]: dâ geschiet er abe mit zorni
    - l[n=959]: des mordes, des er an sînen holden gesach.
    - l[n=960]: 'mit sînen fursten er sprach:'
    - l[n=961]: "'hêren, bedenchet iuch sîn enzît,"
    - l[n=962]: 'wandir tiure chnehte sît:'
    - l[n=963]: nement si nû die obere hant
    - l[n=964]: sô ist unser spot uber daz lant.'
    - l[n=965]: der rât, der ime dô wart getân,
    - l[n=966]: den mugent ir schiere verstên.
    - l[n=967]: sie rieten, daz er mange getâte richten
    - l[n=968]: unde lieze die turni brechen.
    - l[n=969]: zwô unde sibenzech mange wurden dâ gestalt,
    - l[n=970]: sie wurfen alle mit gewalt.
    - l[n=971]: si wâren vil wol gesailet.
    - l[n=972]: si wurden in driu getailet.
    - l[n=973]: si wurfen fûr unde witi,
    - l[n=974]: 'daz was Alexanders site:'
    - l[n=975]: daz er chriechisc fûr chunde wurchen
    - l[n=976]: unde liez iz niemen merchen,
    - l[n=977]: von welher liste iz im chom,
    - l[n=978]: daz ez in dem wazzere bran.
    - l[n=979]: daz warf er in zû der burch.
    - l[n=980]: dâ mite brante er sie al durch unt durch
    - l[n=981]: unde dar zû manegen herten stein.
    - l[n=982]: dô belaib der burgâre nie nehein,
    - l[n=983]: si mûsen dô alle von der zimlen gân.
    - l[n=984]: wande si ne getorsten dâ nie langer gestân
    - l[n=985]: for des fûres forhten.
    - l[n=986]: Alexander der tranch zû der porte,
    - l[n=987]: mit nîde er sie der nider brach.
    - l[n=988]: a waz ime dâ helede tôt lach!
    - l[n=989]: des wârim sêre mê gesciet,
    - l[n=990]: forhten si der mange wurfe nieht.
    - l[n=991]: sô solt im diu burch werden tiure,
    - l[n=992]: gewunners nieht mit chriechiscen fiure.
    - l[n=993]: 'Alexander wolte sich wole rechen:'
    - l[n=994]: er hiez die trîe turne nider brechen,
    - l[n=995]: die daz fur hiete verlâzen.
    - l[n=996]: der aller rîchisten burgâre, die in der burch sâzen,
    - l[n=997]: der thede er driu tûsint fâhen
    - l[n=998]: unde hiez sie blenden unde hâhen
    - l[n=999]: wider sînen furstin drîn,
    - l[n=1000]: die er dâ for sante der în.
    - l[n=1001]: des siges, des er dâ nam,
    - l[n=1002]: wêrez ein wole bedâht man,
    - l[n=1003]: er ne wurdes niemer ze frô;
    - l[n=1004]: wande ez gescah sît alsô,
    - l[n=1005]: daz ir mêre was der ime dâ tôt belaib,
    - l[n=1006]: '.....'
    - l[n=1007]: tan der inerhalb Tyre wâre
    - l[n=1008]: weder geste oder burgâre.
    - l[n=1009]: al zestôret was dô Tyrus.
    - l[n=1010]: die stifte sint ter chunich Apollonios,
    - l[n=1011]: den Antioch uber mere jagete,
    - l[n=1012]: wande er ime sagete
    - l[n=1013]: daz rêtsce an einem brieve,
    - l[n=1014]: daz er mit sîner tohter sliefe.
    - l[n=1015]: Tyre is noch diu selbe stat,
    - l[n=1016]: dâ daz heiden wîb unseren hêren pat,
    - l[n=1017]: daz er ir tohter erlôste
    - l[n=1018]: von dem ubelen geiste, der sie nôte.
  - chapter[n=45,rhyme=aa]:
    - head[lg=deu-Latn]: Darius' 1. Brief an Alexander (Geschenke)
    - l[n=1019]: Dar nâch uber unlanch stunt
    - l[n=1020]: sô wart Dario chunt
    - l[n=1021]: von einem, der vone Tyren entran,
    - l[n=1022]: daz Alexander der chûne man
    - l[n=1023]: sîne liute habete gevangen
    - l[n=1024]: unde geblentet unde erhangen,
    - l[n=1025]: unt diu schône Tyre lâgen cholen
    - l[n=1026]: unde er sie hieze daz laster dolen.
    - l[n=1027]: er sprach, er mohte sich scamen
    - l[n=1028]: sînes chunichlîches namen,
    - l[n=1029]: daz er in niuht ze helfen chôme,
    - l[n=1030]: dô er ir grôze nôt fernâme.
    - l[n=1031]: Ain rîcher chunich was Darios.
    - l[n=1032]: 'derwider dâhter alsus:'
    - l[n=1033]: Alexander dûhte in lutzel.
    - l[n=1034]: er sante im eines chindes stuzel
    - l[n=1035]: unde dar zû ein scûhpant,
    - l[n=1036]: alsô erz in sînem herzen vant,
    - l[n=1037]: unde ein wênich choldes in einer lade.
    - l[n=1038]: er wânde er ime iemer mohte gescaden.
    - l[n=1039]: unt sante im dise drîe sache
    - l[n=1040]: unt tet des einen brîf machen,
    - l[n=1041]: daz ez der brîf benante,
    - l[n=1042]: umbe waz er ime die drîe gebe sante.
    - l[n=1043]: Ain stuzel sante er im umbe daz,
    - l[n=1044]: daz ime daz stunde michel baz,
    - l[n=1045]: daz er mit den chinden spilen gienge,
    - l[n=1046]: danner sîne liute cholte oder hienge.
    - l[n=1047]: daz bezêchinôt daz scûchpant,
    - l[n=1048]: daz Alexander wart kesant,
    - l[n=1049]: daz er ime tagelîchen dienen solte,
    - l[n=1050]: ob Darios wolte,
    - l[n=1051]: wanten scûchpant nuzet man tagelîch;
    - l[n=1052]: daz er dar an bedâchte sich
    - l[n=1053]: unde lieze sîn irreheit stân
    - l[n=1054]: unt wâre sîneme hêren undertân,
    - l[n=1055]: alsô ander sîne forderen teten,
    - l[n=1056]: die sich nie wider ime gesazten.
    - l[n=1057]: 'Daz bezeichnôt daz cholt:'
    - l[n=1058]: daz er rehte merchen solt,
    - l[n=1059]: daz daz ter zins wâre, den ime sîn vater chulte
    - l[n=1060]: aller jârilîch turch sîne hulde,
    - l[n=1061]: daz er in des prâcht innin
    - l[n=1062]: unt fûr im den zins gewinnen;
    - l[n=1063]: unt daz er des choldes solde leben
    - l[n=1064]: unde er niemen niuht solte nemen,
    - l[n=1065]: unz er wider haim chôme;
    - l[n=1066]: daz er niemen sînes niuht nâme,
    - l[n=1067]: unde daz er schiere dannen rithe
    - l[n=1068]: unde niuht langer bite.
    - l[n=1069]: unt dêter iwiht mêre wider sînen willen,
    - l[n=1070]: er hiez in mit dem besemen villen.
  - chapter[n=46,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders 1. Brief an Darius (Auslegung der Geschenke)
    - l[n=1071]: Unde alsô Alexander den brîf gelas,
    - l[n=1072]: owî wie smâhe ime was,
    - l[n=1073]: daz man ime trôte ze slahen.
    - l[n=1074]: die boten hiez er alle ûfhâhen.
    - l[n=1075]: 'der boten ainer zim sprach:'
