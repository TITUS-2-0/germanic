text:
- body:
  - chapter[n=Prol.,rhyme=aa]:
    - head[lg=deu-Latn]: Prolog
    - l[n=1]: Diz lît, daz wir hî wurchen,
    - l[n=2]: daz sult ir rehte merchen.
    - l[n=3]: sîn gevûge ist vil reht.
    - l[n=4]: iz tihte der phaffe Lambret.
    - l[n=5]: er tâte uns gerne ze mâre,
    - l[n=6]: wer Alexander wâre.
    - l[n=7]: Alexander was ein wîse man,
    - l[n=8]: vil manec rîche er gewan,
    - l[n=9]: er zestôrte vil manec lant.
    - l[n=10]: Philippus was sîn vater genant.
    - l[n=11]: diz mugit ir wol hôren
    - l[n=12]: in libro Machabeorum.
    - l[n=13]: Alberîch von Bisinzo
    - l[n=14]: der brâhte uns diz lît zû.
    - l[n=15]: er hetez in walhisken getihtet.
    - l[n=16]: nû sol ich es iuh in dûtisken berihten.
    - l[n=17]: 'nîman enschulde sîn mich:'
    - l[n=18]: louc er, sô liuge ich.
    - l[n=19]: Dô Alberîch diz lît inslûc,
    - l[n=20]: dô heter ein Salemones pûch,
    - l[n=21]: dâ er ane sach
    - l[n=22]: 'vanitatum vanitas:'
    - l[n=23]: daz ist allez ein îtelcheit,
    - l[n=24]: daz diu sunne umbegeit.
    - l[n=25]: daz hete salemon wol virsûht.
    - l[n=26]: dar umbe swar in sîn mût.
    - l[n=27]: er ne wolte niht langer ledec sitzen,
    - l[n=28]: er screip von grôzen witzen,
    - l[n=29]: wande des mannes mûzecheit
    - l[n=30]: ze deme lîbe noh ze der sêle niht versteit.
    - l[n=31]: dar ane gedâhte Alberîch.
    - l[n=32]: den selben gedanc hân ich.
    - l[n=33]: unt ich ne wil mih niwit langer sparn,
    - l[n=34]: des liedis wil ich volvarn.
    - l[n=35]: 'Rîcher chunege was genûc:'
    - l[n=36]: daz ne saget uns nehein pûch
    - l[n=37]: noh neheiner slahte mâre,
    - l[n=38]: daz deheiner sô rîche wâre,
    - l[n=39]: der in alten zîten
    - l[n=40]: mit sturme oder mit strîte
    - l[n=41]: î so manec lant gewunne
    - l[n=42]: oder sô manegin kunic bedwunge,
    - l[n=43]: herzogen irslûge
    - l[n=44]: unde andere vursten genûge,
    - l[n=45]: 'sô der wunderlîche Alexander:'
    - l[n=46]: im ne gelîchet nehein ander.
    - l[n=47]: Der von Chrîchen was geborn
    - l[n=48]: unde wart dâ ze einem kunige irchorn
    - l[n=49]: unde was der allerhêrste man,
    - l[n=50]: den î Chrîhlant ze kunege gewan.
    - l[n=51]: iz wâren ouh chunege creftic
    - l[n=52]: uber manec dît gewaltic,
    - l[n=53]: vil michel was ir sâlicheit,
    - l[n=54]: ir list unde ir kundecheit,
    - l[n=55]: 'ir scaz der was vil grôz:'
    - l[n=56]: der ne wart nî neheiner sîn genôz,
    - l[n=57]: der mit listen oder mit mahten
    - l[n=58]: sînen willen î sô volbrâhte,
    - l[n=59]: sô der selbe man,
    - l[n=60]: umbe den ich is began.
    - l[n=61]: Diser rede wil ich mich irvaren.
    - l[n=62]: Salemon der was ûz getân,
    - l[n=63]: der sich ûz allen kunegen nam.
    - l[n=64]: dô diu frowe regina austri zû im kom,
    - l[n=65]: unde si sînen hof gesach,
    - l[n=66]: mit rehter wârheit si sprah,
    - l[n=67]: daz von mannes geburte
    - l[n=68]: nî sô frumer kunic wurte.
    - l[n=69]: man mûste in wol ûz sceiden,
    - l[n=70]: wande Alexander was ein heiden.
  - chapter[n=4,rhyme=aa]:
    - head[lg=deu-Latn]: Über Alexander
    - l[n=71]: Nû sprechent bôse lugenâre,
    - l[n=72]: daz er eines goukelâres sun wâre.
    - l[n=73]: di ez imer gesagent,
    - l[n=74]: di liegent alsô bôse zagen,
    - l[n=75]: oder di es î gedâhten.
    - l[n=76]: er was rehter cheiser slahte.
    - l[n=77]: nimer geloube ez nehein frum man.
    - l[n=78]: sînen vater ich wol genennen kan.
    - l[n=79]: sîn geslahte daz was hêrlîch,
    - l[n=80]: ubir al Chrîchen was er gewaltic.
    - l[n=81]: Philippus hîz der vater sîn,
    - l[n=82]: al Macedonenlant was sîn.
    - l[n=83]: sîn ane was ein gût kneht,
    - l[n=84]: uber al daz mer gî sîn reht.
    - l[n=85]: er trûc eine tugentlîche maht.
    - l[n=86]: awî wî manic volcwîc er vaht
    - l[n=87]: wider den kunic Xersen.
    - l[n=88]: harte ellenthafte uberwant er den.
    - l[n=89]: Philippus nam im ein wîp,
    - l[n=90]: si trûc einen frumeclîchen lîp.
    - l[n=91]: 'ich sage iu, wî ir name was:'
    - l[n=92]: si hîz diu scône Olimpias.
    - l[n=93]: daz was Alexanders mûter.
    - l[n=94]: diu frowe hete einen brûder,
    - l[n=95]: der was ouh Alexander genant,
    - l[n=96]: ze Perse heter daz lant.
    - l[n=97]: der was ein vurste alsô getân,
    - l[n=98]: er ne wolte neheinem kunige wesen undertân.
    - l[n=99]: er ne wolte ouh nî ûz neheineme sturme geflîhen,
    - l[n=100]: swî im sîniu dinc dâ irgîngen.
    - l[n=101]: er was ein tûerlîch degen
    - l[n=102]: unde wolte ouh rehter herscefte phlegen.
  - chapter[n=12,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders Geburt
    - l[n=103]: Nû wil ich iu sagen von Alexanderes geburte
    - l[n=104]: wî si alhî gewurte.
    - l[n=105]: sîn mûter frow Olimpias
    - l[n=106]: ze den stunden dô siu sîn genas,
    - l[n=107]: 'dô wart ir ein vil michel nôtfal:'
    - l[n=108]: diu erde erbibete uberal.
    - l[n=109]: dô was der doner vil grôz.
    - l[n=110]: awie starke daz weter ave gôz.
    - l[n=111]: der himel der wandelôte sich
    - l[n=112]: unt der sunne verdunchelôte sich,
    - l[n=113]: er hete vil nâch sînen schîmen verlorn,
    - l[n=114]: dô Alexander wart geborn.
    - l[n=115]: Nû ne freiscit ich ê noh sint
    - l[n=116]: alsus geborn nehain chint.
    - l[n=117]: 'gloubet mir des ich iu sage:'
    - l[n=118]: der dêch baz in drîn tagen
    - l[n=119]: dan al ander chint,
    - l[n=120]: sô si drîer mânôt alt sint,
    - l[n=121]: unt alsô im ieht gescach,
    - l[n=122]: daz ime ubel ze hôren was,
    - l[n=123]: sô sah er alsô der wolf toet,
    - l[n=124]: sô er obe sîneme ezzen stêt.
    - l[n=125]: 'daz ich iu von ime sage, daz ist wâr:'
    - l[n=126]: strûb unde rôt was ime sîn hâr,
    - l[n=127]: nâh eineme viske getân,
    - l[n=128]: den man in dem mere mach vâhen;
    - l[n=129]: ez was ime ze mâzen dicke,
    - l[n=130]: grispe alsô lewen locke.
    - l[n=131]: 'umbe sîn gesûne wil ich iuch bereiten:'
    - l[n=132]: ein ouge daz was weithin,
    - l[n=133]: getân nâch eineme drachen.
    - l[n=134]: 'daz chom von den sachen:'
    - l[n=135]: dô in sîn mûter bestunt ze tragene,
    - l[n=136]: dô chômen ir freislîch pilide ze gegene;
    - l[n=137]: daz was ein vil michel wunder.
    - l[n=138]: swarz was ime daz ander,
    - l[n=139]: nâch eineme grîfen getân.
    - l[n=140]: alsus sagent die in ie gesâhen.
    - l[n=141]: Sîn hals was ime wol gescaffen,
    - l[n=142]: sîn brust was ime wol offen,
    - l[n=143]: sîn arme wârin ime vone grôzer maht.
    - l[n=144]: alles sînes mûtes was er wol bedâht.
    - l[n=145]: 'sîn bûch ne was ime ze lanc noh ze breit:'
    - l[n=146]: a wie wole dem jungelinge daz stêt.
    - l[n=147]: scône er ze tale wert scein
    - l[n=148]: peidiu uber fûz unt uber pein.
    - l[n=149]: unt uber allen sînen lîp
    - l[n=150]: sô was er als êrlîh.
    - l[n=151]: 'daz sag ich iu ze wâre:'
    - l[n=152]: in sînem êrstem jâre
    - l[n=153]: sô wôss ime maht unt sin
    - l[n=154]: mêre den ainem andren in drîn.
    - l[n=155]: 'Nû vernemt, wie sich Alexander vur nam:'
    - l[n=156]: swâ sô ein frumich rîter zû zim chom,
    - l[n=157]: dem bôt er lîp unt gût.
    - l[n=158]: er ne chêrte cheinen sînen mût
    - l[n=159]: weder an chint noch an tumben man;
    - l[n=160]: a wie wol den hêren daz gezam.
    - l[n=161]: ime was ouch sîn gebâre,
    - l[n=162]: alser ein furste von allen landen wâre.
  - chapter[n=13,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders Erziehung
    - l[n=163]: Die meister die Alexander ouch gewan,
    - l[n=164]: si wâren wol gerehte man.
    - l[n=165]: si begunden in wîsheit lêren
    - l[n=166]: unt zugen in zû grôzen êren.
    - l[n=167]: si lêrtin in sturm unde volcwîc,
    - l[n=168]: sô des nie wart gelîch.
    - l[n=169]: der liste der er dannen gewan,
    - l[n=170]: der wart er ein frumer man.
    - l[n=171]: Der êrste meister sîn
    - l[n=172]: der lêrtin chriechisch unde latîn
    - l[n=173]: unt pûchstabe sezzen an eineme perment.
    - l[n=174]: noch tô was er ein lutzel chint.
    - l[n=175]: unt lêrtin vil manich pûch
    - l[n=176]: und ander wîsheit genûch.
    - l[n=177]: Der ander meister, den er gewan,
    - l[n=178]: der lêrtin wol mûsicam
    - l[n=179]: unt lêrtin seitin ziehen,
    - l[n=180]: daz alle thôni dar in giengen,
    - l[n=181]: roten unt ouch der lîren chlanc,
    - l[n=182]: unt von ime selben heven daz gesanc.
    - l[n=183]: 'Der dritte frumt ime harte wol:'
    - l[n=184]: er lêrtin allir dinge zal,
    - l[n=185]: er lêrtin alle wîsseheit,
    - l[n=186]: wie verre der sunne von der mânin gêt;
    - l[n=187]: unt lêrtin ouch den list,
    - l[n=188]: wie hôch von dem wazzer zem himele ist.
    - l[n=189]: Der vierde meister, den er gewan,
    - l[n=190]: daz was Aristotiles der wîse man.
    - l[n=191]: er lêrtin al die chundicheit,
    - l[n=192]: wie der himel umbe gêt,
    - l[n=193]: unt stach ime die list in sînen gedanc
    - l[n=194]: zerchennen daz gestirne unt ouch sînen ganc,
    - l[n=195]: dâ sich die vergen mit pewarent,
    - l[n=196]: dâ si in dem tiefen mere varnt.
    - l[n=197]: Ein meister gewan sint
    - l[n=198]: Alexander daz edele chint,
    - l[n=199]: der lêrtin mit gewâven faren,
    - l[n=200]: unt wie er sich mit eineme scilte solte bewarn,
    - l[n=201]: unt wie er sîn spere solte tragen
    - l[n=202]: ze dem, dem er wolte scaden,
    - l[n=203]: unt wie er den erchiesen mahti
    - l[n=204]: unt gestechen, sô daz tohte;
    - l[n=205]: unt alsô der stich wêre getân,
    - l[n=206]: sô lêrtern zû dem swerte vâhen
    - l[n=207]: unt dâmit chundiclîchen slahen,
    - l[n=208]: unt wie er sînen vîant solde vân;
    - l[n=209]: unt lêrtin, wie er sich solte bewar
    - l[n=210]: vor deme, der ime wolde scaden;
    - l[n=211]: unt wie er sînen fianden lâgen solte,
    - l[n=212]: die er dâ dwingen wolte,
    - l[n=213]: unt wie er zen rîtern solti gebâren
    - l[n=214]: umbe daz, daz sim willich wâren.
    - l[n=215]: Der sehste bestunt in mit wizzen
    - l[n=216]: unt lêrtin ze dinge sizzen
    - l[n=217]: unt lêrtin, wie er daz bedâhte,
    - l[n=218]: daz er von deme unrehti beschiede daz rehte,
    - l[n=219]: unt wie er lantreht bescheiden chunde
    - l[n=220]: allen den ers gunde.
    - l[n=221]: Umbe diz unt umbe manech ander
    - l[n=222]: alsus wart daz chint Alexander
    - l[n=223]: beide listich unt geweltich unt balt.
    - l[n=224]: dô alrêrst was er zwelf jâr alt.
    - l[n=225]: alsô stâtich was ime sîn mût,
    - l[n=226]: umbe al wertlîch gût
    - l[n=227]: sô wolter nî nieht geliegen
    - l[n=228]: noch sich fone cheiner wârheit gezien.
  - chapter[n=18,rhyme=aa]:
    - head[lg=deu-Latn]: Alexander tötet Nectanabus
    - l[n=229]: 'a wie wol einem sînem meister daz erschain:'
    - l[n=230]: er stîz in ze tal uber einem stein,
    - l[n=231]: daz ime sîn hals enzwei brast,
    - l[n=232]: wande er im ain luge zû sprach.
    - l[n=233]: nû sprechent bôse lugenâre,
    - l[n=234]: daz der sîn vater wâre.
    - l[n=235]: a wie ubele ich daz gelouben mach,
    - l[n=236]: wande er im sîn hals enzwei brach.
  - chapter[n=15,rhyme=aa]:
    - head[lg=deu-Latn]: Bucephalus
    - l[n=237]: 'Von Philippus stûde wil ich iu sagen:'
    - l[n=238]: dar under wart ein ros getragen,
    - l[n=239]: daz was wunderlîch.
    - l[n=240]: iz was irre unt strîtich,
    - l[n=241]: snel unt ernisthaft,
    - l[n=242]: fon sîner gescephte joch von sîner chraft.
    - l[n=243]: der munt was im als einem esele getân.
    - l[n=244]: di nasen wâren ime wîte ûf geslân.
    - l[n=245]: sîn ôren wârin im vil lanc,
    - l[n=246]: daz houbet mager unde swanc.
    - l[n=247]: sîn ougen wârin im al der vare
    - l[n=248]: als eim flîgenten arn.
    - l[n=249]: sîn hals was im lockehte,
    - l[n=250]: ich wâne ez wêre lewengeslehte.
    - l[n=251]: ûf den goffen habtiz rinderhâr,
    - l[n=252]: 'an sînen sîten liebartes mâl:'
    - l[n=253]: sô Sarrazîn noch christenman
    - l[n=254]: nichein pezzer ros gewan.
    - l[n=255]: Daz ros wart mit îseren gebunten,
    - l[n=256]: alsô daz dâ tobet ze allen stunden,
    - l[n=257]: unt wart fur den chunich Philippus geleit.
    - l[n=258]: unt als er vernam sîn gelegenhait,
    - l[n=259]: Buzival hiez erz namen,
    - l[n=260]: daz tûhte sie gût alle samt.
    - l[n=261]: Man hiez daz ros in einen marstal thûn,
    - l[n=262]: daz si dâ fur mehten gerûn.
    - l[n=263]: zû dem ros getorste niemen gên,
    - l[n=264]: wan umbe den ez alsô was getân,
    - l[n=265]: dem verteilet was daz leben,
    - l[n=266]: den mûse man dem rosse geben.
  - chapter[n=15,rhyme=aa]:
    - head[lg=deu-Latn]: Alexander reitet Bucephalus und wird als Philipps Nachfolger
        prophezeit
    - l[n=267]: Dem chunige wart ein bote gesant
    - l[n=268]: von dem, dem daz ros was chunt,
    - l[n=269]: unt hiez ez paz pewaren.
    - l[n=270]: er sprach, man solte ez noch an im ervaren,
    - l[n=271]: wem des chuniges gewalt
    - l[n=272]: nâch sînem lîbe wurde fersalt.
    - l[n=273]: "er sprach: 'daz sol dem, derz alrêrst bescride,"
    - l[n=274]: wandiz nie chein man ne gerite.'
    - l[n=275]: Unt als Alexander haim chom,
    - l[n=276]: al di scrift er wol vernam,
    - l[n=277]: wîs was er zummâzen;
    - l[n=278]: tô alrêrst heter sîne meister verlâzen.
    - l[n=279]: des umbe daz ros was gesciet,
    - l[n=280]: des inhabt er noh tô vernomen nieht.
    - l[n=281]: Eines tages als er ûffen der palenze gêt, -
    - l[n=282]: Geste habt in dar gelait -
    - l[n=283]: dô hôrderz ros waien,
    - l[n=284]: daz stunt in sîner tobeheit scrîen.
    - l[n=285]: Alexander sprach zen chinden,
    - l[n=286]: 'die mit ime uber die palinze gingen:'
    - l[n=287]: "'ich ne weiz waz mir scillet inz ôre,"
    - l[n=288]: ez ne lât mich nieht gehôren.
    - l[n=289]: ich ne weiz wederz ein ros oder ein lewe det,
    - l[n=290]: wan ez dâ in beslozzen stêt.'
    - l[n=291]: 'Btholomeus sprach zû dem chinde:'
    - l[n=292]: "'hêre, iz ist Buzival, ein ros vil swinde."
    - l[n=293]: daz hât iuwer vater în getân.
    - l[n=294]: under der stût ne mohte nechein bezzer gegên.
    - l[n=295]: (er sprach:) hêre, ez ne hât nehain marscalch in hûte.
    - l[n=296]: wande ez erbîzet ubele unde gûte.'
    - l[n=297]: Unt dô diz Alexander vernam,
    - l[n=298]: niwiht er ne beite, ê er zû dem rosse chom.
    - l[n=299]: er rief den chinden
    - l[n=300]: unt hiez im den sluzzel gewinnen.
    - l[n=301]: ir neheiner getorste daz ros dâ fur ziehen,
    - l[n=302]: want sie alle vil ungerne dar în gingen.
    - l[n=303]: Alexander erzurnet daz,
    - l[n=304]: die tur er nider brach.
    - l[n=305]: er hîz sie alle abe stân,
    - l[n=306]: er wolte aleine dar în gân.
    - l[n=307]: Alsô Buzival gegen im ûz wolte varn
    - l[n=308]: unt ez Alexander ane begunde starn,
    - l[n=309]: ez erblûcte sich aller sîner maht
    - l[n=310]: unt wolte ime wesen dienesthaft.
    - l[n=311]: ez chnîte fur im dar nider,
    - l[n=312]: ez ne gerûrthe sich ouch nimer sider;
    - l[n=313]: alsô chundeclîch was dem rosse al sîn gebâre,
    - l[n=314]: alsez des chindes wol gewone wâre.
    - l[n=315]: Alexander begunde dô streichen
    - l[n=316]: ein ros, daz nie nichein man begunde weichen,
    - l[n=317]: sô der nie seil noch zôm ane chom.
    - l[n=318]: mit der mane erz nam.
    - l[n=319]: 'er habet ellenthaften gedanc:'
    - l[n=320]: ûfen sînen rucke er ime spranc.
    - l[n=321]: ûzer deme gademe erz reit,
    - l[n=322]: daz was ein michel paltheit.
    - l[n=323]: Ein pote îlte dem chunge daz sagen,
    - l[n=324]: er ne getorste es nieht verdagen,
    - l[n=325]: waz sîn sun hete getân.
    - l[n=326]: ûf spranc der chunich sâ
    - l[n=327]: unt zehenzoch sînes gesindes,
    - l[n=328]: dô frout er sich sînes chindes.
    - l[n=329]: di mêre er gerne vernam.
    - l[n=330]: unt alse der chunich gegen im charn
    - l[n=331]: unt alsô in Alexander vernam,
    - l[n=332]: 'er thet als im wol gezam:'
    - l[n=333]: er warf sich nider unde giench -
    - l[n=334]: Vestian daz ros entfienc
    - l[n=335]: mit eime guldînen bridele -
    - l[n=336]: unde giench sîneme vater gegene.
    - l[n=337]: unt alsô si zesamene chômen,
    - l[n=338]: mit handen si sich nâmen.
    - l[n=339]: ir rede was vil minnesam,
    - l[n=340]: als ir hie muget ferstân.
    - l[n=341]: "'heil dich', sprach Philippus, 'sun mîn,"
    - l[n=342]: mich tunchet, du solt chunich sîn.
    - l[n=343]: der gewalt sî dir vil gereit
    - l[n=344]: alsô wît sô mîn rîch gêt.'
    - l[n=345]: "'heil iuch', sprach Alexander, 'fater mîn,"
    - l[n=346]: got lâz iuch iemer sâlich sîn.
    - l[n=347]: alles gûtes ich iu vil wol getrûwe.
    - l[n=348]: vil lange mûzet ir iuwer rîche mit genâden bûwen.
  - chapter[n=20,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders erster Kriegszug gegen Nicolaus
    - l[n=349]: (Er chot:) fater, nû bin ich funfzên jâr alt,
    - l[n=350]: daz haben ich rehte gezalt,
    - l[n=351]: unt bin alsô chomen ze mînen tagen,
    - l[n=352]: daz ich wole wâfen mach tragen.
    - l[n=353]: unt swer eigen tugent iemer sol gewinnen,
    - l[n=354]: der sal sîn in sîner jugende beginnen,
