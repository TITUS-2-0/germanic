    - l[n=1420]: daz sis ime rât kâben
    - l[n=1421]: unt chômen mit sô frumen chnehten,
    - l[n=1422]: die wol getorsten vehten,
    - l[n=1423]: mit allen ir menegen
    - l[n=1424]: in daz felt Mesopotamiam.
    - l[n=1425]: in der breiten owen
    - l[n=1426]: dâ wolte er sîn her bescowen.
    - l[n=1427]: er sprach, a wî gerne er vernâme
    - l[n=1428]: die manegen scar, die ime chôme.
    - l[n=1429]: nû wil ich iu chunden uber al,
    - l[n=1430]: wî vil ain scare haben sal,
    - l[n=1431]: 'allen den, die des niuht enwizzin:'
    - l[n=1432]: sehs tusint unde sehs hunderet sehsic,
    - l[n=1433]: des wil ich iuch niht verhelen.
    - l[n=1434]: die fursten wil ich zellen
    - l[n=1435]: unt die menige, diu mit samit in chom,
    - l[n=1436]: alsô Dario wol gezam.
    - l[n=1437]: wande er de geweltigiste chunich was,
    - l[n=1438]: dâ man von ie gelas.
    - l[n=1439]: vil wîten ginch sîn gewalt.
    - l[n=1440]: ze zwein unde drîzech wâren sie gezalt
    - l[n=1441]: die chunige, die zim chômen,
    - l[n=1442]: dô si sîne nôth vernâmen.
    - l[n=1443]: grâven chômen ime ouch.
    - l[n=1444]: zwei hundert unde sibenzoch
    - l[n=1445]: herzogen zim chêrten,
    - l[n=1446]: daz sich sîne rîter mêrethen.
    - l[n=1447]: die zalt man, sô ich sicher bin,
    - l[n=1448]: zaht hundert unde trîn.
    - l[n=1449]: von Persin wurden ime gesant
    - l[n=1450]: helide sibenzich tûsint.
    - l[n=1451]: wol hulfen ime des
    - l[n=1452]: die chûnen Zinnonenses.
    - l[n=1453]: si chômen mit funzich tûsint chnehten,
    - l[n=1454]: die wole getorsten vehten.
    - l[n=1455]: die Panfilien dâten harte wale,
    - l[n=1456]: si brâhten die selben zal.
    - l[n=1457]: noch dô chom im ain scar grôz,
    - l[n=1458]: die des wîges lutzel bedrôz,
    - l[n=1459]: alsô si in chunigis reise wol gezam,
    - l[n=1460]: wande si von Medinrîche quam.
    - l[n=1461]: Medinrîch ist noch daz selbe lant,
    - l[n=1462]: dar der engel mit Tobia wart gesant.
    - l[n=1463]: Cilicien heizet ein lant,
    - l[n=1464]: si brâhtin im ahzech tûsint.
    - l[n=1465]: von Ninive wurden ime gesant
    - l[n=1466]: ain unde zwainzich tûsint.
    - l[n=1467]: die ûzer Armeninlant
    - l[n=1468]: si brâhten ime aht tûsint.
    - l[n=1469]: si ne mohten ouch dô nieht baz.
    - l[n=1470]: diz was dâ diu archa gesaz,
    - l[n=1471]: diu ûf dem wazzer swebete,
    - l[n=1472]: dâ Noe inne lebete.
    - l[n=1473]: ime santen die von Gâze,
    - l[n=1474]: die uber Filistin sâzen,
    - l[n=1475]: di im wol ze trôste mohten wesen,
    - l[n=1476]: zwirent funf hunderet starcher risen.
    - l[n=1477]: noch dô sâzen sîne frîe man
    - l[n=1478]: ferre uber Frigiam.
    - l[n=1479]: die trûgen ime gûten willen.
    - l[n=1480]: si nâmen zweinzeh tûsint gesellen
    - l[n=1481]: unde tâtin zim chêren,
    - l[n=1482]: si gunden im sîner êren.
    - l[n=1483]: alsô man sînen willen vernam
    - l[n=1484]: ferre uber Indiam,
    - l[n=1485]: zwelf tûsint si nâmen,
    - l[n=1486]: gereitechlîchen zim chômen.
    - l[n=1487]: noch dô chom im ain wênich here,
    - l[n=1488]: 'daz santen ime die von dem rôten mere:'
    - l[n=1489]: ain tûsint sneller helede
    - l[n=1490]: ze wîge wol erwelte.
    - l[n=1491]: nû vernement, war zû man diz her nam,
    - l[n=1492]: 'dô iz al zesamene chom:'
    - l[n=1493]: ze sehs hunderet tûsint wâren si gezalt,
    - l[n=1494]: dâ was der hof manichfalt,
    - l[n=1495]: unde dar zû drîzech tûsint.
    - l[n=1496]: alsus hete sich Darius besant.
  - chapter[n=84,rhyme=aa]:
    - head[lg=deu-Latn]: Alexander besiegt Darius (Issos)
    - l[n=1497]: Unde alsô diz Alexander vernam,
    - l[n=1498]: er manete sîne getrûe man,
    - l[n=1499]: die im ze sîner nôte
    - l[n=1500]: ie wâren ainmûthe.
    - l[n=1501]: mit ainer minner menige
    - l[n=1502]: sô reit er in zegegene,
    - l[n=1503]: ze Mesopotamie
    - l[n=1504]: dâ chômen sie zesamene
    - l[n=1505]: in der breiten ouwe.
    - l[n=1506]: man mohte nie beschowen
    - l[n=1507]: schar also edele
    - l[n=1508]: vor eineme chunige,
    - l[n=1509]: die der ie zesamene chômen
    - l[n=1510]: unte sô grôzen schaden genârnen.
    - l[n=1511]: alle die volchwîch
    - l[n=1512]: '.....'
    - l[n=1513]: die von Darios zît
    - l[n=1514]: al bizher sint geschên,
    - l[n=1515]: si ne mohten dar zû gelîchen niet.
    - l[n=1516]: dâ was daz felt vil breit
    - l[n=1517]: mit ten tôten uberspreit.
    - l[n=1518]: dâ Alexander durch daz wale brach,
    - l[n=1519]: a waz dâ helede tôt lach.
    - l[n=1520]: unde alsô êrhin mûz iz nû alsô ergân.
    - l[n=1521]: "'ir sulten zins hie infâhen,"
    - l[n=1522]: dâ ir vil manegen tach habeth nâch gesant.
    - l[n=1523]: den hân ich iu brâht in diz lant.'
    - l[n=1524]: mit tem selben worte
    - l[n=1525]: sô gab er im mit dem swerte
    - l[n=1526]: ainen slach, der was mâre grôz,
    - l[n=1527]: daz imz houbet vur daz march scôz.
    - l[n=1528]: dâ geschieth sich daz volcwîc.
    - l[n=1529]: sus saget uns maister Albrîch
    - l[n=1530]: unde der gûte phaffe Lampret.
    - l[n=1531]: diz liet ist wâr unde rehth.
    - l[n=1532]: hie dûhte si beide diu mâze.
    - l[n=1533]: nû ist zîth daz lâzen.
