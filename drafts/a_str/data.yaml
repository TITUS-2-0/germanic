text:
- body:
  - chapter[n=Prol.,rhyme=aa]:
    - head[lg=deu-Latn]: Prolog
    - l[n=1]: Daz liet, daz wir hie wirken,
    - l[n=2]: daz sult ir rehte merken.
    - l[n=3]: sîn gevôge ist vil gereht.
    - l[n=4]: iz tihte der paffe Lamprecht
    - l[n=5]: unde saget uns ze mêre,
    - l[n=6]: wer Alexander wêre.
    - l[n=7]: Alexander was ein listich man,
    - l[n=8]: vil manige rîche er gewan,
    - l[n=9]: er zestôrte manige lant.
    - l[n=10]: Philippus was sîn vater genant.
    - l[n=11]: daz mugit ir wol hôren
    - l[n=12]: in libro Machabeorum.
    - l[n=13]: Elberîch von Bisenzun
    - l[n=14]: der brâhte uns diz liet zû,
    - l[n=15]: der hetiz in walischen getihtit.
    - l[n=16]: ih hân is uns in dûtischen berihtet.
    - l[n=17]: 'nieman ne schuldige mih:'
    - l[n=18]: alse daz bûch saget, sô sagen ouh ih.
    - l[n=19]: Dô Elberîch daz liet irhûb,
    - l[n=20]: dô heter einen Salemonis mût,
    - l[n=21]: in wilhem gedanken Salemon saz,
    - l[n=22]: 'dô er rehte alses sprah:'
    - l[n=23]: "'vanitatum vanitas"
    - l[n=24]: et omnia vanitas.'
    - l[n=25]: 'daz quît: iz ist alliz ein îtelicheit,'
    - l[n=26]: daz di sunne umbegeit.
    - l[n=27]: daz hete Salemon wol versûht.
    - l[n=28]: durh daz swar ime sîn mût.
    - l[n=29]: er ne wolde niwit langer ledich sitzen,
    - l[n=30]: er screib von grôzen witzen,
    - l[n=31]: wande des mannis mûzicheit
    - l[n=32]: zô dem lîbe noh zô der sêle nit ne versteit.
    - l[n=33]: dar ane gedâhte meister Elberîch.
    - l[n=34]: den selben gedanc haben ouh ih.
    - l[n=35]: ih ne wil mih niwit langer sparen,
    - l[n=36]: des liedis wil ih vollenvaren.
  - chapter[n=4,rhyme=aa]:
    - head[lg=deu-Latn]: Über Alexander
    - l[n=37]: 'Iz quît: rîchere kuninge was genûch:'
    - l[n=38]: daz ne sagit uns aber nehein bûch
    - l[n=39]: noh neheiner slahte mêre,
    - l[n=40]: daz ie dichein sô rîche wêre,
    - l[n=41]: der in alten gezîten
    - l[n=42]: mit sturmen oder mit strîten
    - l[n=43]: ie sô manige lant gewunne
    - l[n=44]: oder sô manigen kuninc bedwunge
    - l[n=45]: oder sô vil herzogen irslûge
    - l[n=46]: unde andire fursten genûge,
    - l[n=47]: sô der wunderlîche Alexander.
    - l[n=48]: ime ne gelîchet nehein ander.
    - l[n=49]: Er was von Kriechen geborn
    - l[n=50]: und wart dâ ze kuninge irkorn
    - l[n=51]: und was der allirhêriste man,
    - l[n=52]: den Kriechen ze kuninge ie gwan.
    - l[n=53]: ouh wâren kuninge creftich
    - l[n=54]: hêr unde mehtih
    - l[n=55]: ubir manige diet gwaldich,
    - l[n=56]: ir hêrheit manicfaldich;
    - l[n=57]: michel was ir wîsheit,
    - l[n=58]: ir list unde ir cundicheit,
    - l[n=59]: 'ir scaz was mêre unde grôz:'
    - l[n=60]: ir ne wart aber nie nehein sîn genôz,
    - l[n=61]: di mit listen oder mit mehten
    - l[n=62]: irin willen ie sô vollenbrêhten,
    - l[n=63]: sô aber dirre selbe man,
    - l[n=64]: umbe den ich diser rede began.
    - l[n=65]: An eine andere rede wil ih nû vân.
    - l[n=66]: Salemon der was aleine ûz getân,
    - l[n=67]: der sih ûzir allen kuningen nam.
    - l[n=68]: dô regina austri zû ime quam,
    - l[n=69]: unde si sîne wunder
    - l[n=70]: alle besunder
    - l[n=71]: rehte merken began,
    - l[n=72]: starke si dô undirquam;
    - l[n=73]: dô sî sîne wîsheit
    - l[n=74]: und sîne grôze rîcheit,
    - l[n=75]: sîn fleisch und sîne vische
    - l[n=76]: und di zîrheit sîmer tische
    - l[n=77]: unde sîn templum gesach,
    - l[n=78]: mit rehter wârheit si dô sprach,
    - l[n=79]: daz von mannis geburte
    - l[n=80]: frumiger kuninc nie ne wurde.
    - l[n=81]: man mûstin wol ûz scheiden,
    - l[n=82]: wande Alexander was ein heiden.
    - l[n=83]: Noch sprechint manige lugenêre,
    - l[n=84]: daz er eines gouchelêres sun wêre,
    - l[n=85]: 'Alexander, dar ih û von sagen:'
    - l[n=86]: si liegent alse bôse zagen
    - l[n=87]: alle di is ie gedâhten;
    - l[n=88]: wande er was rehte kunincslahte.
    - l[n=89]: sulhe lugenmêre
    - l[n=90]: sulen sîn ummêre
    - l[n=91]: iegelîchen frumen man.
    - l[n=92]: sîn geslehte ih wol gereiten kan.
    - l[n=93]: sîn geslehte was hêrlîch,
    - l[n=94]: ubir al Kriechlant gwaldich.
    - l[n=95]: Philippus hîz der vater sîn,
    - l[n=96]: al Macedonien was sîn.
    - l[n=97]: sîn ane der was ein gût kneht,
    - l[n=98]: ubir daz mere ginc sîn reht.
    - l[n=99]: er was geheizen Omin.
    - l[n=100]: wîten ginc der gwalt sîn,
    - l[n=101]: michil was sîn heriscraft.
    - l[n=102]: vil manich volcwîch er vaht
    - l[n=103]: 'wider den kuninc Xersen:'
    - l[n=104]: gewaldiclîche verwan er den
    - l[n=105]: unde vil ellenthafte
    - l[n=106]: mit sîner hercrafte.
    - l[n=107]: Philippus der nam ein wîb,
    - l[n=108]: di trûch einen vil hêrlîchen lîb.
    - l[n=109]: 'ih sagû, wî ir name was:'
    - l[n=110]: si hîz di scône Olympias.
    - l[n=111]: diu was Alexandris mûter.
    - l[n=112]: di frowe hete einen brûder,
    - l[n=113]: der was ouh Alexander genant,
    - l[n=114]: ze Persien het er daz lant.
    - l[n=115]: der was ein furste alsô getân,
    - l[n=116]: er ne wolde werden undertân
    - l[n=117]: nie neheineme kuninge;
    - l[n=118]: 'daz sagih û âne lugene:'
    - l[n=119]: er ne wolde ouh ze neheinen zîten
    - l[n=120]: von sturmen noh von strîten
    - l[n=121]: nie neheine wîs geflîhen,
    - l[n=122]: swî ime sîne dinc dâ irgîhen.
    - l[n=123]: er was ein tûrlîcher degen
    - l[n=124]: und wolde rehter herschefte plegen.
  - chapter[n=12,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders Geburt
    - l[n=125]: Woldet ir alle nû gedagen,
    - l[n=126]: sô woldih û sagen
    - l[n=127]: von Alexandris geburte,
    - l[n=128]: 'wî diu gewurte:'
    - l[n=129]: sîn mûter frowe Olympias
    - l[n=130]: zestunt dô si sîn genas,
    - l[n=131]: 'dô wart ein michil nôtfal:'
    - l[n=132]: di erde irbibete ubir al.
    - l[n=133]: der donre wart vil grôz.
    - l[n=134]: ein starkiz weder nider gôz.
    - l[n=135]: der himel verwandelôte sih
    - l[n=136]: und di sunne vertunkelôte sih
    - l[n=137]: und hete vil nâh irn schîn verlorn,
    - l[n=138]: dô Alexander wart geborn.
    - l[n=139]: Nû ne vereischetih ê nie noh sint
    - l[n=140]: alsus geborn nie nehein kint.
    - l[n=141]: 'geloubit mir des ih û sagen:'
    - l[n=142]: er gedeih baz in drîn tagen
    - l[n=143]: dan alle andere kint,
    - l[n=144]: sô si drîer mânede alt sint.
    - l[n=145]: und alsime iht des gescach,
    - l[n=146]: daz ime ubile ze hugen was,
    - l[n=147]: sô sach er alse der wolf deit,
    - l[n=148]: alser ubir sînem âze steit.
    - l[n=149]: 'daz ih von ime sagen, daz ist wâr:'
    - l[n=150]: strûb unde rôt was ime sîn hâr,
    - l[n=151]: nâh eineme vische getân,
    - l[n=152]: den man in den mere sehet gân,
    - l[n=153]: und was ime ze mâzen dicke
    - l[n=154]: und crisp als eines wilden lewen locke.
    - l[n=155]: Umbe sîn gesihte
    - l[n=156]: wil ih ûh ouh berihten
    - l[n=157]: 'unde rehte bescheiden:'
    - l[n=158]: ein ouge was ime weiden,
    - l[n=159]: getân nâh einen trachen.
    - l[n=160]: 'daz quam von den sachen:'
    - l[n=161]: dô in sîn mûter bestunt ze tragene;
    - l[n=162]: dô quâmen ir freislîche bilide ingagene,
    - l[n=163]: daz was ein michil wunder.
    - l[n=164]: swarz was ime daz ander,
    - l[n=165]: nâh einem grîfen getân.
    - l[n=166]: daz sult ir wizzen âne wân.
    - l[n=167]: Sîn hals was ime wol geschaffin,
    - l[n=168]: sîn brust starc und wol offin,
    - l[n=169]: sîne arme wâren ime von grôzer maht.
    - l[n=170]: allis sînes mûtes was er wol bedâht.
    - l[n=171]: 'sîn bûch ne was ime nit ze lanc noh ze breit:'
    - l[n=172]: vil wol daz deme jungelinge steit.
    - l[n=173]: beide ubir vûze und ubir bein
    - l[n=174]: rîterlîch er ze tale schein.
    - l[n=175]: unde ubir allen sînen lîb
    - l[n=176]: was er rehte hêrlîch.
    - l[n=177]: 'daz sagih û zewâre:'
    - l[n=178]: in sînen êristen jâre
    - l[n=179]: wôhs ime maht und der lîb sîn
    - l[n=180]: mêr dan einem anderen in drîn.
  - chapter[n=13,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders Erziehung
    - l[n=181]: 'Nû hôret, wî er sih fure nam:'
    - l[n=182]: swâ ein frumich rîter zô ime quam,
    - l[n=183]: den bôt er lîb unde gût
    - l[n=184]: unde ne karte neheinen sînen mût
    - l[n=185]: an neheinen tumben man;
    - l[n=186]: vil harte wol im daz gezam.
    - l[n=187]: ime was sîn gebâre,
    - l[n=188]: als er ein furste wâre
    - l[n=189]: ubir alliz ertrîche.
    - l[n=190]: 'ih sage û wêrlîche:'
    - l[n=191]: die meistere, di er dô gwan,
    - l[n=192]: di wâren cunstige man.
    - l[n=193]: si begunden in wîsheit lêren
    - l[n=194]: und zugen in ze grôzen êren.
    - l[n=195]: si larten ime strîten
    - l[n=196]: und vermezzenlîchen rîten
    - l[n=197]: in sturm unde in volcwîch,
    - l[n=198]: sô daz is nie ne wart sîn gelîch.
    - l[n=199]: der liste di er von in gwan,
    - l[n=200]: der wart er ên vil vornême man.
    - l[n=201]: Der êriste meister sîn
    - l[n=202]: der lartin kriechisch und latîn
    - l[n=203]: und scrîben ane pergemint.
    - l[n=204]: noh dan was er ein lutzil kint.
    - l[n=205]: und lartin vil manige bûch
    - l[n=206]: und andire wîsheit genûch.
    - l[n=207]: Sîn meister, den er dar nâh gwan,
    - l[n=208]: der lartin wol mûsicam
    - l[n=209]: und lartin di seiten zîhen,
    - l[n=210]: daz alle tône dar inne gîhen,
    - l[n=211]: rotten unde der lîren clanc,
    - l[n=212]: und von ime selben heben den sanc.
    - l[n=213]: 'Der dritte frumete ime wole:'
    - l[n=214]: er lartin allir dinge zale
    - l[n=215]: unde lartin al di wîsheit,
    - l[n=216]: wî verre diu sunne von dem mânen geit;
    - l[n=217]: unde lartin ouh di list,
    - l[n=218]: wî verre von den wazzeren zô den himelen ist.
    - l[n=219]: Der meister, den er dô gwan,
    - l[n=220]: was Aristotiles der wîse man.
    - l[n=221]: der lartin alle di cundicheit,
    - l[n=222]: wî der himel umbe geit,
    - l[n=223]: und stach ime di list in sînen gedanc
    - l[n=224]: zerkennene daz gestirne und sînen ganc?
    - l[n=225]: dâ sih di wîsen veren mite bewarint,
    - l[n=226]: dâ si in dem tiefen mere varint.
    - l[n=227]: Einen meister gwan er abir sint
    - l[n=228]: Alexander daz edele kint,
    - l[n=229]: der lartin mit gewêfene varen,
    - l[n=230]: wî er sih mit einem schilde solde bewarn,
    - l[n=231]: und wî er sîn sper solde tragen
    - l[n=232]: zô deme, dem er wolde schaden,
    - l[n=233]: und wî er den erkiesen mohte
    - l[n=234]: und gestechen, alsiz ime tohte
    - l[n=235]: und alse der stich wêre getân,
    - l[n=236]: wî er zô dem swerte solde vân
    - l[n=237]: und dâ mite kundiclîche slege slân,
    - l[n=238]: und wî er sînen vîant solde vân,
    - l[n=239]: und wî er sih selben solde bewaren
    - l[n=240]: vor allen, di ime woldin schaden;
    - l[n=241]: und wî er sînen vîanden lâgen solde,
    - l[n=242]: di er danne untwirken wolde,
    - l[n=243]: und wî er zô den rîteren solde gebâren
    - l[n=244]: zô diu daz si ime willich wâren.
    - l[n=245]: Der sehste bestunt in mit grôzen witzen
    - l[n=246]: und lartin ze dinge sitzen
    - l[n=247]: und lartin, wî er daz irdêhte,
    - l[n=248]: wî er von dem unrehten beschiede daz rehte,
    - l[n=250]: und wî er lantreht bescheiden kunde
    - l[n=251]: allen den er is gunde.
    - l[n=252]: Umbe daz und vil manich ander
    - l[n=253]: alsus wart daz kint Alexander
    - l[n=254]: listic, gwaldich unde balt.
    - l[n=255]: nû allir êrist was er zwelif jâr alt.
    - l[n=256]: alsô stêtich was ime sîn mût,
    - l[n=257]: durh alliz werltlîch gût
    - l[n=258]: ne wolder nie geliegen
    - l[n=259]: und niemanne betriegen,
    - l[n=260]: noh durh lieb noh durh leit
    - l[n=261]: geswachen di wârheit.
    - l[n=262]: 'einem sînen meistere daz wol schein:'
    - l[n=263]: den stîz er ze tale ubir einen stein,
    - l[n=264]: daz ime sîn hals in zwei brach,
    - l[n=265]: wander ime eine lugene zû sprah.
    - l[n=266]: nû sprechent manige lugenêre,
    - l[n=267]: daz der sîn vater wêre.
    - l[n=268]: vil ubile ih des gelouben mach,
    - l[n=269]: wander ime den hals in zwei brach.
  - chapter[n=15,rhyme=aa]:
    - head[lg=deu-Latn]: Bucephalus
    - l[n=270]: 'Von Philippis stûte wil ih û nû sagen:'
    - l[n=271]: dar under was ein ros getragen.
    - l[n=272]: daz ros daz was wunderlîch,
    - l[n=273]: irre und vil strîtich,
    - l[n=274]: snel und starc von gescafnisse.
    - l[n=275]: des sult ir sîn gwisse.
    - l[n=276]: iz hete unzallîche craft
    - l[n=277]: und ummâzlîche maht.
    - l[n=278]: iz irbeiz di lûte unde irslûch.
    - l[n=279]: iz was freislîch gnûch.
    - l[n=280]: ime was sîn munt,
    - l[n=281]: daz wil ih û tûn kunt,
    - l[n=282]: als eime esele getân.
    - l[n=283]: di nasen wâren ime wîte ûf geslân.
    - l[n=284]: sîne ôren wâren ime lanc,
    - l[n=285]: daz houbit magir unde slanc.
    - l[n=286]: sîme ougen wâren ime allir vare
    - l[n=287]: glîch eineme fliegindin aren.
    - l[n=288]: sîn hals was ime lockehte,
    - l[n=289]: ih wêne iz wêre lewingeslehte.
    - l[n=290]: ûf den goffen hâtiz rindis hâr,
    - l[n=291]: 'an den sîten liebarten mâl:'
    - l[n=292]: sô Sarrazîn joh cristinman
    - l[n=293]: nie nihein bezzer ros gwan.
    - l[n=294]: Daz ros wart mit îsine gebunden,
    - l[n=295]: alse daz dâ tobit zallen stunden.
    - l[n=296]: iz wart vor den kuninc Philippum geleit.
    - l[n=297]: und als er vernam sîne gelegenheit,
    - l[n=298]: Bucival hîz erz namen.
    - l[n=299]: daz dûhte si gût alle samen.
    - l[n=300]: Dô hîz man manigen starkin man
    - l[n=301]: daz selbe ros leiten dan
    - l[n=302]: und in einen marstal betûn,
    - l[n=303]: daz man dâ vor mohte gerûn.
    - l[n=304]: zô ime ne torste nieman gân,
    - l[n=305]: wan der alsô hete getân,
    - l[n=306]: daz ime verteilet wart daz leben,
    - l[n=307]: den môse man deme rosse geben.
  - chapter[n=19,rhyme=aa]:
    - head[lg=deu-Latn]: Alexander reitet Bucephalus und wird als Philipps Nachfolger
        prophezeit
    - l[n=308]: Deme kuninge wart ein bote dô gesant
    - l[n=309]: von deme, der daz ros het erkant,
    - l[n=310]: und hîz iz sint baz bewarn,
    - l[n=311]: wande man solde dar an irvarn,
    - l[n=312]: weme nâh sînem lîbe
    - l[n=313]: sîn kunincrîche solde blîbe;
    - l[n=314]: und enbôt ime dâ bî,
    - l[n=315]: iz solde rehte derre sî,
    - l[n=316]: der iz allir êrist beschrite,
    - l[n=317]: wandiz noh diu nehein man ne gerite.
    - l[n=318]: Unde alse Alexander heim quam,
    - l[n=319]: di scrift er harte wol vernam,
    - l[n=320]: wîs was er zunmâzen;
    - l[n=321]: sîne meistere heter verlâzen.
    - l[n=322]: dannoh ne heter nit vernomen,
    - l[n=323]: wî iz umbe daz ros was comen.
    - l[n=324]: eines tages dô der jungelinc
    - l[n=325]: in der pelenze ginc,
    - l[n=326]: dô volgetime Vestian,
    - l[n=327]: der was ein edele juncman.
    - l[n=328]: daz ros hôrter dô weien
    - l[n=329]: und tubilîchen schrîen.
    - l[n=330]: vil starke er dô dâhte,
    - l[n=331]: waz daz wesen mohte,
    - l[n=332]: mit allen sînen sinne,
    - l[n=333]: wes wêre di freislîche stimme.
    - l[n=334]: 'zô Vestiane er dô sprach:'
    - l[n=335]: "'nû sage mir, waz daz sîn mach,"
    - l[n=336]: daz mir schillit in mîne ôren
    - l[n=337]: und ne lâzet mih nit gehôren;
    - l[n=338]: iz gebârit freislîche.
    - l[n=339]: sîn stimme di is gelîche
    - l[n=340]: einem freislîchem tiere.'
    - l[n=341]: dô antworte ime schiere
    - l[n=342]: 'Ptolomeus unde sprach:'
    - l[n=343]: "'ih sage dir, waz daz wesen mach:"
    - l[n=344]: iz ist ein ros freislîch.
    - l[n=345]: ime ne wart nie nehein gelîch
    - l[n=346]: in alle kriechische lant.
    - l[n=347]: Bucival ist iz genant.
    - l[n=348]: dîn vater hât iz în getân.
    - l[n=349]: iz ne dorfte bezzer nie gegân
    - l[n=350]: under neheiner stûte.
    - l[n=351]: iz ne hât nieman in hûte,
    - l[n=352]: wandiz ist vil freislîch.
    - l[n=353]: sîn stimme di ist eislîch.
    - l[n=354]: iz irbîzit man und wîb.
    - l[n=355]: nieman ne mach sînen lîb
    - l[n=356]: vor ime gesunt behalden,
    - l[n=357]: swes iz mûz gwalden.'
    - l[n=358]: Dô der hêre diz vernam,
    - l[n=359]: schiere er zô deme rosse quam.
    - l[n=360]: dô sîn daz ros wart gware
    - l[n=361]: und er iz begunde ane starc,
    - l[n=362]: iz vergaz allir sîner maht
    - l[n=363]: unde woldime wesen dienisthaft.
    - l[n=364]: iz knête fur in der nider
    - l[n=365]: und ne unsitete niwit sider.
    - l[n=366]: ime worden sîne gebêre,
    - l[n=367]: alsiz des kindes vil wol gewone wêre.
    - l[n=368]: Er begundiz streichen,
    - l[n=369]: daz nieman geweichen
    - l[n=370]: ne mohte neheine wîs;
    - l[n=371]: 'wander was vil wîs:'
    - l[n=372]: er ne legete zoum noh seil dar ane,
    - l[n=373]: er begreif iz in sîne manen.
