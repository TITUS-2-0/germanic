    - l[n=3183]: hundrit tûsunt was dere
    - l[n=3184]: und zwênzich tûsint dar zô.
    - l[n=3185]: vil wol entphiengen si in dô
    - l[n=3186]: und hiezen in willecome sîn.
    - l[n=3187]: 'alsus antworter in:'
    - l[n=3188]: "'o wol ûh, kriechische man,"
    - l[n=3189]: ze heile mûz iz û irgân.
    - l[n=3190]: ih ne wille niwit liegen
    - l[n=3191]: noh niemanne betriegen.
    - l[n=3192]: wir ne mugin niwit gelîchen
    - l[n=3193]: Dario dem rîchen.
    - l[n=3194]: ih wâne, daz ûf dir erden
    - l[n=3195]: nieman mohte gewerden,
    - l[n=3196]: der zô ime gestunde
    - l[n=3197]: oder alsô grôz here gewunne.
    - l[n=3198]: 'dâ bî wil ih û sagen:'
    - l[n=3199]: ein her fliegen mach nit gescaden
    - l[n=3200]: zwein wênigen wespen,
    - l[n=3201]: dâ si varen ze neste.'
  - chapter[n=118,rhyme=aa]:
    - head[lg=deu-Latn]: Alexander besiegt Darius (Gaugamela/ Erbela)
    - l[n=3202]: Alexandris gesellen
    - l[n=3203]: worden von disen bîspellen
    - l[n=3204]: vil wunderlîchen frô.
    - l[n=3205]: vil kûme irbeiten si dô,
    - l[n=3206]: biz man begunde sturmen.
    - l[n=3207]: Darius von sînen burgen
    - l[n=3208]: reit zô dem wâge,
    - l[n=3209]: der dâ heizet Strâge.
    - l[n=3210]: des nahtes fûren si dar ubir.
    - l[n=3211]: der quam aber lutzil wider,
    - l[n=3212]: wande si wurden irslagen.
    - l[n=3213]: ih wil û zwâren sagen.
    - l[n=3214]: sân des morgenis frû
    - l[n=3215]: ze wîge gareten si sih dô,
    - l[n=3216]: beidenthalben di here,
    - l[n=3217]: und brummen alse daz mere
    - l[n=3218]: di alden mit den jungen,
    - l[n=3219]: dâ si ze samene drungen.
    - l[n=3220]: Alexander der hêrre
    - l[n=3221]: der was der êrre,
    - l[n=3222]: der dâ zô der zît
    - l[n=3223]: irhûb den freislîchen strît.
    - l[n=3224]: ûf Bucifale er reit.
    - l[n=3225]: nie man ne bescreit
    - l[n=3226]: dichein ros alsô gût.
    - l[n=3227]: dar zô stunt ime der mût,
    - l[n=3228]: daz er den sige irwurbe
    - l[n=3229]: oder degintlîchen sturbe.
    - l[n=3230]: vil wole half ime daz,
    - l[n=3231]: daz er sô wol gare was
    - l[n=3232]: nâch deme kriechischeme site.
    - l[n=3233]: di ingegen im quâmen geriten,
    - l[n=3234]: di sprâchen, er wêre ein got.
    - l[n=3235]: von beidenthalben flouch daz scoz
    - l[n=3236]: alsô dicke sô der snê.
    - l[n=3237]: den recken wart dâ vil wê.
    - l[n=3238]: Dâ wart ein michil schal.
    - l[n=3239]: man blies di herehorn ubir al
    - l[n=3240]: und di trummen zô dem wîge.
    - l[n=3241]: Darius mit den sînen
    - l[n=3242]: mûste durh nôt vehten.
    - l[n=3243]: er brâhte manigen Persen
    - l[n=3244]: zô deme strîte.
    - l[n=3245]: di wâren gesamenet wîte
    - l[n=3246]: und heten manlîchen mût.
    - l[n=3247]: und alse der helt gût
    - l[n=3248]: Alexander diz vernam,
    - l[n=3249]: dô maneter sîne getrûwe man,
    - l[n=3250]: di ime wâren einmûte
    - l[n=3251]: zaller sîner nôte,
    - l[n=3252]: daz si sih wol bedêhten
    - l[n=3253]: und wâren gûte knehte,
    - l[n=3254]: wande si mit rehte
    - l[n=3255]: umbe den zins solden vehten,
    - l[n=3256]: dâ si Darius zô dwanc.
    - l[n=3257]: dô hûb sih ze hant
    - l[n=3258]: di kriechische manige
    - l[n=3259]: den Persen ingegene.
    - l[n=3260]: mit micheler frevele
    - l[n=3261]: quâmen si ze samene
    - l[n=3262]: bî dem Strâge an der ouwen.
    - l[n=3263]: wer mohte ie bescowen
    - l[n=3264]: zwei sô hêrlîchen scaren.
    - l[n=3265]: dâ was maniger mûter barn.
    - l[n=3266]: dâ si ze samene quâmen
    - l[n=3267]: und grôzen scaden nâmen,
    - l[n=3268]: dâ was daz felt vil breit
    - l[n=3269]: mit den tôten ubirspreit.
    - l[n=3270]: si slûgen unde stâchen,
    - l[n=3271]: sô daz di schefte brâchen.
    - l[n=3272]: dô griffen di recken
    - l[n=3273]: zô den scarfin ecken
    - l[n=3274]: und vohten mit nîde.
    - l[n=3275]: alle di volcwîge,
    - l[n=3276]: sturme unde strîte,
    - l[n=3277]: di von Darien gezîte
    - l[n=3278]: al biz her sint geschît,
    - l[n=3279]: di ne glîchen dar zô niet,
    - l[n=3280]: dâ Alexander der helt balt
    - l[n=3281]: Dario den zins galt.
    - l[n=3282]: daz der zins ie gedâht wart,
    - l[n=3283]: daz gerou manigen in der vart,
    - l[n=3284]: wande si in dem blûte swebeten,
    - l[n=3285]: di dannoh gerne lebeten.
    - l[n=3286]: Der sturm was grimme unde hart.
    - l[n=3287]: dâ wart manich helm scart
    - l[n=3288]: und manige brunje durhstochen,
    - l[n=3289]: daz dâ durh quam geflozzen
    - l[n=3290]: daz blût den lîb al ze tale.
    - l[n=3291]: man sah dâ in dem wale
    - l[n=3292]: manigen schilt verhowen.
    - l[n=3293]: dâ mohten man scowen
    - l[n=3294]: di kriechischen recken
    - l[n=3295]: mit den scarfen ecken
    - l[n=3296]: di helme verscrôten.
    - l[n=3297]: si frumeten manigen tôten
    - l[n=3298]: dem rîchem kuninge Dario,
    - l[n=3299]: der vil starke clagete dô,
    - l[n=3300]: daz er ze Kriechlande
    - l[n=3301]: nâh deme zinse ie gesande.
    - l[n=3302]: Der Persen kuninc hêre,
    - l[n=3303]: der vil grôzir êre
    - l[n=3304]: wielt ubir manich rîche,
    - l[n=3305]: der trûrte grôzlîche,
    - l[n=3306]: daz der wunderlîche man
    - l[n=3307]: durh sîn laster ûz quam.
    - l[n=3308]: daz begunder sêre clagen
    - l[n=3309]: wander sah in den walphade
    - l[n=3310]: manigen helt gûten
    - l[n=3311]: beflozzen mit dem blûte,
    - l[n=3312]: sîne tûrlîchen recken,
    - l[n=3313]: di ime dâ vore dicke
    - l[n=3314]: hulfen sîner êren.
    - l[n=3315]: sint niemer mêre
    - l[n=3316]: ne wart Darius frô,
    - l[n=3317]: daz bûch sagit uns alsô,
    - l[n=3318]: wande dâ viel manic man,
    - l[n=3319]: der nie wunde ne gwan
    - l[n=3320]: von stiche noh von slage.
    - l[n=3321]: 'ih wil û wêrlîchen sagen:'
    - l[n=3322]: si wâren gûte knehte
    - l[n=3323]: und sturben durh ir vehten
    - l[n=3324]: in Darien halbe.
    - l[n=3325]: dô man si gezalde,
    - l[n=3326]: zwei hundirt tûsunt der was,
    - l[n=3327]: der nie nehein ne gnas;
    - l[n=3328]: ân di, di in den Strâge
    - l[n=3329]: 'ouh vertrunken lâgen:'
    - l[n=3330]: der ne mohte man neheine zale
    - l[n=3331]: gescrîben noch gesagen wale.
    - l[n=3332]: Alse Darius gesah,
    - l[n=3333]: daz sîner sô vil tôt lah,
    - l[n=3334]: beide gewunt und irslagen,
    - l[n=3335]: dô begunder irzagen.
    - l[n=3336]: er was der êriste man,
    - l[n=3337]: der dâ flîhen began.
    - l[n=3338]: des gewan sîn her grôz
    - l[n=3339]: vil michelen untrôst.
    - l[n=3340]: si fluhin al gemeine,
    - l[n=3341]: man mah noh hûte weinen
    - l[n=3342]: den mort, der dâ gescach.
    - l[n=3343]: Alexander reit in alliz nâh.
    - l[n=3344]: und slûch si nider alsein vê.
    - l[n=3345]: si schrûwen ach unde wê.
    - l[n=3346]: Dô daz mêre dô quam
    - l[n=3347]: ubir alle Persiam,
    - l[n=3348]: daz der kuninc wêre sigelôs,
    - l[n=3349]: dô wart dâ michil untrôst
    - l[n=3350]: ubir alle di lant,
    - l[n=3351]: dâ der kuninc was bekant.
    - l[n=3352]: der jâmer wart dâ vil grôz.
    - l[n=3353]: vil manic sînen genôz
    - l[n=3354]: weinete unde clagete,
    - l[n=3355]: den er verlorn habite.
    - l[n=3356]: der vater weinete sîn kint,
    - l[n=3357]: daz wâren jâmerlîche dinc;
    - l[n=3358]: manic man sînen eidem,
    - l[n=3359]: wande ime was vil leide; -
    - l[n=3360]: di swester irn brûder,
    - l[n=3361]: irn lieben sun di mûter.
    - l[n=3362]: ouh weinte di irn amîs,
    - l[n=3363]: di dâ stille was gehît.
    - l[n=3364]: di frowen weinten irn trût,
    - l[n=3365]: den si minneten ubirlût.
    - l[n=3366]: di man ze manne solde geben,
    - l[n=3367]: der leidete daz leben;
    - l[n=3368]: si weinte alsô sêre
    - l[n=3369]: alse si gehît wêre.
    - l[n=3370]: di jungen an der strâzen,
    - l[n=3371]: dâ si ze spile sâzen,
    - l[n=3372]: di weineten vil sêre
    - l[n=3373]: ir mâge unde ir hêren.
    - l[n=3374]: di kint an den wagen,
    - l[n=3375]: sô si weinen sâgen
    - l[n=3376]: und alse manz in gezalde,
    - l[n=3377]: si weineten alse di alde
    - l[n=3378]: und lebeten âne wunne.
    - l[n=3379]: di mâne unde di sunne
    - l[n=3380]: di verwandelôten ir lieht
    - l[n=3381]: und ne wolden schînen nieht
    - l[n=3382]: und ne wolden niet besehen
    - l[n=3383]: den mort, der dâ was geschên.
    - l[n=3384]: Darius der blôde man
    - l[n=3385]: starke flîhende quam
    - l[n=3386]: von mannen und von mâgen
    - l[n=3387]: ubir den wâc Strâgen
    - l[n=3388]: und sînes heris ein michil teil.
    - l[n=3389]: verlorn heter daz heil.
    - l[n=3390]: er quam ûf sînen sal.
    - l[n=3391]: daz lût weinte ubir al
    - l[n=3392]: und clagete grôzlîchen
    - l[n=3393]: Darium den rîchen.
    - l[n=3394]: ûf sînen estrich er sih warf.
    - l[n=3395]: er clagete, daz er niet ne starb.
    - l[n=3396]: ime wêre lieber der tôt,
    - l[n=3397]: dan er sus wêre gelasterôt.
    - l[n=3398]: er clagete, daz er ie genas,
    - l[n=3399]: "und sprah: 'waz hilfit mir, daz ih was"
    - l[n=3400]: kuninc ubir manige lant,
    - l[n=3401]: di ih selbe bedwanc
    - l[n=3402]: wîlen mit mîner frumicheit.
    - l[n=3403]: zô mîneme dieniste was gereit
    - l[n=3404]: manic lant in dem mere.
    - l[n=3405]: manic dûsint was dere,
    - l[n=3406]: di mir zins gâben
    - l[n=3407]: und mih doh nie gesâgen.
    - l[n=3408]: swâ si gehôrten mînen namen,
    - l[n=3409]: dâ dieneten si mir alle samen.
    - l[n=3410]: nû bin ih verwunnen,
    - l[n=3411]: vil kûme her entrunnen
    - l[n=3412]: von einen kriechischen man.
    - l[n=3413]: von mînen sunden daz leider quam
    - l[n=3414]: und durh mînen ubirmût.
    - l[n=3415]: Ungelucke, waz ir mir leides tût!
    - l[n=3416]: 'Fortuna di ist sô getân:'
    - l[n=3417]: ir schîbe lâzet si umbegân.
    - l[n=3418]: si hilfit den armen, sô si wile,
    - l[n=3419]: den rîchen hât si ze spile;
    - l[n=3420]: umbeloufet ir rat,
    - l[n=3421]: dicke vellet, der dâ vaste saz.'
  - chapter[n=124,rhyme=aa]:
    - head[lg=deu-Latn]: Darius' 4. Brief an Alexander (Friedensangebot)
    - l[n=3422]: Darius sih dô ûf hûb
    - l[n=3423]: unde trôste sînen mût.
    - l[n=3424]: er dihte selbe einen brieb.
    - l[n=3425]: mit sîner hant er in screib.
    - l[n=3426]: er santin Alexandro.
    - l[n=3427]: 'dar ane stunt gescriben sô:'
    - l[n=3428]: "'frô wis unde gesunt,"
    - l[n=3429]: Alexander, zaller stunt.
    - l[n=3430]: iz ist mir nû alsô comen,
    - l[n=3431]: wiltu mir scaden oder fromen,
    - l[n=3432]: des hâstu gûten gwalt.
    - l[n=3433]: mir is dicke gezalt,
    - l[n=3434]: daz iz dem manne wol stât,
    - l[n=3435]: alsime sîn heil vore gât,
    - l[n=3436]: daz er sîne mâze
    - l[n=3437]: an gûten dingen lâze.
    - l[n=3438]: nit ne verhebe du des dih,
    - l[n=3439]: daz du hâs verwunnen mih.
    - l[n=3440]: iz kumet dir rehte.
    - l[n=3441]: nû gedenc ane mîn geslehte
    - l[n=3442]: unde an mînen gwalt.
    - l[n=3443]: swer mir daz hête gezalt,
    - l[n=3444]: daz mir sus solde geschên,
    - l[n=3445]: ih ne hêtis ime niet gejehen,
    - l[n=3446]: wandih ne mohtis niht getrûwen.
    - l[n=3447]: mir mûz nû balde rûwen,
    - l[n=3448]: daz ih unde mîne man
    - l[n=3449]: den kuninc Xersem ie verwan,
    - l[n=3450]: den rîchen unde den frumigen
    - l[n=3451]: und andre manige kuninge,
    - l[n=3452]: ih nam in lant unde gût.
    - l[n=3453]: owî wî wê mir nû daz tût,
    - l[n=3454]: daz ih sol lîden
    - l[n=3455]: den spot von den wîben.
    - l[n=3456]: iedoch sô verwêne ih mih,
    - l[n=3457]: daz du tûst sô kuninclîch,
    - l[n=3458]: swen sô du verwinnes,
    - l[n=3459]: wande du dih wol versinnes,
    - l[n=3460]: di lâzestu sunderlingen
    - l[n=3461]: an dîne gnâde dingen
    - l[n=3462]: und lâzes si dir sîn undertân
    - l[n=3463]: und di lant vor dir hân.
    - l[n=3464]: wiltu alsus mit mir tûn,
    - l[n=3465]: 'des hâstu êre unde rûm:'
    - l[n=3466]: sô gebe ih dir den meisten scaz,
    - l[n=3467]: der mîner forderen was,
    - l[n=3468]: den si zesamene trûgen
    - l[n=3469]: und in der erde grûben.
    - l[n=3470]: der ligit zô Mynjatan,
    - l[n=3471]: ze Susis und ze Batran.
    - l[n=3472]: daz saltu wizzen âne wân,
    - l[n=3473]: daz nie nehein man,
    - l[n=3474]: der ie an diser werlt quam,
    - l[n=3475]: sô vil scazzis gewan.
    - l[n=3476]: 'dar zô vernim noh mêre:'
    - l[n=3477]: ih wil dih machen hêren
    - l[n=3478]: ze Medentrîche ubir daz lant,
    - l[n=3479]: Persiam gebih an dîne hant.
    - l[n=3480]: du maht dih frowen dirre geben
    - l[n=3481]: di wîle di du solt leben.
    - l[n=3482]: dar zô jehen ih dir des siges.
    - l[n=3483]: nû bitte ih al ze spâte frides.'
    - l[n=3484]: Alexander las disen brieb.
    - l[n=3485]: ein furste ime al di wîle riet,
    - l[n=3486]: daz er nême alliz daz
    - l[n=3487]: beide lant unde scaz
    - l[n=3488]: und Darium lieze leben
    - l[n=3489]: und hieze ime wider sîn wîb geben
    - l[n=3490]: und sîne mûter dar zô.
    - l[n=3491]: Alexander sprah dô,
    - l[n=3492]: daz er des nit ne tête,
    - l[n=3493]: wandime des wunder hête,
    - l[n=3494]: ob er si ime sande
    - l[n=3495]: wider heim ze lande,
    - l[n=3496]: ob er si nemen wolde.
    - l[n=3497]: diz sprah er durh di sculde,
    - l[n=3498]: durh andris neheine nôt,
    - l[n=3499]: wander ime dâ vore enbôt,
    - l[n=3500]: er zugis wol ze râte,
    - l[n=3501]: waz er dâ mite tâte.
  - chapter[n=125,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders 4. Brief an Darius (Ablehnung des Friedensangebotes)
    - l[n=3502]: 'Aber sprah Alexander sus:'
    - l[n=3503]: "'ob der kuninc Darius"
    - l[n=3504]: nû ist verwunnen,
    - l[n=3505]: sô nimit mih michel wunder,
    - l[n=3506]: wes er sih noh wil irheben
    - l[n=3507]: oder waz er mir wille geben.
    - l[n=3508]: nû stênt doch an mîner hant
    - l[n=3509]: beide burge unde lant
    - l[n=3510]: 'unde gwant unde scaz:'
    - l[n=3511]: ih mach ime geben michil baz,
    - l[n=3512]: wande velt unde walt
    - l[n=3513]: stêt an mîner gewalt.
    - l[n=3514]: wil er abir vehten
    - l[n=3515]: und mah er sih gerechen,
    - l[n=3516]: gwinnet er danne daz heil,
    - l[n=3517]: sô wirt ime wider âne teil
    - l[n=3518]: wîb, mûter unde kint.
    - l[n=3519]: lêzet er mih danne leben sint,
    - l[n=3520]: sô mûz ime sîn undertân
    - l[n=3521]: und den lîb von sînen gnâden hân
    - l[n=3522]: unde leben nâh sînen gebote.'
    - l[n=3523]: dô îlete danne der bote
    - l[n=3524]: unde reit dannen
    - l[n=3525]: âne fride, doh ungevangen.
  - chapter[n=129,rhyme=aa]:
    - head[lg=deu-Latn]: Alexander zerstört den Palast des Xerxes
    - l[n=3526]: Dan nâh diser botescaf
    - l[n=3527]: Alexander reit an di walstat
    - l[n=3528]: und begrûb sîne tôten,
    - l[n=3529]: und di dâ lâgen in nôten
    - l[n=3530]: gwunt unde mohten genesen,
    - l[n=3531]: den hîz er vil gût wesen,
