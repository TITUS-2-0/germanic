    - l[n=6958]: waz er dar umbe tâte.
    - l[n=6959]: Dô rieten di wîsen,
    - l[n=6960]: di in solden wîsen,
    - l[n=6961]: daz er sih bereite
    - l[n=6962]: und niht langer dâ ne beite
    - l[n=6963]: und begundiz dâr rûmen
    - l[n=6964]: und fûre in di flûmen
    - l[n=6965]: wider heim ze lande.
    - l[n=6966]: dô sprâchen di wîgande,
    - l[n=6967]: 'di stolzen jungelinge:'
    - l[n=6968]: "'ir ne hât zô disen dingen"
