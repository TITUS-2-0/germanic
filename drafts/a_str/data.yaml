    - l[n=6982]: iz wirt in ze scanden,
    - l[n=6983]: daz si in heim hiezen varn.
    - l[n=6984]: der ne geniset nehein barn,
    - l[n=6985]: der dâ wonent innen,
    - l[n=6986]: mûze wirs beginnen.'
    - l[n=6987]: 'Dô sprah der listige man:'
    - l[n=6988]: "'wollet irs mînen rât hân,"
    - l[n=6989]: sô râtih uns daz beste.
    - l[n=6990]: wir sulen dise veste
    - l[n=6991]: mit allen êren lâzen
    - l[n=6992]: und varen unse strâze;
    - l[n=6993]: wande si ist sô vast,
