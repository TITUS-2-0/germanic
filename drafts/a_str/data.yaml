    - l[n=6970]: di ûh daz sprechen tâten,
    - l[n=6971]: di wâren ubile bedâht,
    - l[n=6972]: alse siz ouh hânt fure brâht.
    - l[n=6973]: unse hêre Alexander
    - l[n=6974]: der sol tûn ein ander,
    - l[n=6975]: er sol heizen stûren
    - l[n=6976]: sîn volc zû der mûren.
    - l[n=6977]: wir sîn gûte knehte,
