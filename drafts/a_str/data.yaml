    - l[n=3543]: des wart er in gehôrsam
    - l[n=3544]: unde gesamfte sînen mût.
    - l[n=3545]: er liez in blîben, daz was gût.
    - l[n=3546]: Alsih mich versinnen kan,
    - l[n=3547]: dâ grûben grebere sîne man,
    - l[n=3548]: dâ si zô den stunden
    - l[n=3549]: inne genûc vonden
    - l[n=3550]: guldîner nepphe,
    - l[n=3551]: die ie verborgen heten,
    - l[n=3552]: di ê dâre wâren.
    - l[n=3553]: ouh funden si zwâren
    - l[n=3554]: einen sarc glesen.
    - l[n=3555]: an den bûchen hân ih gelesen,
    - l[n=3556]: er wêre sô scône und sô clâr,
    - l[n=3557]: daz sult ir wizzen vor wâr,
    - l[n=3558]: daz man dar durh wol gesach
    - l[n=3559]: einen tôten, der dar inne lach.
    - l[n=3560]: si besâhen vil garwe
    - l[n=3561]: sîn hâr und sîne varwe
    - l[n=3562]: unde wî er getân was.
