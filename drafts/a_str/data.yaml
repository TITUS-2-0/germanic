    - l[n=7035]: vil manige dare quâmen,
    - l[n=7036]: dô si daz vernâmen.
    - l[n=7037]: di sageten, daz si wisten
    - l[n=7038]: di natûre und di liste
    - l[n=7039]: von edelen gesteine
    - l[n=7040]: grôz unde cleine.
    - l[n=7041]: itislîche jâhen,
    - l[n=7042]: dô si in gesâhen,
    - l[n=7043]: iz wêre ein edele jâchant.
    - l[n=7044]: ein ander sagete zehant,
    - l[n=7045]: iz wêre ein karbunkel.
    - l[n=7046]: der naht ne wêre nie sô tunkel,
    - l[n=7047]: er ne lûhte alsein sterre
    - l[n=7048]: nâh unde verre.
    - l[n=7049]: 'der dritte sprah alsus:'
    - l[n=7050]: "'iz ist ein topatius;'"
    - l[n=7051]: "der vierde: 'ein berillus;'"
    - l[n=7052]: "der funfte: 'ein ônichînus;'"
    - l[n=7053]: "der seste: 'ein ametiste',"
    - l[n=7054]: er kante wol sîne liste.
    - l[n=7055]: "der sibende sprah: 'ih bin gewis,"
    - l[n=7056]: iz sî ein rehter jaspis.'
    - l[n=7057]: "der ahte Sprah: 'er is sô schîr,"
    - l[n=7058]: iz ist ein edele saphîr;'
    - l[n=7059]: "der nûnde: 'ein crisolîtus;'"
    - l[n=7060]: "der zehende: 'ein crisoprassus;'"
    - l[n=7061]: "der eilifte: 'ein bdellius;'"
    - l[n=7062]: "der zwelifte: 'ein sardonius.'"
    - l[n=7063]: sus sprâchen si besunder
    - l[n=7064]: manicfalden wunder.
    - l[n=7065]: doh ne wiste ir neheiner
    - l[n=7066]: di craft von dem steine
    - l[n=7067]: noh sîn geslehte.
    - l[n=7068]: si tâten unrehte,
    - l[n=7069]: daz si solden liegen.
    - l[n=7070]: si wânden betrîgen
    - l[n=7071]: den kuninc listiclîche.
    - l[n=7072]: dô sagete man wêrlîche
    - l[n=7073]: dem hêren Alexanderen
    - l[n=7074]: von einen anderen,
    - l[n=7075]: der wêre ein jude vil alt,
    - l[n=7076]: sîn wîsheit wâre manicfalt,
    - l[n=7077]: und wonete in sînen lande.
    - l[n=7078]: zehant er nâh den sande.
    - l[n=7079]: dô der alte daz vernam,
    - l[n=7080]: dô hiez er, daz man ime gewan
    - l[n=7081]: lûte, di in solden tragen.
    - l[n=7082]: er was sô comen zô sînen tagen,
    - l[n=7083]: daz er niet ne mohte gân.
    - l[n=7084]: daz hattim daz alder getân.
    - l[n=7085]: Dô trûch man den alden
    - l[n=7086]: ze hobe vile balde.
    - l[n=7087]: dô in der kuninc gesach,
    - l[n=7088]: 'dô grûzter in unde sprach:'
    - l[n=7089]: "'mir is gesaget, daz du sîs"
    - l[n=7090]: in vil manigen dingen wîs
    - l[n=7091]: und kunnes manige grôze list,
    - l[n=7092]: und daz du der wîsisten bist
    - l[n=7093]: under dînen genôzen ein.
    - l[n=7094]: nû bescowe rehte disen stein
    - l[n=7095]: unde zeige mir rehte
    - l[n=7096]: sînen art und sîn geslehte
    - l[n=7097]: unde sîne natûre.
    - l[n=7098]: man saget mir, er sî tûre.'
    - l[n=7099]: der jude nam in in di hant.
    - l[n=7100]: schiere heter erkant
    - l[n=7101]: sîn natûre unde sînen art.
    - l[n=7102]: "er sprah: 'nû nist noh nie ne wart"
    - l[n=7103]: nehein sîn gelîche
    - l[n=7104]: in allen ertrîche.
    - l[n=7105]: er is tûre unde gût.
    - l[n=7106]: er gibit harte stolzen mût
    - l[n=7107]: und den alden di jugint.
    - l[n=7108]: er hât vil manige tugint,
    - l[n=7109]: des sal man mir getrouwen.
    - l[n=7110]: ouh muget irz wol scowen,
    - l[n=7111]: wande alsirz selbe habet gesehen,
    - l[n=7112]: sô mûzit ir mir jehen
    - l[n=7113]: der rehten wârheite.'
    - l[n=7114]: dô hîz er ime bereiten
    - l[n=7115]: eine wâge mit sinne
    - l[n=7116]: einehalb dar inne
    - l[n=7117]: legeter den tûren stein,
    - l[n=7118]: manigen guldînen zein
    - l[n=7119]: in di andren scale.
    - l[n=7120]: der stein zucte si ze tale,
    - l[n=7121]: swî swâr sô si wâren;
    - l[n=7122]: daz sagih û zewâren.
    - l[n=7123]: dô hiez er, daz man solde
    - l[n=7124]: mêr legen zô dem golde,
    - l[n=7125]: durh daz man irfunde,
    - l[n=7126]: waz der stein kunde.
    - l[n=7127]: dô sîn gebot was irfolt,
    - l[n=7128]: dô swebete obene daz golt.
    - l[n=7129]: der stein swebite under.
    - l[n=7130]: daz was ein michil wunder.
    - l[n=7131]: 'diz ist doh daz ir merken solt:'
    - l[n=7132]: swaz man legete ûf daz golt,
    - l[n=7133]: daz swebete alliz obene.
    - l[n=7134]: diu scale zouh ie nidene
    - l[n=7135]: mit dem tûren steine.
    - l[n=7136]: er was zemâzen cleine
    - l[n=7137]: alse eines menschen ouge.
    - l[n=7138]: dô hiez der jude tougen
    - l[n=7139]: mit dem golde rûmen
    - l[n=7140]: und legete eine plûmen
    - l[n=7141]: und erde ein cleine
    - l[n=7142]: wider deme steine,
    - l[n=7143]: dâ daz golt ê lac.
    - l[n=7144]: dâ der kuninc zô sach,
    - l[n=7145]: der wîse Alexander
    - l[n=7146]: und manic man ander,
    - l[n=7147]: dâr zouh an der stunde
    - l[n=7148]: di vedere ze grunde
    - l[n=7149]: und di erde, di dâ bî lach.
    - l[n=7150]: ir iegelîcher dô jah
    - l[n=7151]: mannelîch besunder,
    - l[n=7152]: diz wêre ein michel wunder.
    - l[n=7153]: 'Dô sprah der judische man:'
    - l[n=7154]: "'wollent irz rehte verstân,"
    - l[n=7155]: sô hîz got machen
    - l[n=7156]: sus wunderlîche sachen
    - l[n=7157]: 'dem kuninge ze lêren:'
    - l[n=7158]: er irhûb sih grôzer êren.
    - l[n=7159]: ouh sît ir algemeine
    - l[n=7160]: gemanet mit dem steine,
    - l[n=7161]: daz ir ûh nihtis ne verhebet
    - l[n=7162]: al di wîle di ir lebet.
    - l[n=7163]: bewaret ûh von der giricheit,
    - l[n=7164]: wande si machet manige herzeleit.
    - l[n=7165]: wande swer sô giric wille wesen,
    - l[n=7166]: wî mach der imer genesen?
    - l[n=7167]: der lebet mit sorgen
    - l[n=7168]: den âbunt und den morgen,
    - l[n=7169]: wî er des beginne,
    - l[n=7170]: daz er imer gwinne
    - l[n=7171]: alliz, daz ime zô veret,
    - l[n=7172]: daz verslindet er und verzeret
    - l[n=7173]: und ne wirt doh niemer vol.
    - l[n=7174]: er is daz hellische hol,
    - l[n=7175]: daz noh nie ne wart sat
    - l[n=7176]: noh niemer werden ne mac;
    - l[n=7177]: alser gar verslindet,
    - l[n=7178]: swaz in zô gewendet.
    - l[n=7179]: nû sehet, waz is iz dan?
    - l[n=7180]: niwit andirs wan ein cranc man;
    - l[n=7181]: der glîchet dem steine,
    - l[n=7182]: der in der wâgen eine
    - l[n=7183]: sih selben nider druckete
    - l[n=7184]: und daz golt ûf zuckete.
    - l[n=7185]: ir wâret unwîse,
    - l[n=7186]: daz ir daz paradîse
    - l[n=7187]: wândet irvehten.
    - l[n=7188]: doh wolde ûh unse trehten
    - l[n=7189]: lâzen besunder
    - l[n=7190]: scowen sîne wunder.
    - l[n=7191]: doh ne muget ir niemer daz bewaren,
    - l[n=7192]: ir ne mûzet hine varen
    - l[n=7193]: und mûzet verterben
    - l[n=7194]: und wîslîche sterben.
    - l[n=7195]: sô mûzet ir werden
    - l[n=7196]: geminget zô der erden.
    - l[n=7197]: sus soldir hine rûmen.
    - l[n=7198]: sô glîchet ir der plûmen,
    - l[n=7199]: di nider mit der erden ginc,
    - l[n=7200]: dâr si in der wâgen hinc
    - l[n=7201]: unde ûf zuckete den stein.
    - l[n=7202]: nû nist uher nehein,
    - l[n=7203]: er ne habe gehôret rehte
    - l[n=7204]: des steines geslehte,
    - l[n=7205]: sîne lîhte und sîne swâre
    - l[n=7206]: beide vil offinbâre.
    - l[n=7207]: 'Nû merket, waz ih û kunden:'
    - l[n=7208]: ir sult von uheren sunden
    - l[n=7209]: ûh schiere bekêren
    - l[n=7210]: unde sult êren
    - l[n=7211]: in allen uheren herzen got
    - l[n=7212]: unde leistet gerne sîn gebot.
    - l[n=7213]: ir sult in minnen
    - l[n=7214]: mit allen uheren sinnen,
    - l[n=7215]: der ûh gewerden hiez
    - l[n=7216]: unde ûh biz here lîz
    - l[n=7217]: von sînen gnâden leben
    - l[n=7218]: und der ûh allen hât gegeben
    - l[n=7219]: sin unde wîstum,
    - l[n=7220]: êre unde rîchtûm
    - l[n=7221]: unde lûte unde lant.
    - l[n=7222]: nû stêt an uheris hêren hant,
    - l[n=7223]: der hie gagenwortich is,
    - l[n=7224]: des sît ir alle gwis,
    - l[n=7225]: manich kunincrîche.
    - l[n=7226]: nû merkit al glîche,
    - l[n=7227]: swaz er hât oder kan.
    - l[n=7228]: sô nist er niwit wene ein man,
    - l[n=7229]: sô mûz er verterben
    - l[n=7230]: 'und ze jungist sterben:'
    - l[n=7231]: er mach imer niwit leben.
    - l[n=7232]: waz hilfit ime sîn lange streben?
    - l[n=7233]: ze lest mûz er doh werden
    - l[n=7234]: gemischet zô der erden.
    - l[n=7235]: diz merke ouh, Alexander,
    - l[n=7236]: noh mêr dan ein ander,
    - l[n=7237]: unde lidige von freisen
    - l[n=7238]: wituwen unde weisen,
    - l[n=7239]: und kêre dîn gemûte
    - l[n=7240]: an allirslahte gûte,
    - l[n=7241]: sô dir begrîfe der tôt,
    - l[n=7242]: daz dih lidige von der nôt
    - l[n=7243]: got von himelrîche
    - l[n=7244]: und dih in sîn rîche
    - l[n=7245]: mit sînen holden bestate,
    - l[n=7246]: und sîner gnâde dih gesate.'
    - l[n=7247]: Dô dise wîslîche wort
    - l[n=7248]: der kuninc hete gehôrt,
    - l[n=7249]: dô teter hêrlîchen
    - l[n=7250]: und gab grôzlîchen
    - l[n=7251]: dem alden und mit sinnen,
    - l[n=7252]: und santin mit minnen
    - l[n=7253]: mit êren âne scande
    - l[n=7254]: wider heim ze lande,
    - l[n=7255]: und dâhte an sîne lêre
    - l[n=7256]: sint vorder mêre,
    - l[n=7257]: di wîle er hete den lîb,
    - l[n=7258]: und êrete man unde wîb
    - l[n=7259]: baz dan er dar vore tete,
    - l[n=7260]: und wandelte sîne site
    - l[n=7261]: unde sîn gemûte
    - l[n=7262]: in allirslahte gûte
    - l[n=7263]: und plach gûter mâzen.
    - l[n=7264]: ouh begunder lâzen
    - l[n=7265]: urlôge und giricheit
    - l[n=7266]: und was mit zuhten gemeit,
    - l[n=7267]: unde berihte sîn rîche
    - l[n=7268]: vil hêrlîche
    - l[n=7269]: niwit langer wene zwelif jâr.
    - l[n=7270]: daz sult ir wizzen vor wâr.
  - chapter[n=288,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders Tod
    - l[n=7271]: dô wart ime vergeben.
    - l[n=7272]: sint ne mohter niwit leben,
    - l[n=7273]: wandime sîn houbit gare zespielt.
    - l[n=7274]: niwit mêr er behîlt
    - l[n=7275]: allis des er ie beranc,
    - l[n=7276]: wene erden siben vôze lanc,
    - l[n=7277]: alse der armiste man,
    - l[n=7278]: der in die werlt ie bequam.
  - chapter[n=Epil.,rhyme=aa]:
    - head[lg=deu-Latn]: Epilog
    - l[n=7279]: Nû ist diz liet ze ende comen.
    - l[n=7280]: alle di iz habet vernomen,
    - l[n=7281]: beide man unde wîb,
    - l[n=7282]: denket an den êwigen lîb
    - l[n=7283]: und an daz êwige leben.
    - l[n=7284]: dar nâh sult ir imer streben.
    - l[n=7285]: lâzet alle giricheit
    - l[n=7286]: und habet imer arbeit
    - l[n=7287]: umbe daz himelrîche.
    - l[n=7288]: got der ist sô rîche,
    - l[n=7289]: er mach û wol gelônen
    - l[n=7290]: mit der himelischen crônen.
    - l[n=7291]: bûzet uher sunden,
    - l[n=7292]: wande ir ne wizzit niwit di stunden,
    - l[n=7293]: daz ir hine sult varn.
    - l[n=7294]: durh daz sult ir ûh bewarn
    - l[n=7295]: di wîle, di ir hie sît,
    - l[n=7296]: und vorhten got in alle zît,
    - l[n=7297]: daz ir mit froweden mûzet varn
    - l[n=7298]: zô der himelischen scaren
    - l[n=7299]: beide hêren unde frowen,
    - l[n=7300]: und ir dâ mûzet scowen
    - l[n=7301]: und haben daz êwige lôn
    - l[n=7302]: deum deorum in Syon.
