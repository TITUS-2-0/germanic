    - l[n=6815]: si wolden mit ime blîben
    - l[n=6816]: ze tôde und ze lîbe.
    - l[n=6817]: Dô fûren si mit sorgen
    - l[n=6818]: den âbunt und den morgen
    - l[n=6819]: und irliden manige grôze nôt.
    - l[n=6820]: vil dicke sâgen si den tôt
    - l[n=6821]: vor irn ougen gereit.
    - l[n=6822]: manic recke gemeit
    - l[n=6823]: lebete dâ mit pînen.
    - l[n=6824]: Alexander hiez dô sînen,
    - l[n=6825]: daz si balde fûren
    - l[n=6826]: unde er lide rûren.
    - l[n=6827]: dô wart dâ manic wârer helit
    - l[n=6828]: genôtet und gequelet,
    - l[n=6829]: wande si rûeten unde schielden,
    - l[n=6830]: daz si den lîb behielden.
    - l[n=6831]: swanne ze grôz was ir nôt
    - l[n=6832]: und si wânden wesen tôt,
