    - l[n=1334]: di tâten ime scaden mâren.
    - l[n=1335]: di porte hete drî turme;
    - l[n=1336]: dâ geschît er abe mit zurne,
    - l[n=1337]: wandime dâ leides vil gescach.
    - l[n=1338]: mit sînen fursten er dô sprah
    - l[n=1339]: und nam iren heimlîchen rât,
    - l[n=1340]: wî er gehandelte di tât.
    - l[n=1341]: "er sprach: 'nû râtent mir, des ist zît,"
    - l[n=1342]: 'wandir vil wîse lûte sît:'
    - l[n=1343]: nement nû dise di uberin hant,
    - l[n=1344]: sô spottet man unser in daz lant.'
    - l[n=1345]: Ime rieten sîne fursten,
    - l[n=1346]: di ime râten tursten,
    - l[n=1347]: daz er sante ubir sê
    - l[n=1348]: und lieze heris comen mê
    - l[n=1349]: und hieze mangen rihten
    - l[n=1350]: und tête di turme brechen
    - l[n=1351]: mit sturmes gewalt.
    - l[n=1352]: schiere wurden dâ gestalt
    - l[n=1353]: zwô und sibinzich mangen
    - l[n=1354]: mit hurden wol behangen,
    - l[n=1355]: gemannet unde geseilet.
    - l[n=1356]: di wurden in drî geteilet
    - l[n=1357]: und wurden getriben zô der burch.
    - l[n=1358]: dô wâre dâ eines friden durht.
    - l[n=1359]: in di burch wurfen si dô
    - l[n=1360]: beide spâte unde frô
    - l[n=1361]: kriechisc fûr unde wite,
    - l[n=1362]: 'daz was Alexandris site:'
    - l[n=1363]: kriechisc fûr cunder wirken
    - l[n=1364]: und ne liez daz niemanne merken,
    - l[n=1365]: von wilhen listen daz quam,
    - l[n=1366]: daz iz in den wazzere bran.
    - l[n=1367]: daz warf er în zô der burh.
    - l[n=1368]: dâ mite branter di turme durh
    - l[n=1369]: und manigen vil herten stein.
    - l[n=1370]: dô ne bleib der burgêre nehein,
    - l[n=1371]: si ne môsten von den zinnen gân,
    - l[n=1372]: wande si ne tursten dâ niwit langer stân
    - l[n=1373]: vor des fûris forhten.
    - l[n=1374]: Alexander dranc zô der porten,
    - l[n=1375]: mit nîde er si der nider brach.
    - l[n=1376]: sîner helede vil dâ tôt lach.
    - l[n=1377]: ime wâre doch leides me geschît,
    - l[n=1378]: ne forhten si daz fûr nit
    - l[n=1379]: unde maniger mangen worf.
    - l[n=1380]: sô solde ime ouh di burh
    - l[n=1381]: wesen vil tûre,
    - l[n=1382]: ne hêter si mit den fûre
    - l[n=1383]: und mit den mangen nit bestân.
    - l[n=1384]: daz sult ir wizzen âne wân.
    - l[n=1385]: 'Alexander wolde sih vollen rechen:'
    - l[n=1386]: er hîz di turme nider brechen,
    - l[n=1387]: di daz fûr hete verlâzen.
    - l[n=1388]: der rîchestin burgêre, di dar inne sâzen,
    - l[n=1390]: hîz er drî dûsint fâhen
    - l[n=1391]: und blinden unde hâen
    - l[n=1392]: wider sînen fursten drîn,
    - l[n=1393]: di er sante dar în.
    - l[n=1394]: des siges, des er dâr nam,
    - l[n=1395]: wêre er ein wol bedâht man,
    - l[n=1396]: er ne wurdis niemer frô;
    - l[n=1397]: wandiz gescah ime alsô,
    - l[n=1398]: daz ime mê lûte tôt bleip,
    - l[n=1399]: des sagen ih û di wârheit,
    - l[n=1400]: dan der in Tyro wâre
    - l[n=1401]: geste oder burgêre.
    - l[n=1402]: Zestôret lach dô Tyrus.
    - l[n=1403]: di stifte sint der kuninc Apollonius,
    - l[n=1404]: von dem di bûch sagent noh,
    - l[n=1405]: den der kuninc Antioch
    - l[n=1406]: ubir mere jagete,
    - l[n=1407]: wander ime sagite
    - l[n=1408]: ein rêtisle mit forhten.
    - l[n=1409]: daz was mit bedecketen worten
    - l[n=1410]: gescriben in einen brief,
    - l[n=1411]: daz er sînes selbes tohter beslief.
    - l[n=1412]: ouh ist Tyrus di selbe stat,
    - l[n=1413]: dâr Chananea unsen hêren bat,
    - l[n=1414]: daz er si getrôste
    - l[n=1415]: und ir tobter lôste
    - l[n=1416]: mit sîner volleiste
    - l[n=1417]: von den ubilen geiste.
    - l[n=1418]: dâ gewerte si unser hêre
    - l[n=1419]: durh sînes selbes êre
    - l[n=1420]: unde machete dâ zestunt
    - l[n=1421]: ir tohter gesunt.
  - chapter[n=43a,rhyme=aa]:
    - head[lg=deu-Latn]: Darius fragt nach Alexanders Aussehen
    - l[n=1422]: Dô cunte Dario ein man,
    - l[n=1423]: der ûz von Tyren entran,
    - l[n=1424]: wî der kuninc Alexander
    - l[n=1425]: hête in sînen lande
    - l[n=1426]: sîne lûte gevangen,
    - l[n=1427]: geblindet und irhangen
    - l[n=1428]: und gewôstet sîn lant
    - l[n=1429]: unde daz ouh wêre verbrant
    - l[n=1430]: Tyrus unde lêge in colen;
    - l[n=1431]: und er daz laster wolde dolen,
    - l[n=1432]: dar umbe mohter sih gescame
    - l[n=1433]: sînes kuninclîchen namen,
    - l[n=1434]: daz er in mit gelfe
    - l[n=1435]: niwit ze helfe
    - l[n=1436]: schîre ne quême,
    - l[n=1437]: dô er ir nôt vernâme.
  - chapter[n=45,rhyme=aa]:
    - head[lg=deu-Latn]: Darius' 1. Brief an Alexander (Geschenke)
    - l[n=1438]: Der rîche kuninc Darius
    - l[n=1439]: 'der antworte ime alsus:'
    - l[n=1440]: "'der kûne Alexander"
    - l[n=1441]: der tût als ein tumber
    - l[n=1442]: unde alse ein kindischer man,
    - l[n=1443]: der sih versinnen nit ne kan.
    - l[n=1444]: daz wirt vil lîhte sîn val,
    - l[n=1445]: wander dar umbe sal
    - l[n=1446]: sîne êre verliesen
    - l[n=1447]: oder den bitteren tôt kiesen,
    - l[n=1448]: er ne vare schiere wider heim.'
    - l[n=1449]: doh wart er des inein,
    - l[n=1450]: dô er gienc ze râte,
    - l[n=1451]: daz er ime sante drâte
    - l[n=1452]: einen guldînen bal
    - l[n=1453]: scône unde sinewal.
    - l[n=1454]: ouh santer ime zehant
    - l[n=1455]: zwêne hêrlîche scûchbant
    - l[n=1456]: und ein lutzil goldis in einer laden.
    - l[n=1457]: er wânde, daz er ime gescaden
    - l[n=1458]: mit nihte ne mohte,
    - l[n=1459]: biz daz erz besûhte.
    - l[n=1460]: und hîz von disen drîn sachen
    - l[n=1461]: einen brief machen,
    - l[n=1462]: der ime rehte bescheinte,
    - l[n=1463]: waz dise gâbe meinte.
    - l[n=1464]: Mit dem balle meinter daz,
    - l[n=1465]: daz ime gezême michilis baz,
    - l[n=1466]: daz er mit anderen kinden
    - l[n=1467]: des balles spilen gienge,
    - l[n=1468]: dan er sîne lûte vienge
    - l[n=1469]: und di slûge oder hienge.
    - l[n=1470]: dar zô meinten die scûchbant,
    - l[n=1471]: di er ime ouh hete gesant,
    - l[n=1472]: daz ime Alexander
    - l[n=1473]: und dar zô manic ander
    - l[n=1474]: tagelîch dienen solde,
    - l[n=1475]: alsô vil sô er wolde.
    - l[n=1476]: ouh meinte daz golt,
    - l[n=1477]: daz ir vil rehte merken sult,
    - l[n=1478]: daz sîn vater wêre
    - l[n=1479]: sîn rehter cinsêre,
    - l[n=1480]: und daz er ouh solde
    - l[n=1481]: leben mit dem golde,
    - l[n=1482]: biz daz er heim quême,
    - l[n=1483]: und niemanne niht ne nême
    - l[n=1484]: und ouh schiere heim rite,
    - l[n=1485]: und ob er iwit lange bite
    - l[n=1486]: oder tâte wider sînen willen,
    - l[n=1487]: er hieze in mit besemen villen.
    - l[n=1488]: Dô Alexander den brieb gelas,
    - l[n=1489]: vil harte ummêre ime was,
    - l[n=1490]: daz er in mit besemen wolde slân.
    - l[n=1491]: sîne boten hiez er alle hân.
    - l[n=1492]: 'der boten einer zô ime sprah:'
    - l[n=1493]: "'hêre, ne tût uns nehein ungemach;"
    - l[n=1494]: wande daz ne wâre niwit reht,
    - l[n=1495]: swâ sihein uher kneht
    - l[n=1496]: uher botescaft tribe,
    - l[n=1497]: daz er dar umbe tôt blibe.
    - l[n=1498]: ne schendet niwit uheren namen.
    - l[n=1499]: wir jehen û alle samen,
    - l[n=1500]: daz under disen kuningen allen
    - l[n=1501]: neheiner mach zô û gevallen,
    - l[n=1502]: der mit sulher frumicheite
    - l[n=1503]: sîn here ubir lant leite,
    - l[n=1504]: alsir, hêre kuninc, tût.
    - l[n=1505]: nû bedwingit uheren mût
    - l[n=1506]: unde habit unsir mâze.
    - l[n=1507]: wî torste wir lâzen,
    - l[n=1508]: daz unser hêre uns gebôt,
    - l[n=1509]: durh siheiner slahte nôt! '
    - l[n=1510]: Alexander bedâhte sih,
    - l[n=1511]: den boten wart er gnêdich.
    - l[n=1512]: er ne weiz in niwit durh di scult,
    - l[n=1513]: er gab in wider daz selbe golt,
    - l[n=1514]: daz ime von Dario quam.
    - l[n=1515]: "er sprah: 'vil ubile daz gezam,"
    - l[n=1516]: daz mich drowete zeslân
    - l[n=1517]: Darius uher hêre,
    - l[n=1518]: 'waz sol der rede mêre:'
    - l[n=1519]: er ist ein unversunnen man.
    - l[n=1520]: er hât glîche getân
    - l[n=1521]: alse der blôde hovewart.
    - l[n=1522]: 'sulih ist sîn art:'
    - l[n=1523]: swenner nahtes iht vernemet,
    - l[n=1524]: durh sîne blôdicheit wirt er irgremet,
    - l[n=1525]: er ne tar dar nâher comen niet,
    - l[n=1526]: al bellender flîhet.
    - l[n=1527]: alsô hât Darius getân.
    - l[n=1528]: er ne tar mir niemer bestân,
    - l[n=1529]: wander ist ein tumber.
    - l[n=1530]: er zuckit sih in einen cumber,
    - l[n=1531]: dâ er nit ûz ne mac comen.
    - l[n=1532]: sînen brieb hân ih wol vernomen.
    - l[n=1533]: diu gâbe ein ander meinet,
    - l[n=1534]: dan mir der brief bescheinet.
  - chapter[n=46,rhyme=aa]:
    - head[lg=deu-Latn]: Alexanders 1. Brief an Darius (Auslegung der Geschenke)
    - l[n=1535]: Den bal hât er mir gesant,
    - l[n=1536]: dâ mite hât er mir bekant,
    - l[n=1537]: daz iz alliz an mir sol stân,
    - l[n=1538]: daz der himel hât umbevân;
    - l[n=1539]: und ih hêre sule werden
    - l[n=1540]: noh an diser erden
    - l[n=1541]: ubir alle di rîche,
    - l[n=1542]: di sint in ertrîche,
    - l[n=1543]: unde ubir alle di lant,
    - l[n=1544]: di ie wurden genant.
    - l[n=1545]: Er sante mir ouh zwê schûhbant.
    - l[n=1546]: dâ mite hât er mir becant
    - l[n=1547]: daz er sih mir ze eigene wil geben
    - l[n=1548]: und mit mînen gnâden leben
    - l[n=1549]: und mîn dienist wille sîn
    - l[n=1550]: zallen herverten mîn.
    - l[n=1551]: mit dem golde, daz ir mir habet brâht,
    - l[n=1552]: dâ mite hât er gedâht,
    - l[n=1553]: daz mir eineme daz gezeme,
    - l[n=1554]: daz ih den zins von ime neme
    - l[n=1555]: und ouh alle erdische lant
    - l[n=1556]: bedwinge zô mîner hant.'
    - l[n=1557]: Diz screib Alexander dô
    - l[n=1558]: und santiz Dario
    - l[n=1559]: und embôt ime dâ mite,
    - l[n=1560]: daz er noh drî mânede bite;
    - l[n=1561]: er ne woldiz niwit lengen,
    - l[n=1562]: zehenzic tûsint wolder bringen
    - l[n=1563]: ubir daz wazzer Eufraten
    - l[n=1564]: vor di mêre Babylonien.
    - l[n=1565]: "(er sprah): 'sint daz er zinsis von mir geret,"
    - l[n=1566]: er wirt is aldâ gewert
    - l[n=1567]: mit sô getâner mâzen,
    - l[n=1568]: daz er mir mûz lâzen
    - l[n=1569]: ze phande sîn houbit,
    - l[n=1570]: oder ih werde beroubit
    - l[n=1571]: mînes lîbes und mîner manne.
    - l[n=1572]: und ob ih zagelîche danne
    - l[n=1573]: von dem volcwîge flîhe,
    - l[n=1574]: sô gelobe ih, daz mir geschie
    - l[n=1575]: dane vorder niemer mêre
    - l[n=1576]: frowede, gût noh êre.
    - l[n=1577]: alsus wil itz bestân.'
    - l[n=1578]: unde alse Dario der brieb quam
    - l[n=1579]: und er in gelas,
    - l[n=1580]: alse dâ gescriben was,
    - l[n=1581]: zornlîche er ûf fûr.
    - l[n=1582]: 'bi sîneme rîche er swôr:'
    - l[n=1583]: "'iz werde ze scanden"
    - l[n=1584]: dem tumben Alexandren,
    - l[n=1585]: daz er mich ie beschalt.
    - l[n=1586]: er ist worden ze balt.
    - l[n=1587]: er ne gewinnit is niemer fromen,
    - l[n=1588]: daz er ie getorste comen
    - l[n=1589]: durh mîn laster in mîn lant.
    - l[n=1590]: des sol er werden gescant,
    - l[n=1591]: sô daz erz niemer mêr ne getû,
    - l[n=1592]: wander irhebet sih ze frû.'
  - chapter[n=47,rhyme=aa]:
