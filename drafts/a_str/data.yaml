    - l[n=2827]: 'er sprah ze Alexandre:'
    - l[n=2828]: "'ih bin Darien man"
    - l[n=2829]: und hân ime dicke getân
    - l[n=2830]: manic dienist scône.
    - l[n=2831]: des ist mir ungelônet.
    - l[n=2832]: durh daz vernem, waz ih dir sagen.
    - l[n=2833]: wiltu is mînen rât haben
    - l[n=2834]: und wiltus mir wol lônen,
    - l[n=2835]: alsih mih zô dir verwênen,
    - l[n=2836]: mit helfe dîner manne
    - l[n=2837]: bringih in dir gevangen
    - l[n=2838]: 'und sîne fursten dâ mite:'
    - l[n=2839]: sint mahtu imer sîn mit fride.'
    - l[n=2840]: 'Alexander antworte ime sân:'
    - l[n=2841]: "'niht ne gerent mîne man"
    - l[n=2842]: dînere helfe.
    - l[n=2843]: sint du ân nôt selbe
    - l[n=2844]: dîne hêren wilt verrâten,
    - l[n=2845]: di dir dike liebe tâten,
    - l[n=2846]: sô vare mit unêren
    - l[n=2847]: wider zô dînen hêren
    - l[n=2848]: und hilf ime weren sîn lant,
    - l[n=2849]: iz wirt dir ze lastere bewant.
    - l[n=2850]: dir ne sulen hêren noh frowen
    - l[n=2851]: niemer mêr getrûwen.'
  - chapter[n=108,rhyme=aa]:
    - head[lg=deu-Latn]: Darius' 3. Brief an Alexander (Sorge um seine Familie/ Drohungen)
    - l[n=2852]: Dô quam DarIo ein brieb,
    - l[n=2853]: der ne was ime niwit lieb,
    - l[n=2854]: 'dô er in ubirlas:'
    - l[n=2855]: daz der strît irgangen was,
    - l[n=2856]: daz stunt dar inne gescriben
