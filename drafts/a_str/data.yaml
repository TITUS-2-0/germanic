    - l[n=6859]: und ne mohten nehein ende
    - l[n=6860]: an der steinwende
    - l[n=6861]: nêren gevinden.
    - l[n=6862]: doh quam daz ingesinde
    - l[n=6863]: ubir lanc zeiner ture.
