    - l[n=3645]: und swere dir mit eiden,
    - l[n=3646]: daz nie nehein man
    - l[n=3647]: bezzer ros ne gwan
    - l[n=3648]: noh bezzere wâfen.
    - l[n=3649]: du ne salt des niwit lâzen,
    - l[n=3650]: du sules mir bereite wesen.
    - l[n=3651]: sô du den brieb hâs gelesen,
