    - l[n=5468]: ih ne wolde in niwit wecke.
    - l[n=5469]: gezogenlîche ih ime neich.
    - l[n=5470]: den hôen berc ih dô steich
    - l[n=5471]: vil gemechlîche nider
    - l[n=5472]: und quam zô mînen lûten wider.
  - chapter[n=228,rhyme=aa]:
    - head[lg=deu-Latn]: Alexander bei freundlichen Wilden
    - l[n=5473]: Dô ih nider quam ze tale,
    - l[n=5474]: dô fôre wir rehte drî tage
    - l[n=5475]: unde quâmen in ein lant,
    - l[n=5476]: daz was Brasiacus genant.
    - l[n=5477]: der kuninc von dem lande
    - l[n=5478]: sîne gâbe mir sande.
    - l[n=5479]: ouh brâhten mir di lantlûte
    - l[n=5480]: rûhe vischis hûte
    - l[n=5481]: zesamene gebunden.
    - l[n=5482]: an den hûten stunden
    - l[n=5483]: scône liebarten mâl.
    - l[n=5484]: ouh brâhten si mir, daz is wâr,
    - l[n=5485]: 'vil manige lamprîden hût:'
    - l[n=5486]: ih tar iz wol sagen ubirlût,
    - l[n=5487]: si wâren sehs clâftere lanc.
    - l[n=5488]: der gâbe sagetih in danc.
  - chapter[n=180w,rhyme=aa]:
    - head[lg=deu-Latn]: '(Wiederholung: Alexander am Ende der Welt)'
    - l[n=5489]: Daz lant liez ih mit fride stân.
    - l[n=5490]: dannen hûb ih mih sân
    - l[n=5491]: mit mînen ingesinde
    - l[n=5492]: der werlt an daz ende,
    - l[n=5493]: dâ der werlt nabe stât
    - l[n=5494]: und der himel umbe gât,
    - l[n=5495]: alse umbe die ahsen daz rat.
    - l[n=5496]: dô hôrtih, wâ man sprah,
    - l[n=5497]: ouh hôrtiz mîn here,
    - l[n=5498]: kriechische sprâche in dem mere.
    - l[n=5498a]: des wunderte uns ûzer mâzen.
    - l[n=5498b]: mîne man sih des vermâzen,
    - l[n=5498c]: si wolden swemmen in daz mere,
    - l[n=5499]: rehte zwênzich wâren dere.
    - l[n=5500]: wande si wunder habeten,
    - l[n=5501]: wâ di lûte woneten,
    - l[n=5502]: di si hôrten dar inne
    - l[n=5503]: 'mit menschlîcher stimme:'
    - l[n=5505]: si wolden swimmen ûf einen wert.
    - l[n=5506]: daz wart in starke bewert
    - l[n=5507]: von den tieren in dem mere.
    - l[n=5508]: daz wunder scowete mîn here,
    - l[n=5509]: wâ di zwêncich an der stunt
    - l[n=5510]: sunken an des meres grunt.
  - chapter[n=184,rhyme=aa]:
    - head[lg=deu-Latn]: Alexander und Candacis
    - l[n=5511]: In der gegenôte
    - l[n=5512]: stunt ein burg gûte.
    - l[n=5513]: Meroves hîz di burch rîch
