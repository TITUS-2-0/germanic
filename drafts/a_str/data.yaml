    - l[n=2858]: und wer dannen wâre comen
    - l[n=2859]: mit scaden und niht mit fromen;
    - l[n=2860]: unde wî Batran di mêre
    - l[n=2861]: gare beroubit wêre
    - l[n=2862]: und wî sîn mûter und sîn wîb,
    - l[n=2863]: di ime wâren sô der lîb,
    - l[n=2864]: und sîne kint wâren gevangen,
    - l[n=2865]: und wî iz dâ was irgangen,
    - l[n=2866]: daz enboten ime sîne man,
    - l[n=2867]: unde daz iz Alexander hête getân,
    - l[n=2868]: unde hiezen ime clagen
    - l[n=2869]: irn vil michelen scaden;
    - l[n=2870]: unde swanner daz vernême,
    - l[n=2871]: daz er in quême
    - l[n=2872]: schiere ze helfe
    - l[n=2873]: und selbe mit gelfe
    - l[n=2874]: 'rêche sînen anden:'
    - l[n=2875]: er lide grôze scande.
    - l[n=2876]: Darius screib einen brieb dô
    - l[n=2877]: und santin Alexandro.
    - l[n=2878]: dar stunt alsus gescriben an,
    - l[n=2879]: 'alsihz vernomen hân:'
    - l[n=2880]: "'mir ist ze wizzene getân,"
    - l[n=2881]: wî du hâst mîne man
    - l[n=2882]: 'beide gevangen und irslagen:'
    - l[n=2883]: ih ne mac iz langer nit vertragen,
    - l[n=2884]: wandiz mir wê tût.
    - l[n=2885]: ih genidere dînen hômût,
    - l[n=2886]: daz du des ie gedâhtes,
    - l[n=2887]: daz du mir gestrîten mahtes
    - l[n=2888]: und ie torstis gejehen,
    - l[n=2889]: daz du mich woldes sehen
    - l[n=2890]: ûf einen velde mit mînem here.
    - l[n=2891]: mahtu dih mih irwere,
    - l[n=2892]: sô mugen von himele mîne gote
    - l[n=2893]: zô der helle wesen bote.'
    - l[n=2894]: ouh enbôt Darius
    - l[n=2895]: 'Alexandro alsus:'
    - l[n=2896]: "'daz du mîneme gesinde,"
    - l[n=2897]: mînen wîbe und mînen kinden
    - l[n=2898]: unde mîner mûter
    - l[n=2899]: hâs getân ze gûte,
    - l[n=2900]: 'daz hâstu ubile gewant:'
    - l[n=2901]: ih ne weiz dirs nit bezzeren danc,
    - l[n=2902]: wene alse du si hêtis irslagen.
    - l[n=2903]: ih wil dir wêrlîchen sagen,
    - l[n=2904]: ih ne werde niemer dîn frûnt,
    - l[n=2905]: di wîle ih dih weiz gesunt;
    - l[n=2906]: wandih dih von rehte hazzen sol.
    - l[n=2907]: mir ne is niwit wol
    - l[n=2908]: zô dir ze mûte,
    - l[n=2909]: nû scaffe dîne hûte.
    - l[n=2910]: du hâs einen sturm an dîner hant.'
    - l[n=2911]: Alexander der wîgant
    - l[n=2912]: der entfienc disen brieb
    - l[n=2913]: und ne forhtin betalle niet.
