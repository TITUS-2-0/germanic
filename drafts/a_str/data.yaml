    - l[n=3533]: al dâ bleib der hêre junc
    - l[n=3534]: des winteris eine wîle.
    - l[n=3535]: dô gebôt er den sînen,
    - l[n=3536]: daz si brêchen den palas,
    - l[n=3537]: der des kuningis Xersen was.
    - l[n=3538]: der sal der was alsô gût,
    - l[n=3539]: sô nie nehein bezzer gestût
