    - l[n=6782]: unde habet manlîchen mût.
    - l[n=6783]: daz ist di rehte wârheit,
    - l[n=6784]: 'wir haben michil arbeit:'
    - l[n=6785]: nû gehabit lange
    - l[n=6786]: dar ûz an dem lande
    - l[n=6787]: und ouh in disen wâge
    - l[n=6788]: vil michil ungenâde
    - l[n=6789]: irliden lanc stucke.
    - l[n=6790]: geschê uns daz gelucke,
    - l[n=6791]: daz wir mit siheiner wîs
    - l[n=6792]: bedwungen daz paradîs
    - l[n=6793]: und di dâ wonent inne,
    - l[n=6794]: sô solde wir mit sinne
    - l[n=6795]: und ouh mit grôzen êren
    - l[n=6796]: heim ze lande kêren
    - l[n=6797]: und leben frôlîche.
    - l[n=6798]: ih gelobe û trûwelîche,
    - l[n=6799]: mir werde wol oder wê,
    - l[n=6800]: daz ih sint niemer mê
    - l[n=6801]: ne wille mit here
    - l[n=6802]: noh mit schilde noh mit spere
    - l[n=6803]: neheine burg mêr gewinnen
    - l[n=6804]: noh urlûges beginnen.
    - l[n=6805]: sint lâz ihz alliz an daz heil.'
    - l[n=6806]: er nam behalben dô ein teil
    - l[n=6807]: sîner heimlîchen holden,
    - l[n=6808]: mit den er sprehen wolde.
    - l[n=6809]: den sageter vil stille
    - l[n=6810]: allen sînen willen.
    - l[n=6811]: zehant si dâr swôren,
    - l[n=6812]: daz si mit im vollenfûren,
    - l[n=6813]: iz gie ze scaden oder ze fromen,
