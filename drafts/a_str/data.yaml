    - l[n=5515]: si was al umbevangen
    - l[n=5516]: mit eime velse, der was langer.
    - l[n=5517]: di lûte von deme lande
    - l[n=5518]: wâren tûre wîgande
    - l[n=5519]: und lebeten hêrlîche
    - l[n=5520]: und wâren al gelîche
    - l[n=5521]: einer frowen undertân,
    - l[n=5522]: di hîz Gandacia.
    - l[n=5523]: si was ein kuninginne
    - l[n=5524]: und lebete mit sinne.
    - l[n=5525]: zwêne sune hete si.
    - l[n=5526]: dô hîz ih dâ bî
    - l[n=5527]: ûf slân mîn gezelt
    - l[n=5528]: an ein harte scône velt.
    - l[n=5529]: dô enbôt ih der frowen
    - l[n=5530]: mîn dienist mit allen trûwen,
    - l[n=5531]: und santir zô den mâle
    - l[n=5532]: ein bilide wol gemâlet
    - l[n=5533]: nâh Amon mînen gote.
    - l[n=5534]: dô brâhte mir wider ir bote
    - l[n=5535]: vil hêrlîche gâben
    - l[n=5536]: unde hiez mir frâgen,
    - l[n=5537]: ob ih wêre alsein andir man
    - l[n=5538]: und mir wêre undertân
    - l[n=5539]: di werlt alle biz al dâ.
    - l[n=5540]: dô hîz ir sagen jâ.
    - l[n=5541]: Von der gâben wil ih û sagen,
    - l[n=5542]: 'di siu mir hîz vore tragen:'
    - l[n=5543]: hundrit guldîne gote;
    - l[n=5544]: ouh brâhte mir ir bote
    - l[n=5545]: andirhalp hundrit môre,
    - l[n=5546]: di hâten lange ôren
    - l[n=5547]: und wâren alle kinder.
    - l[n=5548]: mînen gesinde
    - l[n=5549]: gab ih si an ir hûte.
    - l[n=5550]: ouh sante mir di gûte
    - l[n=5551]: drîzic gûte goltfaz,
    - l[n=5552]: nûnzich elfande unde baz.
    - l[n=5553]: si sante mir pantêre
    - l[n=5554]: seszich unde mêre
    - l[n=5555]: und hundrit liebarte,
    - l[n=5556]: di dâ loufint harte.
    - l[n=5557]: ouh sante mir di kuningîn
    - l[n=5558]: funf hundrit fugelîn
    - l[n=5559]: sitige unde spingen,
    - l[n=5560]: di sprechent unde singen;
    - l[n=5561]: und hundrit balkin vein.
    - l[n=5562]: nie ne wart holz nehein
    - l[n=5563]: sô gût noh sô tûre.
    - l[n=5564]: iz ne mac in den fûre
    - l[n=5565]: neheine wîs verbrinnen.
    - l[n=5566]: ouh brâhte durh minne
    - l[n=5567]: der selben kuninginnen bote
    - l[n=5568]: Amone mînen gote
    - l[n=5569]: eine crône wol gezieret
    - l[n=5570]: unde harte wol gewieret
    - l[n=5571]: mit edelen gesteine
    - l[n=5572]: grôz unde cleine,
    - l[n=5573]: alsiz di frowe wolde.
    - l[n=5574]: zehen ketenen von golde
    - l[n=5575]: wâren dar ane gehangen.
    - l[n=5576]: dâ mite was bevangen
    - l[n=5577]: di crône hêrlîche.
    - l[n=5578]: di kuninginne rîche
    - l[n=5579]: sante mir ouh ein tier,
    - l[n=5580]: daz was edele unde hêr,
    - l[n=5581]: daz den carbunkel treget
    - l[n=5582]: und daz sih vor di magit leget.
    - l[n=5583]: Monosceros ist iz genant.
    - l[n=5584]: der ist luzzil in diz lant.
    - l[n=5585]: 'dar zô ne frumet nehein jaget:'
    - l[n=5586]: man sol iz vâhen mit einer magit.
    - l[n=5587]: sîn gehurne daz ist freisam,
    - l[n=5588]: dâ ne mac niwit vor bestân.
    - l[n=5589]: und dô di gâbe was brâht,
    - l[n=5590]: dô was di frowe des bedâht,
    - l[n=5591]: daz si zô mir sante einen man,
    - l[n=5592]: der was alsô getân,
    - l[n=5593]: daz er konde mâlen.
    - l[n=5594]: der mâlede zô dem mâle
    - l[n=5595]: an einer tabelen mînen lîb.
    - l[n=5596]: niht nist sô listic, sô daz wîb
    - l[n=5597]: unde ouh ir kint.
    - l[n=5598]: des quam ih in grôz angist sint.
    - l[n=5599]: Candaulus der frowen alder sun
    - l[n=5600]: dâhte, was er mohte tûn.
    - l[n=5601]: er nam sîne wîse man.
    - l[n=5602]: dô er rehte vernam,
    - l[n=5603]: daz ih dare comen was,
    - l[n=5604]: dô volgeter mir an ein gras
    - l[n=5605]: und sûhte mih an daz velt.
    - l[n=5606]: dô lach ih under mîn gezelt.
    - l[n=5607]: dô er bî mînen here quam
    - l[n=5608]: unde mîne wartman
    - l[n=5609]: sîm worden geware,
    - l[n=5610]: dô hûben si sih dare
    - l[n=5611]: und viengen den helt junc
    - l[n=5612]: unde brâhten in zestunt,
    - l[n=5613]: dâr Tholomeus lach.
    - l[n=5614]: der frâgetin unde sprah,
    - l[n=5615]: waz sîn gewerb wêre.
    - l[n=5616]: 'dô sprah der junchêre:'
    - l[n=5617]: "'Candacis is mîn mûter."
    - l[n=5618]: vernim durh dîne gûte
    - l[n=5619]: mîn herzeleit, daz ih dir clagen.
    - l[n=5620]: ih wolde dîne helfe haben.
    - l[n=5621]: ih hân verloren mîn wîb,
    - l[n=5622]: di mir lieb was sô der lîb.
    - l[n=5623]: daz is mir ze unheile comen.
    - l[n=5624]: di frowe di hât mir genomen
    - l[n=5625]: ein kuninc, der is vermezzen
    - l[n=5626]: und ist hie bî gesezzen.
    - l[n=5627]: durh trôst bin ih comen zô dir,
    - l[n=5628]: und mahtu des gehelfen mir,
    - l[n=5629]: daz ih si wider gewinnen,
    - l[n=5630]: des lônih dir mit minnen.'
    - l[n=5631]: Dô Tholomeus mîn man
    - l[n=5632]: des hêren clage vernam,
    - l[n=5633]: dô sweich er vil stille
    - l[n=5634]: und ginc mit gûten willen
    - l[n=5635]: rehte under mîn gezelt,
    - l[n=5636]: dâ ih lach an daz velt,
    - l[n=5637]: und sagete mir, wî iz was comen
    - l[n=5638]: unde waz er hête vernomen.
    - l[n=5639]: dô rihtih mih ûf scône
    - l[n=5640]: und gab ime mîne crône
    - l[n=5641]: unde hiez in sân
    - l[n=5642]: wider in sîn gezelt gân
    - l[n=5643]: und mit sinne handelen sîn dinc.
    - l[n=5644]: "ih sprah: 'dirre jungelinc"
    - l[n=5645]: ne mah dîn niht irkennen;
    - l[n=5646]: Alexander saltu dih nennen
    - l[n=5647]: und jehe des neheine wîs,
    - l[n=5648]: daz du Tholomeus sîs,
    - l[n=5649]: und heiz mih dir gewinnen.
    - l[n=5650]: Antigonus saltu mih nennen
    - l[n=5651]: und gebût mir alse dînen man,
    - l[n=5652]: daz schiere werde widertân
    - l[n=5653]: daz dir hêre hât geclagit.
    - l[n=5654]: alse wir haben hie gesaget,
    - l[n=5655]: daz tû wir mit sinne;
    - l[n=5656]: und heiz mir ime gewinnen
    - l[n=5657]: schîre widere sîn wîb,
    - l[n=5658]: alsô lieb sô mir sî der lîb.'
    - l[n=5659]: Di hêren beide tâten,
    - l[n=5660]: des si wâren berâten.
    - l[n=5661]: Tholomeus di crône entfienc.
    - l[n=5662]: zô sînen gezelde er gienc
    - l[n=5663]: in allen den gebêre,
    - l[n=5664]: alser Alexander wêre.
    - l[n=5665]: nâh Alexandere er sante,
    - l[n=5666]: Antigonus er in nante.
    - l[n=5667]: 'dô sprah er zô Candaulo:'
    - l[n=5668]: "'gehabe dih wol und wis frô,"
    - l[n=5669]: dîn bete wirt geleistet.
    - l[n=5670]: du hâs wol vereischet,
    - l[n=5671]: daz ih Alexander bin genant.
    - l[n=5672]: Macedonia is mîn lant,
    - l[n=5673]: dannen bin ih here comen.
    - l[n=5674]: daz mahtu haben wol vernomen
    - l[n=5675]: Persen ist mir undertân,
    - l[n=5676]: Parthis unde Indiân
    - l[n=5677]: di stênt an mîner gewalt.
    - l[n=5678]: ih wil mit dir, helt balt,
    - l[n=5679]: hinnen senden disen man,
    - l[n=5680]: der dir wol gehelfen kan.
    - l[n=5681]: ih gebe ime heris alsô vile,
    - l[n=5682]: alse er is selbe nemen wile.
    - l[n=5683]: er ist Antigonus genant.
    - l[n=5684]: den fûre in daz selbe lant,
    - l[n=5685]: dâ dîn wîb is inne.
    - l[n=5686]: er veret mit grôzen sinne.
    - l[n=5687]: er gwinnet dir widere dîn wîb
    - l[n=5688]: oder er verlieset den lîb.'
    - l[n=5689]: Dô wânede Candaulus,
    - l[n=5690]: daz mîn man Tholomeus
    - l[n=5691]: Alexander wêre.
    - l[n=5692]: des frowete sih der mêre.
    - l[n=5693]: dô gwan der helt gût
    - l[n=5694]: einen frôlîchen mût,
    - l[n=5695]: daz er sulhe helfe gewan.
    - l[n=5696]: dô gereite sih manic man
    - l[n=5697]: von mînen gesinde.
    - l[n=5698]: dô vôre wir mit dem kinde.
    - l[n=5699]: dô sagete ih vil stille
    - l[n=5700]: mînen lûten mînen willen,
    - l[n=5701]: 'di mih wol irkanten:'
    - l[n=5702]: daz si alle nanten
    - l[n=5703]: mih Antigonus,
    - l[n=5704]: dô iz geahtit was alsus,
    - l[n=5705]: daz verwandelet was mîn name.
    - l[n=5706]: selbe fûrte ih mînen vanen.
    - l[n=5707]: mîn volch ih bereitte.
    - l[n=5708]: Candaulus uns leitte
    - l[n=5709]: ze Bala vor di veste.
    - l[n=5710]: sô getâner geste
    - l[n=5711]: wâren si vil ungewone,
    - l[n=5712]: alsin dô wâren comen.
    - l[n=5713]: ir state slozzen si zô.
    - l[n=5714]: ze râte gingen dô
    - l[n=5715]: di helede vermezzen,
    - l[n=5716]: di dâ wâren besezzen,
    - l[n=5717]: und sprâchen al besunder,
    - l[n=5718]: si nême michil wunder,
    - l[n=5719]: waz daz here wolde
    - l[n=5720]: oder waz iz dâre solde.
    - l[n=5721]: Der kuninc der was ûz gevaren
    - l[n=5722]: mit einer creftigen scharen
    - l[n=5723]: ûf einen sînen genôz.
    - l[n=5724]: dô wart der angist vil grôz,
    - l[n=5725]: di in der stat wâren,
    - l[n=5726]: daz sagih û zwâren.
    - l[n=5727]: dô si in allen sîten
    - l[n=5728]: daz here gesâhen rîten
    - l[n=5729]: ubir di marke,
    - l[n=5730]: dô forhten si starke,
    - l[n=5731]: daz Porus dannoch lebete
    - l[n=5732]: unde dar zô strebete
    - l[n=5733]: mit sînes heres craften.
    - l[n=5734]: in ir mût si dâhten,
    - l[n=5735]: daz er si stôren solde
    - l[n=5736]: unde er lôsen wolde
    - l[n=5737]: di frowe, wande er was ir mâch,
    - l[n=5738]: dar ih was gevarn nâh.
    - l[n=5739]: Nû vernemet rehte, waz ih û sage.
    - l[n=5740]: dar nâh ubir drî tage
    - l[n=5741]: Candaulus mih bat,
    - l[n=5742]: daz wir riten vor di stat,
    - l[n=5743]: dâ di frowe was inne.
    - l[n=5744]: daz tâte wir mit sinne.
    - l[n=5745]: dô wir dar quâmen
    - l[n=5746]: undiz jene vernâmen,
    - l[n=5747]: di in der stat wâren,
    - l[n=5748]: si gingen offinbâre
    - l[n=5749]: an ir zinnen stân
    - l[n=5750]: unde frâgeten uns sân
    - l[n=5751]: von ir brustwere
    - l[n=5752]: umbe daz uncundige here,
    - l[n=5753]: wannen daz comen wêre.
    - l[n=5754]: ouh frâgeten si mêre,
    - l[n=5755]: waz si uns hêten getân
    - l[n=5756]: unde ob wir si bestân
    - l[n=5757]: mit urlûge solden.
    - l[n=5758]: wir sageten, daz wir wolden
    - l[n=5759]: ir stat gare zebrechen
    - l[n=5760]: unde an in rechen
    - l[n=5761]: beide an ir êre und an ir lîb,
    - l[n=5762]: daz si Candaulis wîb
    - l[n=5763]: dar in hêten gevân
    - l[n=5764]: und dar zô sîne liebe man;
    - l[n=5765]: daz ne wurde schiere widertân,
    - l[n=5766]: sô môstens imer scaden hân.
    - l[n=5767]: Dô di burgêre
    - l[n=5768]: vernâmen diz mêre
    - l[n=5769]: und alsiz in di burg quam,
    - l[n=5770]: michil angist si des nam.
    - l[n=5771]: ûf brâchen si daz palas,
    - l[n=5772]: dâ di juncfrowe inne was,
    - l[n=5773]: zô uns santen si nider
    - l[n=5774]: und gâben uns di frowe wider.
    - l[n=5775]: dô lieze wir ir stat stân
    - l[n=5776]: unde fûren dannen sân
    - l[n=5777]: mit hêren Candaulo.
    - l[n=5778]: dem was sîn herze vil frô.
    - l[n=5779]: der sprah offinbâre,
    - l[n=5780]: daz ih des gwis wâre,
    - l[n=5781]: woldih mit ime heim comen,
    - l[n=5782]: ih gwunnis michelen fromen
    - l[n=5783]: von im und von sîner mûter.
    - l[n=5784]: er weste si in den gûten,
    - l[n=5785]: si solde mir mîner arbeit
    - l[n=5786]: mit liebe lônen âne leit.
    - l[n=5787]: Dô enbôt ih Tholemeo,
    - l[n=5788]: daz ih mit Candaulo
    - l[n=5789]: wolde heim ze lande,
    - l[n=5790]: durh daz ih irkande
    - l[n=5791]: unde mit listen irfunde,
    - l[n=5792]: wî iz dâ ze lande stunde,
    - l[n=5793]: und ouh daz ih irsêge,
    - l[n=5794]: wilher site man dâ phlêge.
    - l[n=5795]: dô wir dannen solden rîten,
    - l[n=5796]: des weges in beiden sîten
    - l[n=5797]: di hôisten berge ih gesach,
    - l[n=5798]: mit wârheit ih daz sagen mach,
    - l[n=5799]: dar ie dehein man
    - l[n=5800]: in diser werlt zô quam,
    - l[n=5801]: und di hie an der erden
    - l[n=5802]: ie mohten gewerden.
    - l[n=5803]: dô frâgetih mit listen
    - l[n=5804]: di lûte, diz wol wisten,
    - l[n=5805]: waz ûf den bergen wâre.
    - l[n=5806]: di sageten uffenbâre,
    - l[n=5807]: dar ûf wâren besunder
    - l[n=5808]: 'manicfalde wunder:'
    - l[n=5809]: tier di wâren eislîch,
    - l[n=5810]: und wurme vil freislîch.
    - l[n=5811]: ih sah dâ lange boume,
    - l[n=5812]: 'des nam ih allis goume:'
    - l[n=5813]: daz obiz, daz dar ûf wôchs,
    - l[n=5814]: daz waz sô ummâzlîchen grôz,
    - l[n=5815]: daz ihs nit ne tar sagen.
    - l[n=5816]: ir mohtis uheren spot haben,
    - l[n=5817]: wandiz dûhte û ungeloublîch.
    - l[n=5818]: wintrûbelen di sach ih,
    - l[n=5819]: von den mach ih û sagen,
    - l[n=5820]: di ne mohte ein man niht getragen.
    - l[n=5821]: ouh sah ih dâ nuzze
    - l[n=5822]: grôz und niwit lutzil,
    - l[n=5823]: grôzer si wâren
    - l[n=5824]: danne phedemen zwâren,
    - l[n=5825]: ouh sach ih dâ trachen
    - l[n=5826]: und andre manige sachen
    - l[n=5827]: und manige grôze slange
    - l[n=5828]: grôze unde lange.
    - l[n=5829]: ûf den boumen sâzen affen
    - l[n=5830]: und wilde merekatzin
    - l[n=5831]: und freislîch gefugele,
    - l[n=5832]: daz hete dâ sîn gesidele.
    - l[n=5833]: Vernemet noch mêr, waz ih û sage
    - l[n=5834]: dô wir gefûren funf tage,
    - l[n=5835]: dô sâge wir vor uns stân
    - l[n=5836]: ein burch, di was wol getân
    - l[n=5837]: dar ûf stunt ein palas,
    - l[n=5838]: dâ Candacis inne was,
    - l[n=5839]: di phlac grôzer gûte.
    - l[n=5840]: di was Candaulis mûter.
    - l[n=5841]: dô si hete vernomen,
    - l[n=5842]: daz ir sun was wider comen
    - l[n=5843]: und sîn wîb brâhte,
    - l[n=5844]: 'vil liebe si sih gedâhte:'
    - l[n=5845]: ingagen uns si dô ginc,
    - l[n=5846]: mit grôzen êren si uns entphinc.
    - l[n=5847]: ûf ir houbit si trûc
    - l[n=5848]: eine crône von golde sô gût,
    - l[n=5849]: daz nie nihein man
    - l[n=5850]: neheine bezzere gewan.
