text:
- body:
  - head[lg=deu-Latn]: LXI. NIEDERDEUTSCHER GLAUBEN.
  - pb@edition: 362
  - p:
    - lb@edition[n=1]: Ic kelave in got vader almachigen, in then sceppare thes himeles
    - lb@edition[n=2]: en ther arthen. Ic kelave in sinen enbornen sune usen herren
        thene
    - lb@edition[n=3]: helgen Crist. Ic kelave in thene helgen gest. Ic kelave, that
        the
    - lb@edition[n=4]: thre genenneden the vader en the sune en the helge gest en
        war godhid
    - lb@edition[n=5]: is. Ic kelave, that the sulve godes sune, theter ge was ven
        ambeginne,
    - lb@edition[n=6]: that he gemmer mer wisen scel ane aller stach ende. Ic
    - lb@edition[n=7]: kelave, that the sulve godes sune infangen was ven thene helgen
        geste,
    - lb@edition[n=8]: that he geboren was ven Marien ther ewegen mageth. Ic kelave,
    - lb@edition[n=9]: that he thur use notthrutthe gevangen wart, gebunnen wart,
        bespottet
    - lb@edition[n=10]: wart, gehalslaged wart, gevillet wart, gecrucighet wart, that
    - lb@edition[n=11]: he in then cruce gestarf, mitter mennisgid, niuwet mitter
        godhit.
    - lb@edition[n=12]: Ic kelave, that he begraven wart, that thiu helge siele tu
        ther
    - lb@edition[n=13]: helle vor end thar ut nam alle the thar bevaren sinen willen
    - lb@edition[n=14]: gedaen hadden. Ic kelave, that he thes tredden dages ven thene
    - lb@edition[n=15]: dathe ostonth, war god, war mennesche. Ic kelave, that he
        ahter
    - lb@edition[n=16]: siner ubstannisse at in de drang mit sinen iungheren, us te
        bewarende
    - lb@edition[n=17]: sine waren ubstannisse. Ic kelave, that he hir wunede XL dage
        XL
    - lb@edition[n=18]: nochte als en ander mennische, an that ene, that he ne gesundigede.
    - lb@edition[n=19]:
      - 'Ic kelave, that '
      - supplied[reason=omitted]: he
      - ' thes vertigsten dages tu thene himele vor, et aller'
    - lb@edition[n=20]: there ancie, the ther werthig waren, the the sine uffart scuen
        mosten.
    - lb@edition[n=21]:
      - Ic kelave, that he thar nu seteth te uurtheren han sines vader uses
      - pb@edition: 363
    - lb@edition[n=22]: herren thes aleweldigen godes, ime evenher ende evenweidig.
        Ic kelave,
    - lb@edition[n=23]: that he nacumstich is te domenne en te delenne daden ende
        livende,
    - lb@edition[n=24]: enen gewiliken al na sinen genathen ende na usen werken. Ic
        kelave
    - lb@edition[n=25]: thie helge cerstenhid, menschip ther helgene, oflat miner
        sundene,
    - lb@edition[n=26]: ther ic mikelig habbe en there nu gebot habbe ende sin nuet
        furniet
    - lb@edition[n=27]: nehabbe. Ic kelave, that ic sundige mennische in theme sulven
    - lb@edition[n=28]: live, the ic hir nu scine, sterven scel, wir ubstanden scel,
        gode rithe
    - lb@edition[n=29]: given scel aller there thinge, the ic ge gefrumede, godere
        gif
    - lb@edition[n=30]: uvelere. Ic kelave, that ic then thar lan enfan scel, al na
        thu, thet
    - lb@edition[n=31]: ic fundin werthe te minen iungesten tiden. Ic kelave in that
        ewge
    - lb@edition[n=32]: life, that god sulve is.
