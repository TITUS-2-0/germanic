text:
- body:
  - l[n=1]: Wir suln von lieben dingen sagen
  - l[n=2]: und leider mære gar gedagen,
  - l[n=3]: wan sî tuont wê dem herzen gar.
  - l[n=4]: ich hân alliu mîniu jâr
  - l[n=5]: mit leiden mæren her verzert,
  - l[n=6]: dâ von ich freuden bin behert.
  - l[n=7]: wan guotiu mære machent frô;
  - l[n=8]: diu leiden hânt getân mir sô,
  - l[n=9]: daz ich ir williclîche enbir.
  - l[n=10]: swâ diu wal stât an mir,
  - l[n=11]: dâ wel ich, daz mir rehte kumt
  - l[n=12]: und mich an mînen freuden frumt.
  - l[n=13]: nu ist daz mîn meistez leit,
  - l[n=14]: daz mir diu wal ist gar verseit.
  - l[n=15]: sît mir nieman niht wil sagen,
  - l[n=16]: daz mir von rehte müge behagen,
  - l[n=17]: sô bin aber ich sô wolgemuot,
  - l[n=18]: daz ich vil lieber sage guot,
  - l[n=19]: dan daz mir niht gezæme
  - l[n=20]: und ieman freude næme.
  - l[n=21]: dâ von wil ich ein mære sagen,
  - l[n=22]: daz iu von rehte muoz behagen.
  - l[n=23]: Ein ritter het ein schoene wîp,
  - l[n=24]: diu was im liep als sîn lîp.
  - l[n=25]: 'daz was billîch: ir schoene was'
  - l[n=26]: durchliuhtic als ein spiegelglas;
  - l[n=27]: dar zuo was sî den vollen guot.
  - l[n=28]: swâ ein wîp ist sô gemuot,
  - l[n=29]: daz sî bî schoene güete hât,
  - l[n=30]: der lîp billîch ze loben stât.
  - l[n=31]: diu reine was sô êrbære,
  - l[n=32]: daz ir man kein herzenswære
  - l[n=33]: von den dingen nie gewan;
  - l[n=34]: dâ von mohte er sî gerne hân.
  - l[n=35]: sî was an zühten sô volkomen,
  - l[n=36]: daz nie niht wart von ir vernomen,
  - l[n=37]: daz man für unzuht möhte hân;
  - l[n=38]: dar umb was sî ouch liep ir man.
  - l[n=39]: sî bôt ez sînen friunden wol,
  - l[n=40]: den gesten, als ein frum wîp sol.
  - l[n=41]: ir wirt was an dem lîbe ein man,
  - l[n=42]: daz er was niht sô wolgetân,
  - l[n=43]: als er ez gerne het gesehen.
  - l[n=44]: 'von im wil ich der wârheit jehen:'
  - l[n=45]: er was gerumphen unde klein.
  - l[n=46]: der ritter vor den liuten schein,
  - l[n=47]: als er wær hundert jâr alt;
  - l[n=48]: 'des er doch niht gên ir entgalt:'
  - l[n=49]: er dûhte sî schoene als Absolôn
  - l[n=50]: und sterker danne Sampsôn.
  - l[n=51]: in ir herzen wart nie man,
  - l[n=52]: den sî für in wolte hân.
  - l[n=53]: daz machte ir grôziu frümikeit,
  - l[n=54]: 'daz ander: er was gar bereit'
  - l[n=55]: ze alle diu, daz iemer man
  - l[n=56]: an allen êren mac begân.
  - l[n=57]: daz tet er allez völliclîch,
  - l[n=58]: als ob er wære ein keiser rîch
  - l[n=59]: gewesen und ein der schoenste man,
  - l[n=60]: den al diu werlt ie gewan.
  - l[n=61]: willic sînes muotes,
  - l[n=62]: sînes lîbes, sînes guotes,
  - l[n=63]: was er gar den undertân,
  - l[n=64]: an den er êre solte begân.
  - l[n=65]: dâ von wart sîn unflætikeit
  - l[n=66]: in allen landen hingeleit.
  - l[n=67]: Nu kam ez nâch gewonheit,
  - l[n=68]: daz dem ritter wart geseit
  - l[n=69]: von einem urlouge grôz.
  - l[n=70]: dar fuor vil manic sîn genôz;
  - l[n=71]: dar fuor ouch er durch sînen muot
  - l[n=72]: und tet ez dâ sô rehte guot,
  - l[n=73]: daz man im dâ des prîses jach
  - l[n=74]: für alle die, die man dâ sach
  - l[n=75]: (und wære er dâ heime beliben,
  - l[n=76]: sô müeset ir iuch hân verzigen,
  - l[n=77]: daz ich iu niemer het geseit
  - l[n=78]: von aller sîner frümikeit).
  - l[n=79]: dô er daz beste het getân,
  - l[n=80]: dô muose ouch er aldâ enphân
  - l[n=81]: etelîchez herzenleit,
  - l[n=82]: daz manigem was vil unbereit,
  - l[n=83]: der ze hinderst was dâ bî
  - l[n=84]: (von dem bin ich der sage frî).
  - l[n=85]: ein ouge im ûzgestochen wart
  - l[n=86]: von einem, der sich ûf in spart
  - l[n=87]: al die zît und in dô neit
  - l[n=88]: umbe alle sîne frümikeit.
  - l[n=89]: dem ritter tet sîn smerze wê,
  - l[n=90]: iedoch klagte er daz michels mê,
  - l[n=91]: als er sîn wîp an solte sehen,
  - l[n=92]: daz ir wær leit an im geschehen.
  - l[n=93]: wan ir leit daz was daz sîn,
  - l[n=94]: sîn leit was ouch ir leides pîn.
  - l[n=95]: Siner swester sun der wart
  - l[n=96]: sîn gereise ûf dirre vart;
  - l[n=97]: er was im ouch durch zuht verlân.
  - l[n=98]: den nam er von den liuten dan
  - l[n=99]: 'und sprach: "getriuwer friunt, nu var'
  - l[n=100]: und sage der reinen süezen klâr,
  - l[n=101]: mîn dinc sich habe gefüeget sô,
  - l[n=102]: daz ich sî iemer mêr unfrô.
  - l[n=103]: ich was ê nicht ein flætic man;
  - l[n=104]: nu habe mir got alsô getân,
  - l[n=105]: daz ich mich schame, daz sî billîch,
  - l[n=106]: und welle ouch alliu tiutschiu rîch
  - l[n=107]: rûmen und alliu diu lant,
  - l[n=108]: dâ ich bî namen bin bekant.
  - l[n=109]: und sage der süezen, daz ir bî
  - l[n=110]: mîn herze in allen landen sî,
  - l[n=111]: swar ich iemer mêr süle komen.
  - l[n=112]: ich habe dâ nie von ir vernomen
  - l[n=113]: offenbâr noch heimlîch,
  - l[n=114]: dâ mit sî habe versmæhet mich.
  - l[n=115]: ir zuht sî habe des niht erlân,
  - l[n=116]: sî habe die êre mir getân,
  - l[n=117]: daz ir diu werlt sol dester baz
  - l[n=118]: sprechen. friunt, nu sage ir daz,
  - l[n=119]: ich müge sî niemer mêr gesehen.
  - l[n=120]: 'du solt ir des von mir verjehen:'
  - l[n=121]: ir schoenem lîbe, ir varwe klâr,
  - l[n=122]: den müese ich sîn ein marter gar,
  - l[n=123]: solte ich ir fürbaz wonen bî.
  - l[n=124]: der marter sol sî wesen frî.
  - l[n=125]: sît ich ir niht gedienen mac,
  - l[n=126]: sô sol ouch sî deheinen tac
  - l[n=127]: von mir gewinnen niemer leit."
  - l[n=128]: Der bote weinent von im reit
  - l[n=129]: und kam hin, dar er wart gesant.
  - l[n=130]: diu frouwe gienc gên im zehant;
  - l[n=131]: 'sî vienc in zuo ir unde sprach:'
  - l[n=132]: '"vor maniger zît ich nie gesach'
  - l[n=133]: deheinen boten alse gern,
  - l[n=134]: und wilt du lieber mære wern
  - l[n=135]: mich, friunt, von dem neven dîn.
  - l[n=136]: 'sage an: ist frô der hêrre mîn?"'
  - l[n=137]: 'daz kindel weinent sprach gên ir:'
  - l[n=138]: '"er hât enboten, frouwe, dir,'
  - l[n=139]: sîn dienest, unde swâ er sî,
  - l[n=140]: sô wone dir doch sîn herze bî.
  - l[n=141]: daz hâst du wol gên im versolt.
  - l[n=142]: ez habe nie schoene wîp gedolt
  - l[n=143]: mit solhen zühten keinen man,
  - l[n=144]: und der als übel wær getân.
  - l[n=145]: sîn lîp wær dir ievor ze swach;
  - l[n=146]: nu sî ein solher ungemach
  - l[n=147]: im geschehen, daz er dir bî
  - l[n=148]: ze smæhe an dînem bette sî
  - l[n=149]: und müge dich niemer mêr gesehen."
  - l[n=150]: 'diu reine sprach: "waz ist geschehen'
  - l[n=151]: im, an dem mîn freude stât?"
  - l[n=152]: 'der bote sprach: "ein ouge er hât'
  - l[n=153]: verlorn und doch vil ritterlîch."
  - l[n=154]: 'diu guote sprach: "friunt triuwen rîch,'
  - l[n=155]: nu renne balde und bite in komen,
  - l[n=156]: und ich habe von im vernomen,
  - l[n=157]: daz mir fürwâr gevalle niht.
  - l[n=158]: des smerzen habe ich mit im phliht
  - l[n=159]: billîchen, wan ez ist ein lîp.
  - l[n=160]: ich bin ouch sô gemuot ein wîp,
  - l[n=161]: 'daz mir ist als liep mîn man:'
  - l[n=162]: und solte er tûsent ougen hân
  - l[n=163]: (und daz im diu stüenden wol),
  - l[n=164]: sô wil ich unde billîch sol
  - l[n=165]: sîn einic ouge hân sô zart,
  - l[n=166]: daz mîn herze daz bewart,
  - l[n=167]: daz ez gedenken müge dar an,
  - l[n=168]: ob ez im übel süle stân."
  - l[n=169]: '"frouwe, ich sol dich triegen niht:'
  - l[n=170]: mîn reise diu ist gar enwiht.
  - l[n=171]: dâ von lâ mich belîben hie.
  - l[n=172]: nu weist du wol, daz er daz nie
  - l[n=173]: gegen dir kein zît gebrach,
  - l[n=174]: swaz er ernestlîchen sprach."
  - l[n=175]: '"nu wolte got", diu reine jach,'
  - l[n=176]: '"daz an mir al sîn ungemach'
  - l[n=177]: læge, und daz er wære ein man
  - l[n=178]: als schoene, als er sich wolte hân.
  - l[n=179]: ich hoere daz wol, ich muoz enbern
  - l[n=180]: sîn, den ich doch hete gern.
  - l[n=181]: daz ist ein jæmerlîchiu nôt,
  - l[n=182]: wan âne in sô bin ich tôt.
  - l[n=183]: nu bitte ich, lieber friunt, dich,
  - l[n=184]: daz du in sehest noch durch mich
  - l[n=185]: und füerest im mîn kleinât hin.
  - l[n=186]: nu warte mîn, unlange ich bin."
  - l[n=187]: diu guote gienc von im zehant
  - l[n=188]: in ir kemenâten, dâ sî vant
  - l[n=189]: ein schære, und stach vil balde dar
  - l[n=190]: ir selben ûz ein ouge gar,
  - l[n=191]: daz ez ir über ir wengel ran.
  - l[n=192]: alsô bluotic gie sî dan
  - l[n=193]: für den boten. der enkam;
  - l[n=194]: mit beiden handen er sich nam
  - l[n=195]: 'ze hâre und schrei: "wê iemer ach,'
  - l[n=196]: sô grôziu dinc ich nie gesach!
  - l[n=197]: frouwe guot, waz sol daz sîn?"
  - l[n=198]: 'sî sprach: "nu sage dem hêrren dîn,'
  - l[n=199]: 'daz er her kume und sehe mich an:'
  - l[n=200]: dunke ich in noch ze wolgetân,
  - l[n=201]: ich neme dem andern sînen schîn
  - l[n=202]: (sô liep ist er dem herzen mîn);
  - l[n=203]: und welle ich im verwîzen iht,
  - l[n=204]: daz er mit einem ougen siht,
  - l[n=205]: sô müge er wol von wârheit jehen,
  - l[n=206]: ich müge ouch wan mit einem sehen."
  - l[n=207]: 'sî sprach: "var hin, vil lieber knabe,'
  - l[n=208]: und bite in des, daz er sî abe
  - l[n=209]: solhes muotes und her kome,
  - l[n=210]: daz sî im iemer an mir frome."
  - l[n=211]: Der knabe weinent von ir gie,
  - l[n=212]: wan im wart sô leide nie.
  - l[n=213]: er saz ûf, im was vil gâch.
  - l[n=214]: als er den hêrren sîn ansach,
  - l[n=215]: weinent lief er gên im dar
  - l[n=216]: und sagte im allez daz vil gar,
  - l[n=217]: daz er dâ heime het gesehen;
  - l[n=218]: und swes diu guote het verjehen,
  - l[n=219]: des selben er aldâ gewuoc.
  - l[n=220]: der ritter sich zen brüsten sluoc.
  - l[n=221]: 'er sprach: "owê mir iemer wê!'
  - l[n=222]: ich het dar baz geriten ê.
  - l[n=223]: ach, daz ich ie wart geborn!
  - l[n=224]: wie hât mîn schoene wîp verlorn
  - l[n=225]: ir ouge. wê daz ich ie wart!"
  - l[n=226]: der hêrre von der swarten zart
  - l[n=227]: sîn hâr. ein ritter zuo im spranc,
  - l[n=228]: 'der sprach: "nu habe sî iemer danc;'
  - l[n=229]: sî hât iu daz erzeiget wol,
  - l[n=230]: daz sî ist gen iu triuwen vol."
  - l[n=231]: daz wort im alse nâhen gie,
  - l[n=232]: daz er ein kraft dâ von gevie
  - l[n=233]: 'und dâhte: "mir sagt wâr der man.'
  - l[n=234]: ich wil sî dester lieber hân.
  - l[n=235]: wan sî hât erzeiget mir,
  - l[n=236]: daz sî hât gên mir friundes gir."
  - l[n=237]: 'er sprach zem boten: "balde var,'
  - l[n=238]: vil lieber friunt, und bewar,
  - l[n=239]: daz sî ir mêr iht schaden tuo
  - l[n=240]: (ich strîche spâte unde fruo
  - l[n=241]: zuo der vil reinen wandels frî),
  - l[n=242]: und sage ir, daz ich iemer sî
  - l[n=243]: nâch ir willen umb die tât,
  - l[n=244]: die sî an mir erzeiget hât."
  - l[n=245]: Er îlte nâch im, im was gâch.
  - l[n=246]: als er die minniclîchen sach,
  - l[n=247]: vor liebe weinent lief er dar.
  - l[n=248]: diu reine minniclîche klâr
  - l[n=249]: 'sprach: "friunt, lieber hêrre mîn,'
  - l[n=250]: du solt mir willekomen sîn."
  - l[n=251]: 'der hêrre sprach: "owê, wie sol'
  - l[n=252]: ich, liebiu, dich ergetzen wol
  - l[n=253]: dînes smerzen, den dîn lîp
  - l[n=254]: hât durch mich, vil wîplich wîp,
  - l[n=255]: enphangen? wê der mînen tât,
  - l[n=256]: die mîn lîp begangen hât!"
  - l[n=257]: 'diu guote sprach: "und wilt du mich'
  - l[n=258]: ergetzen wol, daz lêre ich dich,
  - l[n=259]: sô solt du des getrouwen mir,
  - l[n=260]: daz niuwan gên dir stê mîn gir;
  - l[n=261]: und lâz ouch mich dir wol behagen.
  - l[n=262]: und solte ich tûsent ougen tragen
  - l[n=263]: und gevielen dir diu niht,
  - l[n=264]: sô solten sî mir sîn enwiht."
  - l[n=265]: Swer vor die frouwen gerne sach
  - l[n=266]: durch die schoene, der man ir jach,
  - l[n=267]: der sach sî nu vil lieber an
  - l[n=268]: durch die triuwe, die sî ir man
  - l[n=269]: erzeiget het; daz was billîch,
  - l[n=270]: wan sî was schoene und triuwen rîch.
  - l[n=271]: dâ von sî baz ze loben stât
  - l[n=272]: dan manigiu, diu zwei ougen hât.
  - l[n=273]: Swaz noch getriuwer konen sî,
  - l[n=274]: die tuo got alles leides frî.
  - l[n=275]: den allen sol ich sîn bekant
  - l[n=276]: von Wildonie Herrant.
