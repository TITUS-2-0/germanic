  - chapter[n=Epil.,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Epilog
    - div@rubric[data-level=2]:
      - head: Wie Allexander gestal ist gewesen.
      - l[n=8960]: Nu wil ich Allexander leben
      - l[n=8961]: churczlich ein end geben.
      - l[n=8962]: Allexander (gelaubt das!)
      - l[n=8963]: zu massen ain chuerczer man was.
      - l[n=8964]: er was zu allen zeitten gar
      - l[n=8965]: gar rosalat und wol gevar.
      - l[n=8966]: sein augen warn frolich,
      - l[n=8967]: sein har ainem leben geleich.
      - l[n=8968]: er was wiczig und charkch,
      - l[n=8969]: manhaft, mild und starkch.
