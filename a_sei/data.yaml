      - l[n=8983]: und begund die landt betwingen
      - l[n=8984]: das traib er ganczer suben jar
      - l[n=8985]: ee er die land betwang gar.
      - l[n=8986]: do er also die zeit
      - l[n=8987]: vertraib mit urleg und mit streit
      - l[n=8988]: ee er die landt gar betwang
      - l[n=8989]: und das chaisertumb errang,
