      - l[n=5730]: Allexander in des gewert.
      - l[n=5731]: ain zaichen warf man auf zu handt,
      - l[n=5732]: do man in fridt mit tet bechant.
      - l[n=5733]: die ros wichen von ain ander,
      - l[n=5734]: Porrus und Allexander
      - l[n=5735]: frydlich zu ainander ritten
      - l[n=5736]: allain mit zuchtiklichen sitten.
      - l[n=5737]: do Porrus Allexandrum sach,
