  - chapter[n=219,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Alexander bei den kopflosen Menschen
    - div@rubric[data-level=2]:
      - head: Das sy haubt los leutt sachen.
      - l[n=6829]: Do er den sig alda gewan,
      - l[n=6830]: do hueb er sich zu hant von dann
      - l[n=6831]: und cham zu ainem grossen wag,
      - l[n=6832]: darinn ain grassew insula lag.
      - l[n=6833]: da sachens leut inne gan,
      - l[n=6834]: die warn all des hauppts an,
      - l[n=6835]: der mund, augen und die orn
      - l[n=6836]: stuenden in an der prust vorn.
      - l[n=6837]: ir leng zwelef fuess was,
      - l[n=6838]: die dikch suben (gelaubet das!).
      - l[n=6839]: sy warn ungeschaffen gar
      - l[n=6840]: und an dem leib goldvar.
      - l[n=6841]: sy sachens durich ain wunder an,
      - l[n=6842]: sy tetten in nit und liessens gan.
  - chapter[n=241,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Alexander begegnet Pferden mit Löwentatzen
    - div@rubric[data-level=2]:
      - head: Das sy wunderleich tier vor ainem perg sachen.
      - l[n=6843]: Sy zugen aber furbas
      - l[n=6844]: und funden das vil selczam was.
      - l[n=6845]: sy chomen fur einen grassen wald,
      - l[n=6846]: da sachens tier ungestalt.
      - l[n=6847]: sy warn dikch und gros,
      - l[n=6848]: der leib geschaffen als ain ros,
      - l[n=6849]: die fuess geleich ainem leben.
      - l[n=6850]: si lieffen vor in und en neben.
      - l[n=6851]: ir hoch was dreyssig fuess,
      - l[n=6852]: ir stym was gar unsuess,
      - l[n=6853]: sy warn zweleff fuess dikch,
      - l[n=6854]: ir augen hetten frayslich plikch.
      - l[n=6855]: man sach sy vrayslich geparn,
      - l[n=6856]: yedoch ir nit vil warn.
