      - l[n=5752]: dienn dem andern willigklich.'
      - l[n=5753]: dem chaiser geviell die red wall;
      - l[n=5754]: "er sprach: 'es ist pilleich das ich scholl"
      - l[n=5755]: vechten fuer die frant mein,
      - l[n=5756]: wann ich will ir herr sein.'
      - l[n=5757]: do Portus sach das Puczeval
      - l[n=5758]: so fraisleich tet auf dem wall,
      - l[n=5759]: "er sprach: 'gegen disem chunder"
