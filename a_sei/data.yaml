  - chapter[n=184,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Alexander und Candacis
    - div@rubric[data-level=2]:
      - head: Das er fuer das gepirg cham das Gramania ist genant.
      - l[n=6897]: Allexander zogt furbas
