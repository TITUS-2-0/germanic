    - l[n=8835]: fuer die stat verrn
    - l[n=8836]: und klagten irn hern.
    - l[n=8837]: die fursten edl und reich
    - l[n=8838]: die par namen all geleich
    - l[n=8839]: und huebens auf den wagen
    - l[n=8840]: und begunden ser zu chlagen
    - l[n=8841]: mit grassem jamer ungefuegen.
    - l[n=8842]: in den tempel sy in truegen
    - l[n=8843]: und liessen in darinne stan
