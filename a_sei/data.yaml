  - chapter[n=290,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Iolus (Jobas) tötet sich selbst
    - div@rubric[data-level=2]:
      - head: Das sich Jobas selb ertett, der chaiser vergeben hett.
      - l[n=8892]: Do der jungling Jobas,
      - l[n=8893]: der des chaisers morder was,
      - l[n=8894]: die chlag und den jamer sach,
      - l[n=8895]: ein swert er durich sich selber stach.
      - l[n=8896]: yedoch begund er vergechen
      - l[n=8897]: des mordes, wie es wer geschechen,
      - l[n=8898]: und wie sein vater Ancipater
      - l[n=8899]: die gift gesandt hiet uber mer.
      - l[n=8900]: die fuersten an der selben stat
      - l[n=8901]: all mit gemainem rat
      - l[n=8902]: 'rachen an im irn anden:'
      - l[n=8903]: also tatten sy in verprannden.
      - l[n=8904]: do das erfuer der ander.
      - l[n=8905]: Jobas prueder, der Cassander,
      - l[n=8906]: auf das mer er entran
      - l[n=8907]: und fuer haimlich von dann,
      - l[n=8908]: das man in nymmer mer
      - l[n=8909]: erfuer wo er hin komen wer.
      - l[n=8910]: do sy wider gegen Chriechen chamen,
      - l[n=8911]: dem vater sy den leib namen;
      - l[n=8912]: darczue alles sein geslacht
      - l[n=8913]: tet man so gar in die echt
      - l[n=8914]: das es alles gar verswandt
      - l[n=8915]: und verfuer von dem land.
  - chapter[n=296,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Diadochenkriege nach Alexanders Tod
    - div@rubric[data-level=2]:
