text:
- body:
  - chapter[n=Prol.,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Prolog
    - l[n=1]: Got vater, herr Jesu Christ,
    - l[n=2]: wenn dein gnad unczergenkchleich ist
    - l[n=3]: und dein gruntlose mynn,
    - l[n=4]: nu verleich mir, herr, die synn
    - l[n=5]: das ich guetten leutten
    - l[n=6]: ein red mug bedeutten
    - l[n=7]: und zu dankch tuen bekant
    - l[n=8]: die ich ze latein geschriben vant
    - l[n=9]: in dem puech Kronica.
    - l[n=10]: Ewsebius schreibt sy da,
    - l[n=11]: der weis und auch der heilig man.
    - l[n=12]: der hab ich mich genomen an
    - l[n=13]: in deutschew wart zu tichten
    - l[n=14]: 'und zu reym richten:'
    - l[n=15]: wie der mylt und der here
    - l[n=16]: chunig Allexander
    - l[n=17]: mit seiner mechtigen tat
    - l[n=18]: alle die welt betwungen hat,
    - l[n=19]: wie er es an gevie
    - l[n=20]: und wie es im ze jungist gie,
    - l[n=21]: als es sag sein hystorie.
    - l[n=22]: die wunder gross und die glorle
    - l[n=23]: die er hye in churczen jarn
    - l[n=24]: hat begangen und ervarn,
    - l[n=25]: des mach ich mynner noch mer
    - l[n=26]: als ain getrewer ausleger
    - l[n=27]: wenn als dort geschriben stat
    - l[n=28]: und es die heilig kirchen hat
    - l[n=29]: vervangen pey einer warhait
    - l[n=30]: und die wibel von im sait.
    - l[n=31]: man sol es nit haben fur ain mer,
    - l[n=32]: wann ich es hie mit bewẽr.
    - l[n=33]: wer es wil und chan es suchen
    - l[n=34]: in alten und in newen puechen,
    - l[n=35]: do latein und ebraisch,
    - l[n=36]: chriechisch und haidnisch
    - l[n=37]: do die ystorie sind geschriben
    - l[n=38]: und sindt unczt her beliben.
    - l[n=39]: die tragen geleich all gemain
    - l[n=40]: an diser red uber ain
    - l[n=41]: das es alles sey geschechen.
    - l[n=42]: des hor auch wir die maister jehen
    - l[n=43]: die dy pesten sind gewesen,
    - l[n=44]: der puecher wir noch heut lesen,
    - l[n=45]: Aristotiles und Virgilius,
    - l[n=46]: Seneca und Boecius,
    - l[n=47]: Augustinus und Ambrosius,
    - l[n=48]: Josepus und Ewsebius
    - l[n=49]: und ander hocher maister vil,
    - l[n=50]: der ich aller nicht nennen will.
    - l[n=51]: ich wil auch mit spruchen spechen
    - l[n=52]: mein red alhie nit verwechen,
    - l[n=53]: ich will nichts darczue legen,
    - l[n=54]: nuer ains slechten tichtens phlegen.
    - l[n=55]: hie mit wil ich die var redt lan
    - l[n=56]: und das puech heben an.
    - l[n=57]: Da die welt gestanden was
    - l[n=58]: von Adam her (gelaubt das!)
    - l[n=59]: volliklich wol tausent jar
    - l[n=60]: und newnthalbhunder furwar
    - l[n=61]: und es der czeit nechen sollt
    - l[n=62]: das Got mensch werden wolt,
    - l[n=63]: davor doch virdthalbhundert jar
    - l[n=64]: (das ich euch sag, das ist war)
    - l[n=65]: do was die welt allgemain
    - l[n=66]: so gar poͤs und unrain
    - l[n=67]: das sy Gottes erkantten nicht
    - l[n=68]: und hetten mit possen sunden phlicht,
    - l[n=69]: mit keczerey und mit hochvart,
    - l[n=70]: wann Got nye vermeret wart.
    - l[n=71]: dar umb wolt er in nicht vertragen,
    - l[n=72]: er wol sew zuchtigen und phlagen
    - l[n=73]: und sandt in ain chestiger,
    - l[n=74]: ain unparmherczigen richter,
    - l[n=75]: der ir hochvart manigvalt
    - l[n=76]: nider trukcht mit gewalt.
    - l[n=77]: die sich selber nanten got,
    - l[n=78]: aus den so traib er seinen spot
    - l[n=79]: Alexander der wer
    - l[n=80]: der obrist Gottes richter.
  - chapter[n=2,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Nectanabus wird aus Ägypten vertrieben
    - div@rubric[data-level=2]:
      - head: Von Nectanabo, ein chunig in Egipten.
      - l[n=81]: Ain kunigreich ist genant
      - l[n=82]: vor alten zeitten Egipptenlant,
      - l[n=83]: das ist aines der hersten
      - l[n=84]: gewesen und auch der ersten.
      - l[n=85]: ain kunig haist Nectanabus
      - l[n=86]: (das puech nennet in alsus),
      - l[n=87]: der trueg darin die chran
      - l[n=88]: gewaltiklich und schan.
      - l[n=89]: er was also kunstreich
      - l[n=90]: das man an weisheit sein geleich
      - l[n=91]: in al der welt nyndert vant.
      - l[n=92]: die suben kunst warn im bekant,
      - l[n=93]: er chund die chunst astronomey
      - l[n=94]: 'und auch die chunst nygramanczey:'
      - l[n=95]: in den swarczen puechern
      - l[n=96]: chundt er mit loss versuechen
      - l[n=97]: und an dem gestyerm sehen
      - l[n=98]: was in der welt solt geschehen.
    - div@rubric[data-level=2]:
      - head: Das ain ritter dem kunig Nectanabo sagt wie der mechtig kunig Artaxses
          auf in wolt ziechen.
      - l[n=99]: Ains tag cham es also
      - l[n=100]: das in ain ritter macht unfro.
      - l[n=101]: der sagt im und warmbt in des
      - l[n=102]: das der chaiser Artaxerses,
      - l[n=103]: der gross chunig von Persia,
      - l[n=104]: mit gewalt chem alda
      - l[n=105]: mit ainem mochtigen her
      - l[n=106]: und mit chieln auff dem mer.
      - l[n=107]: er jach, er wolt das landt betwingen
      - l[n=108]: und in sein gewalt pringen,
      - l[n=109]: 'und sprach das er sich danach richt:'
      - l[n=110]: sein wer wer gegen im enwicht.
    - div@rubric[data-level=2]:
      - head: Das Nectanabus zurnt an dem ritter umb solich potschaft.
      - l[n=111]: 'Der kunig anttwurt dem ritter do:'
      - l[n=112]: "'reit und phlig der huet also"
      - l[n=113]: als ich dir enpholichen han.
      - l[n=114]: du redest nit als ain pider man
      - l[n=115]: sunder als ein vorichtiger zag.
      - l[n=116]: 'merkch recht was ich dir sag:'
      - l[n=117]: der sig leit an der menig nit,
      - l[n=118]: er hat mit der mannhait phlicht;
      - l[n=119]: wenn dikch ein leb unverczagt
      - l[n=120]: ein gancz her hierssen jagt.'
      - l[n=121]: der chunig gepart gegen dem mẽr
      - l[n=122]: als im nichts dar umb wẽr,
      - l[n=123]: und hueb sich von dannen
      - l[n=124]: taugenlich von seinen mannen
      - l[n=125]: in sein haymlich chemnatten.
      - l[n=126]: ein erdein pekch er im pringen pat,
      - l[n=127]: regen wasser er darin gas,
      - l[n=128]: dar umb so warff er seinew lass.
      - l[n=129]: er sprach mit seinem mundt
      - l[n=130]: solichew wart die er wol chundt.
      - l[n=131]: die tivel er vast beswuer,
      - l[n=132]: unczt das er genczlich erfuer
      - l[n=133]: und auch das mit loss ervant
      - l[n=134]: das er muest raumen das landt
      - l[n=135]: 'ob er wolt lembtig wesen:'
      - l[n=136]: er mocht anders nicht genesen.
      - l[n=137]: er czach ab sein kuniklich wat
      - l[n=138]: und verstalt sich auf der stat.
      - l[n=139]: er schar ab har und part,
      - l[n=140]: das er unkuniklich wart.
      - l[n=141]: er nam czu im von golde
      - l[n=142]: und von gestain was er wolde,
      - l[n=143]: er nam auch mit im da
      - l[n=144]: sumlich instrumenta,
      - l[n=145]: der er nicht enpern macht
      - l[n=146]: und im zu seiner chunst tocht.
      - l[n=147]: damit fuer er von dannen
      - l[n=148]: allain von all sein mannen
      - l[n=149]: und verhal also sein vart
      - l[n=150]: das ir nyemant inne wart,
      - l[n=151]: unczt das er gegen Chriechen cham.
      - l[n=152]: war sagen er sich an nam.
  - chapter[n=3,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Nectanabus wird von den Ägyptern gesucht
    - l[n=153]: schir dar nach wardt bekannt
    - l[n=154]: dem volkch in Egyppten landt
    - l[n=155]: und erfuern das mer
    - l[n=156]: das der kunig verlorn wer.
    - l[n=157]: ir abgot der hies Seraphin,
    - l[n=158]: da zogten sy gemainklich hin.
    - l[n=159]: ir oppher prachten sy im dar
    - l[n=160]: und paten in stil und offenbar
    - l[n=161]: das er in saget das mer
    - l[n=162]: wo ir herr hin komen wer.
    - div@rubric[data-level=2]:
      - head: Das der abgot dem volkch anttwurt gab.
      - l[n=163]: Der abgot anttwurt in alda
      - l[n=164]: und sprach 'der kunig von Persia,
      - l[n=165]: der Artaxerses ist genant,
      - l[n=166]: der betwingt dicz landt
      - l[n=167]: gewaltiklich mit heres chraft
      - l[n=168]: und macht euch im zinshaft.
      - l[n=169]: das mag im nieman erwern.
      - l[n=170]: Nectanabus der wolt sich ernern,
      - l[n=171]: do er es mit dem los ervant,
      - l[n=172]: und ist entrunnen von dem lanndt,
      - l[n=173]: 'der edl und der her:'
      - l[n=174]: ir gesecht in nymmer mer.
      - l[n=175]: aber noch ettleichen jarn
      - l[n=176]: so chumbt ain junglinkch gefarn
      - l[n=177]: von fromden landen verr,
      - l[n=178]: der ist ewr erb und wirt ewr herr.
      - l[n=179]: der ledigt euch mit seiner chraft
      - l[n=180]: van dienst und van aygenschaft.
      - l[n=181]: an ewrn veintten er euch richt
      - l[n=182]: und ewr herschaft hie zupricht,
      - l[n=183]: ir puͤrg, ir stet legt er zu der erden,
      - l[n=184]: unczt sy im undertenig werden.'
      - l[n=185]: do das volkch vernam das
      - l[n=186]: das ir herr enttrunnen was,
      - l[n=187]: ir chlag die was manigvalt.
      - l[n=188]: sy machten do nach seiner gestalt
      - l[n=189]: ain seull von swarczem mermelstain,
      - l[n=190]: hach und gepoliret rain,
      - l[n=191]: zu lob und auch zu ern
      - l[n=192]: und zu gedechtnuͤs irm herrn,
      - l[n=193]: und liessen zu den fuessen graben
      - l[n=194]: mit guldein puechstaben
      - l[n=195]: die red die ir abgot Seraphin
      - l[n=196]: von im het geweissagt in.
      - l[n=197]: das volkch die sewl geseczet hat
      - l[n=198]: mitten in ir hawbstat.
  - chapter[n=5,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Nectanabus in Macedonien
    - div@rubric[data-level=2]:
      - head: Wie es kunig Nectanabo in Chriechen lanndt gieng.
      - l[n=199]: Lass wir die red beleiben so
      - l[n=200]: und sagen wie es Nectanabo
      - l[n=201]: do zu Chriechen ergie,
      - l[n=202]: wie er sein dinkch an gevie.
      - l[n=203]: er legt an sich weis seydein wat,
      - l[n=204]: fur ainen weissagen man in hat.
      - l[n=205]: er begundt den leutten
      - l[n=206]: auslegen und bedeutten
      - l[n=207]: 'die trewm und was in scholt geschechen:'
      - l[n=208]: des lies er sy die warhait sechen.
      - l[n=209]: er was do lang unerkant.
      - l[n=210]: die leut uber all das lanndt
      - l[n=211]: begunden zu im gachen,
      - l[n=212]: do sy sein weyshait sachen,
      - l[n=213]: und namen von ym rat und ler
      - l[n=214]: und erputten im michel er,
      - l[n=215]: wann sy in all hetten
      - l[n=216]: fur ain Gottes prophetten.
  - chapter[n=6,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Nectanabus spricht mit Olympias
    - div@rubric[data-level=2]:
      - head: Das Nectanabus die kunigin wolt schawn in Chriechen lanndt.
      - l[n=217]: Zu Chriechen pey den zeitten was
      - l[n=218]: ein edel kunig (gelaubt das!),
      - l[n=219]: der was Philippus genant,
      - l[n=220]: sein nam was weytten erkant.
      - l[n=221]: er was zu den zeitten
      - l[n=222]: in ein ander landt durich streytten
      - l[n=223]: mit grosser heres chraft gezogt
      - l[n=224]: gegen ainen kunig der gegen im progt.
      - l[n=225]: wie der kunig sey genant,
      - l[n=226]: das tuet dye kronikchen nicht erkantt.
      - l[n=227]: chunig Philip het ein schons weib,
      - l[n=228]: die was im lieb als der leib,
      - l[n=229]: die auch zu Chriechen chunigin was
      - l[n=230]: und was genant Olymppias;
      - l[n=231]: man vandt in allen den kunig reichen
      - l[n=232]: an schon nit irn geleichen.
      - l[n=233]: do das derfuer Nectanabas
      - l[n=234]: das der kunig nicht was zu haus
      - l[n=235]: und die fraw so schon was,
      - l[n=236]: er gieng auff den palas
      - l[n=237]: und wolt gern schawen
      - l[n=238]: die mynnikleichen frawen.
      - l[n=239]: zu hant do er die frawen erplikcht,
      - l[n=240]: sein hercz und sein muet erschrikcht
      - l[n=241]: und darczu al sein synn
      - l[n=242]: stuend auf der frawen mynn.
      - l[n=243]: er hielt sein handt fur sich
      - l[n=244]: "und sprach: 'kunigin, Got gruess dich!'"
      - l[n=245]: vor uber muet er es lies
      - l[n=246]: 'das er sey nit fraw hies:'
      - l[n=247]: das tet er umb das
      - l[n=248]: wenn er auch ain kunig was.
      - l[n=249]: die kunigin dankcht im an der frist
      - l[n=250]: "und jach: 'ob du ain maister pist,"
      - l[n=251]: so sicz her pey mich,
      - l[n=252]: wenn ich wolt ettwas fragen dich.'
      - l[n=253]: "sy sprach: 'maister, sag mir sus:"
      - l[n=254]: pistu ein Egypcius?'
      - l[n=255]: "er sprach: 'ich han von dir gebort,"
      - l[n=256]: chunigin, ein kuniklich wort,
      - l[n=257]: das du Egypptum nenst.
      - l[n=258]: ob du die leut nicht erkenst,
      - l[n=259]: 'die sind so gar synnreich:'
      - l[n=260]: man vindt nynndert irn geleich.
      - l[n=261]: sy kunnen den leutten
      - l[n=262]: die trewmb wol bedeutten,
      - l[n=263]: sy wissen taugen und gedankchen
      - l[n=264]: und verstent aller voglein gesankch,
      - l[n=265]: sy chunnen an dem gestyerm sehen
      - l[n=266]: was den leutten schol geschechen,
      - l[n=267]: wenn sy auf der erden
      - l[n=268]: erst geporn werdent.
      - l[n=269]: alles das ich hann genant,
      - l[n=270]: das ist mir, kunigin, wol bekannt'.
    - div@rubric[data-level=2]:
      - head: Das Nectanabus die kunigin schelkchleichen an sach.
      - l[n=271]: Do er das alles gesprach,
      - l[n=272]: die frawen er mynniklich an sach
      - l[n=273]: mit schelklichen augen.
      - l[n=274]: 'die chunigin fragt in taugen:'
      - l[n=275]: "'maister, wes habt ir gedacht,"
      - l[n=276]: do ir mich also an sacht?'
      - l[n=277]: 'er sagt ir ein mer:'
      - l[n=278]: wie es im geweissagt wer
      - l[n=279]: das er pey ir siczen scholt
      - l[n=280]: und mit ir reden was er wolt.
      - l[n=281]: "sy sprach: 'chanstu mir gesagen"
      - l[n=282]: ains dings wil ich dich fragen,
      - l[n=283]: so wil ich gelauben dir
      - l[n=284]: was du furbas sagest mir.
      - l[n=285]: sag mir wenn der schanden frey
      - l[n=286]: chunig Philipp geporn sey,
      - l[n=287]: lass mich horn die stundt,
      - l[n=288]: die jar, die teg aus deinem mundt!'
      - l[n=289]: er zach aus dem puesem sein
      - l[n=290]: ain helffenpainen teschlein.
      - l[n=291]: do was ainhalb an geschriben
      - l[n=292]: mit golt die planetten suben,
      - l[n=293]: ynderthalb stuendt dar an
      - l[n=294]: gegraben sunn und der man
      - l[n=295]: und auch die zweleff zaichen
      - l[n=296]: die dy sunn mues erraichen.
      - l[n=297]: in der chunst von dem gestyerm
      - l[n=298]: begund er ratten und studiern
      - l[n=299]: unlang unczt er es gar ervant.
      - l[n=300]: die kunigin beschied er zu handt
      - l[n=301]: und velt nicht praittes ain hars
      - l[n=302]: der stundt, des tags, des jars
      - l[n=303]: dar an der kunig wardt geporn.
      - l[n=304]: "er sprach: 'kunigin aus erkorn,"
      - l[n=305]: wes du furbas fragest mich,
      - l[n=306]: des wil ich also berichten dich.'
    - div@rubric[data-level=2]:
      - head: Das die kunigin Nectanabum fragt.
      - l[n=307]: Dye kunigin edl und reich
      - l[n=308]: 'fragt in gar geczogenlich:'
      - l[n=309]: "'maister, du scholt mir verjechen"
      - l[n=310]: was zwischen mir schol geschechen
      - l[n=311]: und dem kunig Philippo.
      - l[n=312]: die leut redent also
      - l[n=313]: und gechen algemain,
      - l[n=314]: wenn der chunig chom her haym,
      - l[n=315]: so well er nemen und gewingen
      - l[n=316]: fur mich ain andre kunigynne.'
      - l[n=317]: "der maister sprach: 'sy sind betrogen;"
      - l[n=318]: die dir es sagent, die habent gelogen.
      - l[n=319]: es ist war das es geschicht,
      - l[n=320]: aber in dissen zeitten nicht.
      - l[n=321]: uber ettlich jar
      - l[n=322]: versmecht er dich, das ist war.
      - l[n=323]: er tor dich aber gelassen nicht,
      - l[n=324]: wenn ein got gewingt mit dir phlicht,
      - l[n=325]: der wirt dein mynne gesell.
      - l[n=326]: der chunig, er well oder enwell,
      - l[n=327]: er mues dich behalten
      - l[n=328]: und mues mit dir alten.'
      - l[n=329]: "sy sprach: 'und ist es nit dein spot,"
      - l[n=330]: 'so say mir recht: wer ist der got'
      - l[n=331]: der mich schol beslaffen,
      - l[n=332]: und wie ist er geschaffen?'
      - l[n=333]: "'er ist weder ze junkch noch ze alt,"
      - l[n=334]: er ist zu mitter weis gestalt.
      - l[n=335]: er hat an dem haup vorn
      - l[n=336]: als ein wider chrumppe horn
      - l[n=337]: und haist der got Amon.
      - l[n=338]: er erscheinet dir gar schon
      - l[n=339]: in dem trawmb noch heint.
      - l[n=340]: er ist dir nicht veint,
      - l[n=341]: des scholtu im alczeit
      - l[n=342]: tag und nacht sein berait.'
  - chapter[n=7,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Nectanabus täuscht Olympias
    - div@rubric[data-level=2]:
      - head: Das der kunig Nectanabus auf das veld nach wuerczen gienug.
      - l[n=343]: Nectanabus urlaub pat
      - l[n=344]: die frawen und gieng ann ein stat
      - l[n=345]: auf das gevild, da er vand
      - l[n=346]: wurczen und chreutter alczuhandt,
      - l[n=347]: der er bedarft czu der sachen
      - l[n=348]: die er mit zawber wolt machen.
      - l[n=349]: die geist er pienn zu maniger stund
      - l[n=350]: und czaubert, als er wol chundt.
      - l[n=351]: do es nacht warden was,
      - l[n=352]: Nectanabus hat gemaistert das
      - l[n=353]: das sy in dem trawm sech
      - l[n=354]: wie Amon der got wech
      - l[n=355]: pey ir an dem pet leg
      - l[n=356]: und der mynne mit ir phleg
      - l[n=357]: 'und sprach zu ir also:'
      - l[n=358]: "'fraw, du solt wesen fro:"
      - l[n=359]: du trest den der dich schol bewarn
      - l[n=360]: und behuetten in dein jarn.'
      - l[n=361]: mit dem er von ir verswandt.
      - l[n=362]: die fraw erwacht zu handt.
      - l[n=363]: die chunigin ward unmassen fro,
      - l[n=364]: nach dem maister sandt sy do.
      - l[n=365]: die chunigin sagt im offenwar
      - l[n=366]: wie ir des nachts geschechen wer,
      - l[n=367]: wie sy den got het gesechen
      - l[n=368]: und wes er ir het verjechen.
      - l[n=369]: 'der maister anttwurt ir do:'
      - l[n=370]: "'ich wais es wol, im ist also:"
      - l[n=371]: es ist dir inn dem trawm geschechen.
      - l[n=372]: wildu des die warhait sechen,
      - l[n=373]: so hais mir machen ain pettlein
      - l[n=374]: fuͤr die chemnatten dein!'
      - l[n=375]: die fraw schuͤrff im guetten gemach,
      - l[n=376]: in irm palas das geschach.
      - l[n=377]: 'der maister sagt der frawen do:'
      - l[n=378]: "'du wirst in heint sechen so"
      - l[n=379]: als ain trakchen wildt.
      - l[n=380]: dar nach in aines mannes pild
      - l[n=381]: verwandelt er sich schir
      - l[n=382]: und wirt wispeln vor dir.
      - l[n=383]: er wirt sich an dein pett legen
      - l[n=384]: und wirt der mynn mit dir phlegen.'
