      - l[n=5788]: sy stritten guetten helden gleich,
      - l[n=5789]: wann sy payd manhaft wielten.
      - l[n=5790]: die her gegen einander hielten
      - l[n=5791]: frydlich alle zway.
      - l[n=5792]: die weil hueb sich ein geschray
      - l[n=5793]: under indischem her.
      - l[n=5794]: Porrus der vergas der wer
      - l[n=5795]: zu hant da er sein ward gewar,
      - l[n=5796]: er went das haubt und luegt aldar.
      - l[n=5797]: do er sich umb hat gewant,
