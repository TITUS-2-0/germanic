      - l[n=9034]: Lob und er sey dir gesait,
      - l[n=9035]: Got herr, in deiner ewigkait,
      - l[n=9036]: wann du in der drivaltikait
      - l[n=9037]: ainvoltig pist an undershaid
      - l[n=9038]: und in der fran maigestat,
