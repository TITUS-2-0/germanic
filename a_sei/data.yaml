    - l[n=8392]: das mues Got erparmen!'
    - l[n=8393]: sy pracht in in den sall wider
    - l[n=8394]: und legt in an sein pet nider.
    - l[n=8395]: Allexander zu ir sprach,
    - l[n=8396]: 'do er sy so wainen sach:'
    - l[n=8397]: "'suesse fraw Roxanen,"
    - l[n=8398]: die liebsten die ich ie gewan,
