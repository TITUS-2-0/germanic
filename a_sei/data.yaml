      - l[n=7203]: die mewr und die wentt
      - l[n=7204]: warn an allem endt
      - l[n=7205]: geformyert von hellfenpain
      - l[n=7206]: und dar in edel gestain
      - l[n=7207]: mit gold schon gevieret
      - l[n=7208]: und reichlich gepalieret.
      - l[n=7209]: darnach das gewelib oben
      - l[n=7210]: was reichlich und wol ze loben
      - l[n=7211]: und von holcz aloe,
      - l[n=7212]: das gefault nymmer mer
      - l[n=7213]: und gibt gar edeln gesmach.
      - l[n=7214]: dar inn vil edler stain lag,
      - l[n=7215]: verworicht maisterleich und rain
      - l[n=7216]: der pey der nacht maniger schain
      - l[n=7217]: als ain liechtew luczern.
      - l[n=7218]: Allexander sach sy gern.
      - l[n=7219]: damitten warn gesaczt darein
      - l[n=7220]: zwo schon sewllen guldein,
      - l[n=7221]: darauff zwe grass charfunkchel;
      - l[n=7222]: die nacht wart nye so tunkche,
      - l[n=7223]: sy leuchten also schon
      - l[n=7224]: das man wol gesach davon.
      - l[n=7225]: da er es alles het geschaut,
      - l[n=7226]: ze jungist im gar ser graust.
      - l[n=7227]: "sy sprach: 'beschaut meinen hort,"
      - l[n=7228]: der stet an der went dort.'
      - l[n=7229]: sy zaigt im das gemell
      - l[n=7230]: und het des nit lenger hel.
      - l[n=7231]: da sach er all sein gestalt
      - l[n=7232]: vor im an der wendt gemallt.
      - l[n=7233]: do wolt er aus sein gegangen.
      - l[n=7234]: "sy sprach: 'naynn, ir seit gefangen.'"
      - l[n=7235]: "er sprach: 'fraw, wes zeicht ir mich?'"
      - l[n=7236]: sy anttwurt im tugentlich;
      - l[n=7237]: "sy sprach: 'ich wais wol an streit"
      - l[n=7238]: das irs Allexander seit,
      - l[n=7239]: der gewaltig und der her.
      - l[n=7240]: davon laugent sein nit mer
      - l[n=7241]: und habt sein vor mir chain hel,
      - l[n=7242]: wann euch meldet das gemell,
      - l[n=7243]: das mir vor maniger frist
      - l[n=7244]: nach ewr gestalt gemalet ist.'
      - l[n=7245]: 'sy sprach zu im alczuhant:'
      - l[n=7246]: "'was hilft euch leut und landt,"
      - l[n=7247]: ewr wicz und ewr leibes chraft
      - l[n=7248]: und ewr grassew herschaft ?
      - l[n=7249]: was hilft nu ewr gewalt
      - l[n=7250]: und ewr er manigvalt ?
      - l[n=7251]: wo ist ewr wicz und ewr vernuft
      - l[n=7252]: und daczue ewr signuft,
      - l[n=7253]: die euch vor maniger frist
      - l[n=7254]: von den gottern verhaissen ist?
      - l[n=7255]: euch chundt chain man betwingen nye;
      - l[n=7256]: nu secht ir wol das ir alhie
      - l[n=7257]: von ainer frawn zu diser zeit
      - l[n=7258]: an alle wer gevangen seytt.'
      - l[n=7259]: "er sprach: 'edlew chunigynne,"
      - l[n=7260]: dein wicz und dein synne
      - l[n=7261]: habent uber listet mich.
      - l[n=7262]: was du gepeuttest, das wil ich,
      - l[n=7263]: seid es ist also ergangen
      - l[n=7264]: das ich pin dein gevangen.'
      - l[n=7265]: "sy sprach zu im: 'furicht euch nit,"
      - l[n=7266]: wann chain laid euch alhie geschicht.
      - l[n=7267]: ich wil euch schikchen von dem landt
      - l[n=7268]: an schaden und an schandt.
      - l[n=7269]: ir wert alhie nit genant
      - l[n=7270]: noch von mir nyemant erchant.'
      - l[n=7271]: des dankcht er ir gar ser
      - l[n=7272]: der herr Allexander.
    - div@rubric[data-level=2]:
      - head: Das die chunigynn Allexandrum pat das er ir land ledig lies.
      - l[n=7273]: "Sy sprach: 'ir sult mir ledig lan"
      - l[n=7274]: "mein lant.' er sprach: 'das sey getan.' -"
      - l[n=7275]: "'noch pitt ich euch mer."
      - l[n=7276]: 'das ist mein pet und mein beger:'
      - l[n=7277]: ich han zwen brueder in dem landt,
      - l[n=7278]: die mit raub und mit prant
      - l[n=7279]: mir habent das landt lang her
      - l[n=7280]: gewuegstet und verheret ser
      - l[n=7281]: ich wais selber umb wew,
      - l[n=7282]: 'umb anders nit wann umb dew:'
      - l[n=7283]: das lannt wolten sew gewynnen
      - l[n=7284]: und vertreyben mich von hynnen
      - l[n=7285]: die pring mit mir zu ainer suen.'
      - l[n=7286]: 'er jach, er wolt es gern tuen:'
      - l[n=7287]: "'west ich oder chundt ich wie.'"
      - l[n=7288]: "sy jach: 'sy sind nachent hie."
      - l[n=7289]: zu handt wann wir geessen'
      - l[n=7290]: sprach sy zu dem vermessen,
      - l[n=7291]: "'so schult ir dann reytten"
      - l[n=7292]: und tuet das enczeitten!
      - l[n=7293]: ir chombt dar in ainer weil,
      - l[n=7294]: aldar sind chawm drey meil.
      - l[n=7295]: ir seit so wiczig und so chlueg
      - l[n=7296]: das ir vindet wol den fueg
      - l[n=7297]: das ir czwischen uns slichtet
      - l[n=7298]: und mit ainander uns verrichtet.'
      - l[n=7299]: damit tet sy auf die tuer
      - l[n=7300]: und fuert den gast mit ir hinfuer.
      - l[n=7301]: die leut wundern began
      - l[n=7302]: was sy mit ainem fromden man
      - l[n=7303]: so lang allain wer gewesen.
      - l[n=7304]: "sy sprach: 'ich han den brieff gelesen.'"
      - l[n=7305]: zu hant man der frawen sait
      - l[n=7306]: das das essen wer beraitt.
      - l[n=7307]: sy saczt den potten neben sich
      - l[n=7308]: und hies sein phlegen erlich.
      - l[n=7309]: reich chost man fur in trueg,
      - l[n=7310]: wiltpret und zambs genueg.
      - l[n=7311]: sy mant in dikch das er esse.
      - l[n=7312]: in schonem guldeim gevesse
      - l[n=7313]: hies sy im schenkchen chlarn wein,
      - l[n=7314]: der nit pesser mocht gesein.
      - l[n=7315]: do sy lanng gesassen,
      - l[n=7316]: getrunkchen und geassen
      - l[n=7317]: als es fursten woll gezam,
      - l[n=7318]: die tischtuch man ab nam.
      - l[n=7319]: er wolt nit lenger peytten,
      - l[n=7320]: er hueb sich enczeitten
      - l[n=7321]: und chom fuer die vest zu handt,
      - l[n=7322]: da er die herrn paid vant
      - l[n=7323]: sten under irm purig tor.
      - l[n=7324]: sein ros heft er an da vor
      - l[n=7325]: und gie zu den herrn hin.
      - l[n=7326]: die herrn paid enphiengen in
      - l[n=7327]: und fragten in der mer
      - l[n=7328]: was sein gewerb wer.
      - l[n=7329]: "er sprach: 'nicht wann alles guett."
      - l[n=7330]: euch enpeuttet hochen muett
      - l[n=7331]: der chayser Allexander
      - l[n=7332]: und hies mich euch sagen mer
      - l[n=7333]: das ir im alczuhant
      - l[n=7334]: auf gebt dicz landt,
      - l[n=7335]: oder er wil euch ertrenkchen
      - l[n=7336]: und payd in das mer senkchen.
      - l[n=7337]: des hat er gesworn
      - l[n=7338]: pey seinen gottern hoch geparn.'
      - l[n=7339]: 'der elter anttwurt im zuhandt:'
      - l[n=7340]: "'er hat zu hoch an gerantt,"
      - l[n=7341]: wir sein noch nit so leicht vaill.
      - l[n=7342]: er wenet uns haben an ainem saill,
      - l[n=7343]: als er den andern hat getan;
      - l[n=7344]: es sol im hie also nicht ergan.'
      - l[n=7345]: es begund in hart versmachen.
      - l[n=7346]: zu hant hiessen sew in vachen
      - l[n=7347]: und drotten im zu verderben paydt
      - l[n=7348]: seinem herrn ze laid,
      - l[n=7349]: das er irn ernst sẽch.
      - l[n=7350]: 'er chert sich umb und sprach:'
      - l[n=7351]: "'ir herrn, lat mich pey dem leben!"
      - l[n=7352]: ich wil euch ainen ratt geben,
      - l[n=7353]: das ir vor dem chaiser genest
      - l[n=7354]: und ymmer sicher vor im west.'
      - l[n=7355]: "der junger sprach: 'lass horn!"
      - l[n=7356]: du wild uns leicht betorn.'
      - l[n=7357]: "er sprach: 'zagt zu ewr swester,"
      - l[n=7358]: pey der was ich dannoch gestern,
      - l[n=7359]: und versuennet euch mit ir!
      - l[n=7360]: pey meinem got ich euch swer,
      - l[n=7361]: und sol ich vier wochen leben,
      - l[n=7362]: das ich euch Allexandrum wil geben
      - l[n=7363]: und allain anttwuertten will
      - l[n=7364]: pey eines manedts zill
      - l[n=7365]: an wer zu ewrn henden,
      - l[n=7366]: das ir an wider wenden
      - l[n=7367]: sein als gar gewaltig seitt
      - l[n=7368]: als ir mein an diser zeit,
      - l[n=7369]: dar umb das er an diser rays
      - l[n=7370]: mir hat gemacht solich vrays.'
      - l[n=7371]: nu was ain sytt pey den tagen,
      - l[n=7372]: 'des die leut gemainchleich phlagen:'
      - l[n=7373]: wer ichts pey seinen gottern swuer
      - l[n=7374]: und dar an mysse fuer,
      - l[n=7375]: an dem rachens irn anden
      - l[n=7376]: und machten in zu offen schanden.
      - l[n=7377]: davon wer swuer pey irm gott,
      - l[n=7378]: der muest das laisten ane spot.
      - l[n=7379]: die herrn doch nit lenger pitten,
      - l[n=7380]: sy sassen auf und ritten.
      - l[n=7381]: da sy die chomen sach,
      - l[n=7382]: 'sy gie gegen in und sprach:'
      - l[n=7383]: "'seyt willikomen an diser zeit,"
      - l[n=7384]: ob ir in trewen chomen seit!'
      - l[n=7385]: 'sy sprachen zu ir offenbar:'
      - l[n=7386]: "'wir chomen in guetten trewn gar '"
      - l[n=7387]: sy gienngen mit ein ander dratt
      - l[n=7388]: allew drew an ainen rat.
      - l[n=7389]: die herrn alle payd
      - l[n=7390]: swuern payde starkch ayd
      - l[n=7391]: auf ir abgot der chunigynne,
      - l[n=7392]: das sy ir dinst und mynne,
      - l[n=7393]: trew und allew er
      - l[n=7394]: furbas erpietten wolten ymmer mer.
      - l[n=7395]: die chunigin gelaubt in das.
      - l[n=7396]: sy sagten ir furbas
      - l[n=7397]: wie in der pot verhaissen hiett
      - l[n=7398]: und was sy in darczue riett.
      - l[n=7399]: "sy sprach: 'ir sults gelauben woll"
      - l[n=7400]: er tuet alles das er soll.'
      - l[n=7401]: die herrn pey ir swester beliben
      - l[n=7402]: die nacht sy frolich vertriben
      - l[n=7403]: mit sambt irm gast,
      - l[n=7404]: den wirtens erlich und vast.
      - l[n=7405]: des morgens do es tag wart,
      - l[n=7406]: der pot gedacht an sein vart,
      - l[n=7407]: er het sich nit ze sawmen,
      - l[n=7408]: er wolt das landt rawmen.
      - l[n=7409]: fuer die chunigynn er do dratt,
      - l[n=7410]: irs urlaubs er patt.
      - l[n=7411]: die chunigin hies in peitten,
      - l[n=7412]: sy jach, sy wolt mit im reitten
      - l[n=7413]: und wolt in selbs belaitten.
      - l[n=7414]: sy hies ir pald beraitten
      - l[n=7415]: all ir gerett
      - l[n=7416]: und ir rais phert.
      - l[n=7417]: sy pat ir prueder paid
      - l[n=7418]: das sy mit ir an das gejaidt
      - l[n=7419]: zu der zeit ritten.
      - l[n=7420]: des mocht sy leicht erpitten,
      - l[n=7421]: wann sy es gern tetten.
      - l[n=7422]: die fraw sich des gejaides het beratten,
      - l[n=7423]: dar umb das sy sicherlich
      - l[n=7424]: irn lieben gast und erlich
      - l[n=7425]: aus irm landt belaitten wolt,
      - l[n=7426]: wann es ir sust nit hiet betocht.
      - l[n=7427]: das gesindt beraitt sich vast.
      - l[n=7428]: die chunigin hies dem gast
      - l[n=7429]: fuͤr ziechen ain zelten phert,
      - l[n=7430]: das was wol hundert markch werd
      - l[n=7431]: mit dem geret das dar auf was.
      - l[n=7432]: Allexander auf es sas.
      - l[n=7433]: das phert was swarez als ain chol,
      - l[n=7434]: all umb und umb geschikcht woll,
      - l[n=7435]: es was dikch und synybell
      - l[n=7436]: und was aus der massen snell.
      - l[n=7437]: der satel was von helffen pain,
      - l[n=7438]: durich legt gar mit edelm gestain.
    - div@rubric[data-level=2]:
      - head: Das die chuniginn Allexandrum von dem lanndt belait.
      - l[n=7439]: Do sy berait wuerden gar,
      - l[n=7440]: die chunigynn nam des potten war.
      - l[n=7441]: er muest zu allen zeytten
      - l[n=7442]: zu nagst pey ir reitten.
      - l[n=7443]: das was ir gier und ir pet.
      - l[n=7444]: do sy in also belaittet hett
      - l[n=7445]: und ir prueder payd
      - l[n=7446]: wol ein halbew tagwaid
      - l[n=7447]: für ir rechte hauptstat,
      - l[n=7448]: die frawen er widerchern pat.
      - l[n=7449]: urlaub er von ir nam
      - l[n=7450]: und von den bruedern alsam.
      - l[n=7451]: die prueder fuert er beseytt
      - l[n=7452]: von den leutten an ain weytt.
      - l[n=7453]: "er sprach: 'ir hern edel und reich,"
      - l[n=7454]: 'wist von mir sicherlich:'
      - l[n=7455]: was ich euch gelobet han,
      - l[n=7456]: das wil ich euch laisten ane wan.
      - l[n=7457]: des sey mein trew ewr phant.'
      - l[n=7458]: damit rakcht er in dew handt,
      - l[n=7459]: er legt sein haubt in ir hendt.
      - l[n=7460]: hie mit hat die red ain endt.
      - l[n=7461]: damit er auch von in rait.
      - l[n=7462]: er het sein gelub und sein aydt
      - l[n=7463]: erloset erlich,
      - l[n=7464]: wann er was selber der chaiser reich
      - l[n=7465]: und er sein haubt an der stat
      - l[n=7466]: in ir hendt geleget hat.
      - l[n=7467]: sy westen nicht das er es was.
      - l[n=7468]: die chunigin hies in furwas
      - l[n=7469]: ir ritter aus dem lande
      - l[n=7470]: belaitten ane schande.
      - l[n=7471]: do er aus dem lande cham
      - l[n=7472]: und es sein herschaft vernam,
      - l[n=7473]: sy warn aus der massen fro.
      - l[n=7474]: sy vragten in aldo
      - l[n=7475]: wie es im wer ergangen.
      - l[n=7476]: wie er gehandelt und gevangen
      - l[n=7477]: also gewesen wer,
      - l[n=7478]: das sagt er in offenbar
      - l[n=7479]: und wie er sich von in ensait
      - l[n=7480]: und wie er lost sein aidt.
      - l[n=7481]: do er das volsaget hat,
      - l[n=7482]: vier ritter nach der fursten rat
      - l[n=7483]: hies er reitten alzuhant
      - l[n=7484]: mit seinen brieffen in das landt,
      - l[n=7485]: er hies si nit lenger beleiben.
      - l[n=7486]: 'die brieff hies er also schreiben:'
    - div@rubric[data-level=2]:
      - head: Das Allexander die chunigynn mit disem brief wirdet.
      - l[n=7487]: "'Wir chaiser Allexander,"
      - l[n=7488]: chunig ob allen chunigen her,
      - l[n=7489]: enpietten lieb und alles guet,
      - l[n=7490]: unsern grues und hochen muett
      - l[n=7491]: der chunigynn von Gramania
      - l[n=7492]: und irn zwain pruedern da.
      - l[n=7493]: wir dankchen euch grasser wirttschaft
      - l[n=7494]: und dar czue aller ern chraft
      - l[n=7495]: die ir uns erpotten habt
      - l[n=7496]: und in ewrm landt gabt.
      - l[n=7497]: ir sult wissen furbas
      - l[n=7498]: das ich es Allexander was
      - l[n=7499]: der pott der zu euch was gesandt,
      - l[n=7500]: wie ich euch wer unbekant.
      - l[n=7501]: ich han mein trew und mein aidt
      - l[n=7502]: geledigt, do ich von euch rait,
      - l[n=7503]: da ich mein haup an der stat
      - l[n=7504]: gelegt in ewr hend hat.
      - l[n=7505]: wir pitten euch das ir zu hant
      - l[n=7506]: zu uns reittet fuer das landt
      - l[n=7507]: auf unser trew sicherlich.
      - l[n=7508]: da well wir uns gar erlich
      - l[n=7509]: mit ein ander slichten
      - l[n=7510]: und frewnttlich verichten.'
    - div@rubric[data-level=2]:
      - head: Das die chuniginn mit den pruedern fuͤr das landt zogt mit Allexandro.
      - l[n=7511]: Do die chuniginn das vernam
      - l[n=7512]: und die prueder allsam,
      - l[n=7513]: sy warn der red gar fro
      - l[n=7514]: und beraitten sich also.
      - l[n=7515]: yr herrn sy besanden
      - l[n=7516]: in allen irn landen
      - l[n=7517]: und zogten reichleich alzuhant
      - l[n=7518]: zu dem chaiser fuer das lanndt.
      - l[n=7519]: do sy der chaiser chomen sach,
      - l[n=7520]: 'zu seinen fuersten er do sprach:'
      - l[n=7521]: "'wir schullen nicht peitten,"
      - l[n=7522]: wir schullen gegen den gesten reytten
      - l[n=7523]: und schullen sy enphachen,
      - l[n=7524]: seind sy uns chomen sind so nachen.'
      - l[n=7525]: do der chaiser zu in cham,
      - l[n=7526]: die chunigin er zu im nam.
      - l[n=7527]: er enphie sy gar tugentlich
      - l[n=7528]: und chust sey gar frewntlich
      - l[n=7529]: an ir mundt an der stet;
      - l[n=7530]: das selb er auch den pruedern tet.
      - l[n=7531]: er fuert sew mit im in das her
      - l[n=7532]: und erpot in michel er.
      - l[n=7533]: do sy die grassen reichait
      - l[n=7534]: und die michel wirdigkait
      - l[n=7535]: und auch die gross welt sachen,
      - l[n=7536]: sy wundert ser und jachen
      - l[n=7537]: das sy weder dort noch hie
      - l[n=7538]: solich zier gesachen nye
      - l[n=7539]: 'noch solich volkch werhaft:'
      - l[n=7540]: er mocht wol mit chraft
      - l[n=7541]: an vechten und an streytten
      - l[n=7542]: all die welt uber reytten.
      - l[n=7543]: der chaiser fuert die chunigynne
      - l[n=7544]: mit irn hern her und hyn
      - l[n=7545]: und zaigt ir sein reichait
      - l[n=7546]: durich das her lannkch und prait.
      - l[n=7547]: er czaigt ir auch den stain
      - l[n=7548]: der do was swer und chlain,
      - l[n=7549]: der im an der selben vart
      - l[n=7550]: aus dem paradeis gegeben wart.
      - l[n=7551]: die chuniginn die enphie das landt
      - l[n=7552]: von dem chaiser alczu hant.
      - l[n=7553]: sy jach, sy wolt im gern geben
      - l[n=7554]: den zins die weil sy solt leben,
      - l[n=7555]: von dem landt alle jar;
      - l[n=7556]: der lies er sey ledig gar.
      - l[n=7557]: der chaiser des nit enlies,
      - l[n=7558]: die herrn er von im pitten hies
      - l[n=7559]: alles das sy wolten,
      - l[n=7560]: das sy das von im haben scholten.
      - l[n=7561]: die herrn fuer in tratten,
      - l[n=7562]: gemainchlich sy in patten
      - l[n=7563]: das er in geruecht zegeben
      - l[n=7564]: zu ainer gab das sy leben
      - l[n=7565]: scholten ymmer ewigklich
      - l[n=7566]: mit den gotten geleich.
      - l[n=7567]: sy wannten das er wer ain got.
      - l[n=7568]: der chayser in die pet verpott;
      - l[n=7569]: er jach, sy solten ir enpern,
      - l[n=7570]: wann er mocht sy nit gewern.
      - l[n=7571]: er sagt in offenbar
      - l[n=7572]: das er selbs todlich wẽr.
      - l[n=7573]: "sy jachen: 'und pistu todlich,"
      - l[n=7574]: wes lestu nicht genuegen dich
      - l[n=7575]: das du also umb verst
      - l[n=7576]: und dein tẽg also verzerst
      - l[n=7577]: mit mue und mit aribait,
      - l[n=7578]: und das du so grass laidt
      - l[n=7579]: aller der welt tuest
      - l[n=7580]: und du doch sterben muest?
      - l[n=7581]: die chunigin von im urlaub nam
      - l[n=7582]: und die herrn alsam
      - l[n=7583]: und rait wider all zu handt
      - l[n=7584]: mit irn herrn in ir landt.
      - l[n=7585]: wein und chost sy sandt
      - l[n=7586]: den herrn genueg aus dem landt.
  - chapter[n=162,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Alexander unterwirft sich das erste indische Land
    - div@rubric[data-level=2]:
      - head: Das der chaiser zogt gegen dem landt Hychiota.
      - l[n=7587]: Der chaiser do nit lenger paitt,
