      - l[n=4973]: so wirt es hertter an der frist
      - l[n=4974]: dann stachl oder ekchel ist.
      - l[n=4975]: sy haben auch ander ros genueg;
      - l[n=4976]: die sind hubsch und gefueg,
      - l[n=4977]: die geporn werdent
      - l[n=4978]: von anderrn rossen auf der erden,
      - l[n=4979]: die gar starkch und werhaft sind
      - l[n=4980]: 'und sind snel als der windt:'
      - l[n=4981]: sy chunnen lauffen snelliklich
      - l[n=4982]: fur sich und auch hinder sich.
      - l[n=4983]: die frawen sind so behendt,
      - l[n=4984]: wann sy den pheill landt aus der hendt
      - l[n=4985]: in die leng oder in die weit,
      - l[n=4986]: so vachent sy in an der selben zeit
      - l[n=4987]: den pheil in die hendt wider
      - l[n=4988]: ee er velt zu der erd nyder.
      - l[n=4989]: nu hab wir euch ein tail gesait
      - l[n=4990]: von des landts gelegenhait;
      - l[n=4991]: ain tail well wir sein verdagen,
      - l[n=4992]: wann es wer vil ze sagen.
    - div@rubric[data-level=2]:
      - head: Das Allexander zu Calistrida umb zynns sand.
