    - l[n=8739]: und zu handt darnach
    - l[n=8740]: der tad im das hercz prach.
  - chapter[n=289,rhyme=aa]:
    - head@editorial[lg=deu-Latn]: Alexanders Begräbnis
    - l[n=8741]: Do sagt man offenwar
