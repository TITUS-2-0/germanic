    - l[n=8855]: sy legten in in ainen sarich,
    - l[n=8856]: der was gemach als ain arich;
    - l[n=8857]: der was von ratem gold geslagen,
    - l[n=8858]: den machten chawm vir getragen.
    - l[n=8859]: dar ein man in legt
    - l[n=8860]: mit allem seinem gerẽt.
    - l[n=8861]: die fuersten hiengen in hin ab,
    - l[n=8862]: mit sambt dem sarich in das grab
